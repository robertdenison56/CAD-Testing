<rect class="track" x="300" y="101" width="360" height="12"/>
<rect class="bar" x="300" y="101" width="203.9" height="12"/>
<line class="ci" x1="488.7" y1="107" x2="519.8" y2="107"/>
<line class="ci" x1="488.7" y1="103" x2="488.7" y2="111"/>
<line class="ci" x1="519.8" y1="103" x2="519.8" y2="111"/>
<text class="ink" x="670" y="114" font-size="12">56.6 [52.4–61.1]</text>
<text class="ink" x="16" y="136" font-size="13" font-weight="600">d1-real: the sample plan sheets</text>
<text class="ink" x="16" y="170" font-size="12">1. qwen/qwen3.5-9b · single · explicit</text>
