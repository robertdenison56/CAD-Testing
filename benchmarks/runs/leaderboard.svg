<line class="rule" x1="300" y1="40" x2="300" y2="256" stroke-dasharray="2 3"/>
<line class="rule" x1="480" y1="40" x2="480" y2="256" stroke-dasharray="2 3"/>
<line class="rule" x1="660" y1="40" x2="660" y2="256" stroke-dasharray="2 3"/>
