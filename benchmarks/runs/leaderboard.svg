<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 240" width="810" height="240" role="img" aria-labelledby="title">
<title id="title">RoadDraft eval leaderboard: effective score by model on each eval set</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .rule { stroke: #b4b3ae; }
.track { fill: #f0efec; } .bar { fill: #2a78d6; } .ci { stroke: #104281; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; } .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; } .rule { stroke: #6b6a65; }
  .track { fill: #383835; } .bar { fill: #3987e5; } .ci { stroke: #b7d3f6; }
}
</style>
<rect class="bg" width="810" height="240"/>
<text class="ink" x="16" y="24" font-size="17" font-weight="600">RoadDraft eval leaderboard</text>
<text class="ink2" x="16" y="40" font-size="11">effective score, 0 to 100, with its 95% interval; one ranking per eval set</text>
<line class="rule" x1="300" y1="40" x2="300" y2="232" stroke-dasharray="2 3"/>
<line class="rule" x1="480" y1="40" x2="480" y2="232" stroke-dasharray="2 3"/>
<line class="rule" x1="660" y1="40" x2="660" y2="232" stroke-dasharray="2 3"/>
<text class="ink2" x="300" y="38" font-size="10" text-anchor="middle">0</text>
<text class="ink2" x="480" y="38" font-size="10" text-anchor="middle">50</text>
<text class="ink2" x="660" y="38" font-size="10" text-anchor="middle">100</text>
<text class="ink" x="16" y="56" font-size="13" font-weight="600">d1-test: seeded sheets</text>
<text class="ink" x="16" y="90" font-size="12">1. qwen/qwen3.5-9b · single · explicit</text>
<rect class="track" x="300" y="77" width="360" height="12"/>
<rect class="bar" x="300" y="77" width="225.0" height="12"/>
<line class="ci" x1="505.8" y1="83" x2="544.0" y2="83"/>
<line class="ci" x1="505.8" y1="79" x2="505.8" y2="87"/>
<line class="ci" x1="544.0" y1="79" x2="544.0" y2="87"/>
<text class="ink" x="670" y="90" font-size="12">62.5 [57.2–67.8]</text>
<text class="ink" x="16" y="112" font-size="13" font-weight="600">d1-real: the sample plan sheets</text>
<text class="ink" x="16" y="146" font-size="12">1. qwen/qwen3.5-9b · single · explicit</text>
<rect class="track" x="300" y="133" width="360" height="12"/>
<rect class="bar" x="300" y="133" width="229.0" height="12"/>
<line class="ci" x1="512.4" y1="139" x2="544.1" y2="139"/>
<line class="ci" x1="512.4" y1="135" x2="512.4" y2="143"/>
<line class="ci" x1="544.1" y1="135" x2="544.1" y2="143"/>
<text class="ink" x="670" y="146" font-size="12">63.6 [59.0–67.8]</text>
<text class="ink" x="16" y="168" font-size="13" font-weight="600">hard-pilots: the harder tasks (pass or fail)</text>
<text class="ink2" x="16" y="196" font-size="12">no ranked run yet</text>
</svg>
