<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadDraft</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #16171b; --panel: #24262b; --panel2: #2d3036; --panel3: #383b42;
    --border: #3a3d45; --text: #d8dbe0; --dim: #8f95a0; --accent: #4f9cf5;
    --accent2: #2f6db3; --ok: #74cf92; --warn: #e5b567; --err: #e57862;
    --canvas: #26282d; --ribbon: #2b2e34; --tabstrip: #1d1f24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: 34px 118px 1fr auto 26px;
    grid-template-columns: 242px 1fr 320px;
    grid-template-areas: "qat qat qat" "ribbon ribbon ribbon"
                         "side canvas log" "cmd cmd cmd"
                         "status status status";
    background: var(--bg); color: var(--text);
    font: 12.5px/1.4 -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    user-select: none;
  }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  svg.ic { display: block; }
  svg.ic * { stroke: currentColor; stroke-width: 1.7; fill: none;
             stroke-linecap: round; stroke-linejoin: round; }
  svg.ic .f { fill: currentColor; stroke: none; }

  /* ---------------------------------------------- quick access toolbar */
  #qat { grid-area: qat; display: flex; align-items: center; gap: 4px;
         padding: 0 10px; background: var(--tabstrip);
         border-bottom: 1px solid #000; }
  #qat .logo { font-weight: 700; font-size: 13px; margin-right: 8px; }
  #qat .logo span { color: var(--accent); }
  .qbtn { padding: 3px 6px; border-radius: 4px; color: var(--dim);
          cursor: pointer; }
  .qbtn:hover { background: var(--panel2); color: var(--text); }
  #qat .proj { color: var(--dim); margin-left: 10px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #qat .grow { flex: 1; }
  #conn { font-size: 11px; color: var(--dim); }
  #conn.bad { color: var(--err); }

  /* --------------------------------------------------------- ribbon */
  #ribbon { grid-area: ribbon; display: flex; flex-direction: column;
            background: var(--ribbon); border-bottom: 1px solid #000; }
  #rtabs { display: flex; gap: 2px; padding: 4px 10px 0;
           background: var(--tabstrip); }
  .rtab { padding: 4px 16px 5px; font-size: 12px; color: var(--dim);
          cursor: pointer; border-radius: 5px 5px 0 0;
          border: 1px solid transparent; border-bottom: none; }
  .rtab:hover { color: var(--text); }
  .rtab.active { background: var(--ribbon); color: var(--text);
                 border-color: #000; font-weight: 600; }
  #rpanels { flex: 1; display: flex; align-items: stretch; gap: 0;
             padding: 5px 6px 3px; overflow-x: auto; }
  .rpanel { display: flex; flex-direction: column; padding: 0 7px;
            border-right: 1px solid var(--border); min-width: 60px;
            flex-shrink: 0; }
  .rpanel:last-child { border-right: none; }
  .rtools { flex: 1; display: flex; align-items: stretch; gap: 3px; }
  .rcap { text-align: center; font-size: 10px; color: var(--dim);
          padding: 2px 0 1px; letter-spacing: .3px; }
  .rbig { display: flex; flex-direction: column; align-items: center;
          justify-content: flex-start; gap: 3px; width: 56px;
          padding: 6px 2px 3px; border-radius: 5px; cursor: pointer;
          color: var(--text); border: 1px solid transparent;
          text-align: center; font-size: 10.5px; line-height: 1.15; }
  .rbig:hover { background: var(--panel3); border-color: var(--border); }
  .rbig.active { background: var(--accent2); border-color: var(--accent);
                 color: #fff; }
  .rbig .ic { color: var(--accent); }
  .rbig.active .ic { color: #fff; }
  .rstack { display: flex; flex-direction: column; gap: 2px;
            justify-content: center; }
  .rsmall { display: flex; align-items: center; gap: 5px; padding: 2px 7px;
            border-radius: 4px; cursor: pointer; font-size: 11px;
            color: var(--text); border: 1px solid transparent;
            white-space: nowrap; }
  .rsmall:hover { background: var(--panel3); border-color: var(--border); }
  .rsmall.active { background: var(--accent2); border-color: var(--accent);
                   color: #fff; }
  .rsmall .ic { color: var(--accent); }
  .rctl { display: flex; flex-direction: column; gap: 5px;
          justify-content: center; }
  .rctl select { background: var(--panel2); color: var(--text);
                 border: 1px solid var(--border); border-radius: 4px;
                 padding: 3px 6px; font-size: 11.5px; max-width: 170px; }
  .rctl label { display: flex; gap: 5px; align-items: center;
                color: var(--dim); font-size: 11px; cursor: pointer; }

  /* ------------------------------------------------------ toolspace */
  aside { grid-area: side; background: var(--panel);
          border-right: 1px solid #000; display: flex;
          flex-direction: column; overflow: hidden; }
  #ts-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
              letter-spacing: .8px; color: var(--dim);
              background: var(--panel2); border-bottom: 1px solid var(--border); }
  #tstree { flex: 1; overflow-y: auto; }
  .tsec { border-bottom: 1px solid var(--border); }
  .tsec-h { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            cursor: pointer; font-size: 11.5px; font-weight: 600;
            color: var(--text); }
  .tsec-h:hover { background: var(--panel2); }
  .tsec-h .tri { color: var(--dim); font-size: 9px; width: 10px; }
  .tsec-h .cnt { color: var(--dim); font-weight: 400; margin-left: auto; }
  .trow { display: flex; align-items: center; gap: 7px;
          padding: 4px 10px 4px 24px; cursor: pointer;
          border-left: 3px solid transparent; font-size: 12px; }
  .trow:hover { background: var(--panel2); }
  .trow.current { border-left-color: var(--accent); background: var(--panel2); }
  .eye { cursor: pointer; width: 15px; text-align: center; color: var(--dim);
         user-select: none; flex: none; font-size: 11px; }
  .eye.on { color: var(--text); }
  .swatch { width: 11px; height: 11px; border-radius: 2px;
            border: 1px solid var(--border); flex: none; }
  .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           flex: 1; }
  .trow .status { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .trow .status.loaded { background: var(--ok); }
  .trow .status.error { background: var(--err); }
  .trow .x { color: var(--dim); padding: 0 3px; }
  .trow .x:hover { color: var(--err); }
  .tempty { padding: 4px 10px 6px 24px; color: var(--dim); font-size: 11.5px; }

  /* ------------------------------------------------- properties panel */
  #props { display: none; flex-direction: column; overflow: hidden;
           flex: none; max-height: 62%; border-top: 1px solid #000; }
  #props.open { display: flex; }
  #props-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
                 letter-spacing: .8px; color: var(--dim);
                 background: var(--panel2);
                 border-bottom: 1px solid var(--border);
                 display: flex; align-items: center; gap: 8px; }
  #props-id { color: var(--text); font-weight: 400; letter-spacing: 0;
              flex: 1; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; font-family: ui-monospace, Menlo, monospace;
              font-size: 11px; }
  #props-close { cursor: pointer; padding: 0 2px; }
  #props-close:hover { color: var(--err); }
  #props-body { overflow-y: auto; padding: 2px 0 8px; }
  .psec { padding: 8px 12px 3px; font-size: 10px; font-weight: 700;
          letter-spacing: .6px; color: var(--accent); }
  .prow { display: grid; grid-template-columns: 82px 1fr;
          align-items: center; gap: 7px; padding: 2px 12px; min-width: 0; }
  .prow > label { color: var(--dim); font-size: 11px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .prow input[type=text], .prow select {
      width: 100%; min-width: 0; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 3px 6px; font: inherit;
      font-size: 11.5px; outline: none; }
  .prow input[type=text]:focus, .prow select:focus {
      border-color: var(--accent); }
  .prow .ro { font-size: 11.5px; color: var(--text); padding: 3px 0;
              user-select: text; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .prow input[type=checkbox] { justify-self: start; margin: 3px 0; }
  .picells { display: grid; grid-template-columns: 1fr 1fr 0.8fr 12px;
             gap: 3px; align-items: center; }
  .prow.pirow { grid-template-columns: 44px 1fr; }
  .picells input[type=text] { min-width: 0; width: 100%; padding: 3px 4px; }
  .picells .x { color: var(--dim); cursor: pointer; text-align: center; }
  .picells .x:hover { color: var(--err); }
  .colorwrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .colorwrap select { flex: 1; }
  .colorwrap input[type=color] { width: 26px; height: 22px; padding: 1px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); cursor: pointer; flex: none; }
  .phint { padding: 5px 12px 0; color: var(--dim); font-size: 10.5px; }

  /* --------------------------------------------------------- canvas */
  main { grid-area: canvas; display: flex; flex-direction: column;
         overflow: hidden; background: var(--canvas); }
  #viewwrap { flex: 1; overflow: auto; position: relative; }
  #stage { position: relative; display: block; margin: 12px auto;
           width: calc(100% - 24px); }
  #view { display: block; width: 100%;
          box-shadow: 0 3px 16px rgba(0,0,0,.55); }
  /* model space fills its canvas edge to edge, as in CAD; sheets stay paper */
  #stage.fill { position: absolute; inset: 0; margin: 0; width: auto; }
  #stage.fill #view { height: 100%; box-shadow: none; }
  #ovl { position: absolute; inset: 0; width: 100%; height: 100%;
         pointer-events: none; }
  #ovl .ch { stroke: #7ab5ff88; stroke-width: 1;
             vector-effect: non-scaling-stroke; }
  #ovl .rb { stroke: var(--accent); stroke-width: 1.4; fill: none;
             stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
  #ovl .hlglow { stroke: #e5b56766; stroke-width: 8; fill: none;
                 stroke-linecap: round; stroke-linejoin: round;
                 vector-effect: non-scaling-stroke; }
  #ovl .hlcore { stroke: #ffd27a; stroke-width: 2.2; fill: none;
                 stroke-linecap: round; stroke-linejoin: round;
                 vector-effect: non-scaling-stroke; }
  #ovl .hlbox { stroke: #ffd27a; stroke-width: 1.6; fill: #e5b56733;
                vector-effect: non-scaling-stroke; }
  #ovl .mark { fill: var(--accent); stroke: #10121a; stroke-width: 1;
               vector-effect: non-scaling-stroke; }
  /* grips: AutoCAD's blue squares on a selected entity, red once picked up */
  #ovl .grip { fill: var(--accent); stroke: #0b0d12; stroke-width: 1;
               vector-effect: non-scaling-stroke; }
  #ovl .grip.sec { fill: var(--canvas); stroke: var(--accent);
                   stroke-width: 1.6; }
  #ovl .grip.over { fill: #9ccbff; }
  #ovl .grip.hot { fill: var(--err); stroke: #2a0d07; }
  /* a PI whose curve does not fit its legs, in a preview */
  #ovl .bad { fill: none; stroke: var(--err); stroke-width: 2;
              vector-effect: non-scaling-stroke; }
  /* object snap: AutoCAD's yellow marker, its shape naming the kind */
  #ovl .snapmark { fill: none; stroke: #ffde59; stroke-width: 2;
                   vector-effect: non-scaling-stroke; }
  #ovl .snapdot { fill: #ffde59; stroke: none; }
  #ovl .snaplabel, #ovl .measlabel { paint-order: stroke; stroke: #000000cc;
      stroke-linejoin: round; font-family: -apple-system, "Segoe UI", sans-serif; }
  #ovl .snaplabel { fill: #ffde59; }
  /* measurements: they stay on screen until the tool changes or Esc */
  #ovl .meas { stroke: #6fe3c4; stroke-width: 1.6; fill: none;
               vector-effect: non-scaling-stroke; }
  #ovl .measdash { stroke: #6fe3c4; stroke-width: 1.2; fill: none;
                   stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  #ovl .measdot { fill: #6fe3c4; stroke: #10121a; stroke-width: 1;
                  vector-effect: non-scaling-stroke; }
  #ovl .measlabel { fill: #6fe3c4; }
  #zoomer { position: absolute; right: 14px; bottom: 12px; display: flex;
            gap: 5px; background: rgba(22,23,27,.92);
            border: 1px solid var(--border); border-radius: 7px;
            padding: 4px 6px; align-items: center; z-index: 5; }
  .zbtn { padding: 2px 9px; background: var(--panel2); color: var(--text);
          border: 1px solid var(--border); border-radius: 5px;
          cursor: pointer; font-size: 12px; }
  .zbtn:hover { border-color: var(--accent); }
  #zoompct { color: var(--dim); font-size: 11px; min-width: 34px;
             text-align: center; }
  #ltabs { display: flex; gap: 2px; padding: 3px 8px 0;
           background: var(--panel); border-top: 1px solid #000; }
  .ltab { padding: 3px 16px 4px; font-size: 11.5px; background: var(--panel2);
          color: var(--dim); cursor: pointer; border-radius: 0 0 6px 6px;
          border: 1px solid var(--border); border-top: none; }
  .ltab.active { background: #e8e8e8; color: #222; font-weight: 600; }
  .ltab.plus { color: var(--accent); }

  /* ------------------------------------------------------------ log */
  #logpane { grid-area: log; background: var(--panel);
             border-left: 1px solid #000; display: flex;
             flex-direction: column; overflow: hidden; }
  #log-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
               letter-spacing: .8px; color: var(--dim);
               background: var(--panel2);
               border-bottom: 1px solid var(--border); }
  #log { flex: 1; overflow-y: auto; padding: 6px 10px; font-size: 12px;
         user-select: text; }
  .entry { margin-bottom: 6px; white-space: pre-wrap;
           word-break: break-word; }
  .entry .echo { color: var(--dim); }
  .entry .ok { color: var(--ok); }
  .entry .warn { color: var(--warn); }
  .entry .err { color: var(--err); }
  .entry .hint { color: var(--dim); }
  .entry summary { color: var(--accent); cursor: pointer; font-size: 11px; }
  .entry pre { margin: 3px 0 0; padding: 6px 8px; background: var(--bg);
               border: 1px solid var(--border); border-radius: 5px;
               overflow-x: auto; max-height: 240px; }

  /* ---------------------------------------------------- command bar */
  #cmdbar { grid-area: cmd; display: flex; gap: 8px; padding: 7px 12px;
            background: var(--panel); border-top: 1px solid #000;
            align-items: center; }
  #prompt { color: var(--accent); white-space: nowrap; }
  #cmd { flex: 1; background: var(--bg); border: 1px solid var(--border);
         color: var(--text); border-radius: 6px; padding: 6px 10px;
         outline: none; }
  #cmd:focus { border-color: var(--accent); }
  #run { padding: 5px 14px; background: var(--panel2); color: var(--text);
         border: 1px solid var(--border); border-radius: 6px;
         cursor: pointer; }

  /* ------------------------------------------------------ status bar */
  #statusbar { grid-area: status; display: flex; gap: 14px;
               align-items: center; padding: 0 12px;
               background: var(--tabstrip); border-top: 1px solid #000;
               color: var(--dim); font-size: 11px; white-space: nowrap;
               overflow: hidden; }
  #st-coord { min-width: 190px; color: var(--text); }
  .sttog { padding: 1px 9px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--border); }
  .sttog.on { background: var(--accent2); color: #fff;
              border-color: var(--accent); }
  #st-annoscale { background: transparent; color: var(--text); font: inherit;
    font-size: 11px; border: 1px solid var(--dim); border-radius: 4px;
    padding: 1px 4px; cursor: pointer; }
  #st-tool { color: var(--text); }
  #snapcfg { padding: 1px 5px; margin-left: -10px; }
  #snapmenu { position: fixed; bottom: 30px; display: none; z-index: 40;
              background: var(--panel); border: 1px solid var(--border);
              border-radius: 8px; padding: 8px 12px; color: var(--text);
              box-shadow: 0 6px 22px rgba(0,0,0,.5); font-size: 12px; }
  #snapmenu.open { display: block; }
  #snapmenu h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .6px;
                 color: var(--dim); }
  #snapmenu label { display: flex; gap: 7px; align-items: center;
                    padding: 2px 0; cursor: pointer; }
  #snapmenu .snaphint { color: var(--dim); font-size: 10.5px; margin-top: 6px;
                        max-width: 230px; white-space: normal; }

  /* ---------------------------------------------------------- modal */
  #modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55);
              display: none; align-items: center; justify-content: center;
              z-index: 50; }
  #modal { background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; padding: 16px 18px; min-width: 330px; }
  #modal h3 { margin: 0 0 12px; font-size: 14px; }
  #modal .row { display: flex; align-items: center; gap: 10px;
                margin-bottom: 9px; }
  #modal .row label { flex: 1; color: var(--dim); font-size: 12px; }
  #modal .row input, #modal .row select, #modal .row textarea {
      width: 220px; background: var(--bg);
      border: 1px solid var(--border); color: var(--text); border-radius: 5px;
      padding: 5px 8px; outline: none; font: inherit; }
  #modal .row textarea { resize: vertical; font-family: ui-monospace, Menlo,
      monospace; font-size: 12px; }
  #modal .row.wide { flex-direction: column; align-items: stretch; gap: 5px; }
  #modal .row.wide textarea { width: 100%; min-width: 420px; }
  #modal .actions { display: flex; justify-content: flex-end; gap: 8px;
                    margin-top: 14px; }
  #modal .actions .zbtn { padding: 4px 16px; }
  #modal .actions .zbtn.primary { background: var(--accent2);
                                  border-color: var(--accent); }
  #modal .actions .zbtn.left { margin-right: auto; }
  #modal .msg { color: var(--dim); max-width: 380px; }
</style>
</head>
<body>
  <div id="qat">
    <div class="logo">Road<span>Draft</span></div>
    <div class="qbtn" id="q-new" title="New drawing (⌘N)"></div>
    <div class="qbtn" id="q-open" title="Open a drawing (⌘O)"></div>
    <div class="qbtn" id="q-save" title="Save (⌘S)"></div>
    <div class="qbtn" id="q-saveas" title="Save As (⇧⌘S)"></div>
    <div class="qbtn" id="q-undo" title="Undo"></div>
    <div class="qbtn" id="q-redo" title="Redo"></div>
    <div class="proj" id="proj">…</div>
    <div class="grow"></div>
    <span id="conn">connecting…</span>
  </div>

  <div id="ribbon">
    <div id="rtabs"></div>
    <div id="rpanels"></div>
  </div>

  <aside>
    <div id="ts-title">TOOLSPACE</div>
    <div id="tstree"></div>
    <div id="props">
      <div id="props-title">PROPERTIES<span id="props-id"></span>
        <span id="props-close" title="deselect (Esc)">✕</span></div>
      <div id="props-body"></div>
    </div>
  </aside>

  <main>
    <div id="viewwrap">
      <div id="stage">
        <img id="view" alt="drawing view">
        <svg id="ovl" preserveAspectRatio="none"></svg>
      </div>
      <div id="zoomer">
        <div class="zbtn" id="zout">−</div>
        <div id="zoompct">fit</div>
        <div class="zbtn" id="zin">+</div>
        <div class="zbtn" id="zfit">Fit</div>
        <div class="zbtn" id="zpng" title="open PNG">⤢</div>
      </div>
    </div>
    <div id="ltabs"></div>
  </main>

  <div id="logpane">
    <div id="log-title">COMMAND LOG</div>
    <div id="log" class="mono"></div>
  </div>

  <div id="cmdbar" class="mono">
    <span id="prompt">RD [model]&gt;</span>
    <input id="cmd" autocomplete="off" spellcheck="false"
           placeholder="Type a command — help lists everything. Or pick a ribbon tool and click.">
    <div class="zbtn" id="run">Run</div>
  </div>

  <div id="statusbar">
    <span id="st-coord"></span>
    <span class="sttog" id="tog-ortho" title="Constrain drawing to horizontal/vertical (F8)">ORTHO</span>
    <span class="sttog on" id="tog-osnap" title="Object snap (F3): picks jump to endpoints, midpoints, centers, intersections and alignment design points; ▾ chooses which">OSNAP</span>
    <span class="sttog" id="snapcfg" title="Object snap modes">▾</span>
    <select id="st-annoscale" title="Annotation scale"></select>
    <span id="st-tool"></span>
    <span class="grow" style="flex:1"></span>
    <span id="st-journal"></span>
    <span id="st-entities"></span>
  </div>

  <div id="snapmenu"></div>
  <div id="modal-bg"><div id="modal"></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const S = { space: "model", rev: -1, zoom: 0, history: [], hIdx: 0, names: [],
            state: null, view: null, modelBounds: null, tool: "select",
            pts: [], cursor: null, stationPicks: [], dimPick: null,
            dimBusy: false, selected: null, grip: null, gripHover: null,
            ribbonTab: "Home", dpi: 130, frames: true, dark: true,
            ortho: false, alignRadius: 800,
            // object snap: on, these modes; the snap under the cursor
            osnap: true, snap: null, snapBusy: false, snapPending: null,
            snapModes: new Set(["endpoint", "midpoint", "center", "intersection",
                                "perpendicular", "insertion", "design"]),
            // offset / fillet / measure: picked entities and the numbers in use
            picks: [], meas: [], offsetDist: 12, filletRadius: 25,
            travLegs: "N 45°00'00\" E 100\n90 R 100",
            // modify tools: is the selection settled, and the numbers in use
            selDone: false, chamfer: [10, 10], lengthenBy: 10,
            hatchPattern: "ANSI31", hatchScale: null, pointDesc: "",
            staoffPts: "30+00@12R\n31+20@24R\n36+00@24R\n36+00@12R",
            tsOpen: { layers: true, sheets: true, refs: true, alignments: true } };

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getJSON = async p => (await fetch(p)).json();
const postJSON = async (p, body) => (await fetch(p, { method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body) })).json();

// ------------------------------------------------------------------- log
function logHTML(html) {
  const div = document.createElement("div");
  div.className = "entry"; div.innerHTML = html;
  $("log").appendChild(div);
  while ($("log").children.length > 300) $("log").firstChild.remove();
  $("log").scrollTop = $("log").scrollHeight;
}
const logEcho = line => logHTML(`<span class="echo">&gt; ${esc(line)}</span>`);
const logHint = m => logHTML(`<span class="hint">${esc(m)}</span>`);
function jsonBlock(obj, label) {
  const text = JSON.stringify(obj, null, 2);
  return `<details${text.length < 500 ? " open" : ""}><summary>${esc(label)}` +
         `</summary><pre>${esc(text.length > 20000 ?
           text.slice(0, 20000) + "\n…" : text)}</pre></details>`;
}
function logResult(res) {
  if (!res) return;
  if (res.ok) {
    let html = `<span class="ok">${esc(res.message || "ok")}</span>`;
    (res.warnings || []).forEach(w => {
      html += `<br><span class="warn">⚠ ${esc(w)}</span>`; });
    const extra = { ...res };
    ["ok","name","message","warnings","command_id","created","modified",
     "deleted"].forEach(k => delete extra[k]);
    if (res.path) { html += `<br><span class="hint">→ ${esc(res.path)}</span>`;
                    delete extra.path; delete extra.size_bytes; }
    if (Object.keys(extra).length) html += jsonBlock(extra, "result data");
    logHTML(html);
  } else {
    const e = res.error || {};
    let html = `<span class="err">✗ ${esc(e.type || "error")}: ` +
               `${esc(e.message || "failed")}</span>`;
    if (e.hint) html += `<br><span class="hint">hint: ${esc(e.hint)}</span>`;
    if (e.example) html += jsonBlock(e.example, "valid example");
    logHTML(html);
  }
}

// ------------------------------------------------------- coordinate maps
function evtSpace(ev) {
  const r = $("view").getBoundingClientRect();
  const u = (ev.clientX - r.left) / r.width;
  const v = (ev.clientY - r.top) / r.height;
  if (!S.view) return null;
  if (S.view.kind === "model") {
    const b = S.view.bounds;
    return [b[0] + u * (b[2] - b[0]), b[3] - v * (b[3] - b[1])];
  }
  const [W, H] = S.view.sizeIn;
  return [u * W, H - v * H];
}
function spacePx(p) {
  const img = $("view");
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (S.view.kind === "model") {
    const b = S.view.bounds;
    return [(p[0] - b[0]) / (b[2] - b[0]) * nw,
            (b[3] - p[1]) / (b[3] - b[1]) * nh];
  }
  const [W, H] = S.view.sizeIn;
  return [p[0] / W * nw, (H - p[1]) / H * nh];
}
function unitsPerPx() {
  const r = $("view").getBoundingClientRect();
  if (!S.view || !r.width) return 1;
  if (S.view.kind === "model") {
    const b = S.view.bounds; return (b[2] - b[0]) / r.width;
  }
  return S.view.sizeIn[0] / r.width;
}
// Overlay geometry is drawn in the image's own pixels: this is how many of
// them go to one on-screen pixel, so a mark can be sized to the screen.
function pxScale() {
  const img = $("view"), r = img.getBoundingClientRect();
  return r.width && img.naturalWidth ? img.naturalWidth / r.width : 1;
}
const fmtPt = p => S.view && S.view.kind === "model"
  ? `${p[0].toFixed(2)}, ${p[1].toFixed(2)} ft`
  : `${p[0].toFixed(3)}, ${p[1].toFixed(3)} in`;

// ------------------------------------------------------------ canvas img
function imgURL() {
  let url = `/render/${encodeURIComponent(S.space)}.png?rev=${S.rev}` +
            `&dpi=${S.dpi}&frames=${S.frames ? 1 : 0}`;
  if (S.space === "model") {
    if (S.dark) url += "&theme=dark";
    if (S.modelBounds)
      url += `&bounds=${S.modelBounds.map(v => v.toFixed(4)).join(",")}`;
    const box = $("viewwrap").getBoundingClientRect();  // the shape it fills
    if (box.width > 0 && box.height > 0)
      url += `&aspect=${(box.width / box.height).toFixed(4)}`;
  }
  return url;
}
let canvasToken = 0;
async function updateCanvas() {
  applyZoom();  // model space fills the canvas; a sheet sits on it as paper
  const tok = ++canvasToken;
  const resp = await fetch(imgURL());
  if (tok !== canvasToken) return;
  const kind = resp.headers.get("X-RD-Kind");
  if (kind === "model") {
    S.view = { kind, bounds: resp.headers.get("X-RD-Bounds")
                             .split(",").map(Number) };
    // a zoomed window follows what is shown: widened to the canvas's shape
    if (S.modelBounds) S.modelBounds = S.view.bounds.slice();
  }
  else if (kind === "sheet")
    S.view = { kind, sizeIn: resp.headers.get("X-RD-Size-In")
                             .split(",").map(Number) };
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const img = $("view");
  const old = img.dataset.obj;
  img.onload = () => {
    if (old) URL.revokeObjectURL(old);
    clearPendingZoom();
    if (S.view.kind === "model" && !fitsCanvas()) refitCanvas();
    $("ovl").setAttribute("viewBox",
      `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    drawOverlay();
  };
  img.dataset.obj = url; img.src = url;
}

function renderRibbon() {
  const tabs = $("rtabs"); tabs.innerHTML = "";
  Object.keys(RIBBON).forEach(name => {
    const t = document.createElement("div");
    t.className = "rtab" + (name === S.ribbonTab ? " active" : "");
    t.textContent = name;
    t.onclick = () => { S.ribbonTab = name; renderRibbon(); };
    tabs.appendChild(t);
  });
  const panels = $("rpanels"); panels.innerHTML = "";
  RIBBON[S.ribbonTab].forEach(pdef => {
    const panel = document.createElement("div");
    panel.className = "rpanel";
    const tools = document.createElement("div");
    tools.className = "rtools";
    pdef.items.forEach(item => tools.appendChild(ribbonItem(item)));
    const cap = document.createElement("div");
    cap.className = "rcap"; cap.textContent = pdef.caption;
    panel.append(tools, cap);
    panels.appendChild(panel);
  });
}
function ribbonItem(item) {
  if (item.t === "stack") {
    const stack = document.createElement("div");
    stack.className = "rstack";
    item.items.forEach(sub => {
      const b = document.createElement("div");
      b.className = "rsmall" + (sub.tool && S.tool === sub.tool
                                ? " active" : "");
      b.innerHTML = icon(sub.icon, 15) + `<span>${esc(sub.label)}</span>`;
      b.onclick = () => sub.tool ? setTool(sub.tool) : ribbonAct(sub.act);
      stack.appendChild(b);
    });
    return stack;
  }
  if (item.t === "layerctl") {
    const box = document.createElement("div");
    box.className = "rctl";
    const sel = document.createElement("select");
    sel.id = "riblayer";
    (S.state ? S.state.layers : []).forEach(layer => {
      const o = document.createElement("option");
      o.value = layer.name; o.textContent = layer.name;
      o.selected = S.state && layer.name === S.state.current_layer;
      sel.appendChild(o);
    });
    sel.onchange = async () => logResult(await postJSON("/api/execute",
      { command: "set_current_layer", params: { name: sel.value } }));
    const nb = document.createElement("div");
    nb.className = "rsmall";
    nb.innerHTML = icon("newlayer", 15) + "<span>New Layer…</span>";
    nb.onclick = () => ribbonAct("newlayer");
    box.append(sel, nb);
    return box;
  }
  if (item.t === "displayctl") {
    const box = document.createElement("div");
    box.className = "rctl";
    box.innerHTML =
      `<label>DPI <select id="rdpi">` +
      [96, 130, 200].map(v =>
        `<option${v === S.dpi ? " selected" : ""}>${v}</option>`).join("") +
      `</select></label>` +
      `<label><input type="checkbox" id="rframes"` +
      `${S.frames ? " checked" : ""}> viewport frames</label>` +
      `<label><input type="checkbox" id="rdark"` +
      `${S.dark ? " checked" : ""}> dark model canvas</label>`;
    setTimeout(() => {
      if (!$("rdpi")) return;  // the tab was left before this ran
      $("rdpi").onchange = e => { S.dpi = +e.target.value; updateCanvas(); };
      $("rframes").onchange = e => { S.frames = e.target.checked;
                                     updateCanvas(); };
      $("rdark").onchange = e => { S.dark = e.target.checked;
                                   updateCanvas(); };
    });
    return box;
  }
  const b = document.createElement("div");
  b.className = "rbig" + (item.tool && S.tool === item.tool ? " active" : "");
  b.innerHTML = icon(item.icon, 26) + `<span>${esc(item.label)}</span>`;
  b.title = item.tool && TOOLS[item.tool] ? TOOLS[item.tool].hint : item.label;
  b.onclick = () => item.tool ? setTool(item.tool) : ribbonAct(item.act);
  return b;
}
async function ribbonAct(act) {
  const prefill = v => { $("cmd").value = v; $("cmd").focus(); };
  if (act === "undo" || act === "redo")
    logResult(await postJSON("/api/execute", { command: act, params: {} }));
  else if (act === "staoff") await staoffDialog();
  else if (act === "along") await alongDialog();
  else if (act === "list") await listSelected();
  else if (act === "props") {
    if (S.selected) renderProps();
    else logHint("select an entity first (Select tool) — its properties " +
                 "open in the panel below the Toolspace");
  }
  else if (act === "toolspace") {
    const aside = document.querySelector("aside");
    aside.style.display = aside.style.display === "none" ? "" : "none";
  }
  else if (act === "table") prefill(S.space === "model"
    ? 'table position=1200,900 title="CURVE DATA" columns=[{"header":"CURVE","width":80},{"header":"R","width":100}] rows=[["C-1","800.00"]] text_height=8'
    : 'table position=26,8 title="CURVE DATA" columns=[{"header":"CURVE","width":1.0},{"header":"R","width":1.2}] rows=[["C-1","800.00\'"]] text_height=0.12');
  else if (act === "defblock") prefill(
    'block MARKER entities=[{"type":"circle","center":[0,0],"radius":1},' +
    '{"type":"line","start":[-1,0],"end":[1,0]}]');
  else if (act === "attachref") {
    const v = await openForm("Attach reference (basefile)", [
      { key: "name", label: "Reference name", value: "SURVEY" },
      { key: "path", label: "Path to the basefile (relative to this file)",
        value: "examples/output/demo.rdoc.json" },
      { key: "offset", label: "Offset x,y", value: "0,0" },
      { key: "scale", label: "Scale", value: "1" },
      { key: "true_scale", label: "True scale (convert units)", value: "yes",
        options: ["yes", "no"] },
      { key: "model", label: "Basefile model (model or a sheet name)",
        value: "model" },
      { key: "nest_depth", label: "Nest depth (0 = no nesting)", value: "0" }]);
    if (v) {
      const off = v.offset.split(",").map(Number);
      logResult(await postJSON("/api/execute", { command: "attach_reference",
        params: { name: v.name, path: v.path, space: S.space,
                  offset: off.length === 2 && off.every(n => !isNaN(n))
                          ? off : [0, 0],
                  scale: parseFloat(v.scale) || 1,
                  true_scale: v.true_scale !== "no",
                  model: v.model.trim() || "model",
                  nest_depth: Math.max(0, Math.min(5,
                    parseInt(v.nest_depth, 10) || 0)) } }));
    }
  }
  else if (act === "reloadrefs")
    logResult(await postJSON("/api/execute",
      { command: "reload_references", params: {} }));
  else if (act === "detachref") prefill("xdetach NAME");
  else if (act === "newsheet") {
    const v = await openForm("New sheet", [
      { key: "name", label: "Sheet name", value:
        `C-${(S.state ? S.state.sheets.length : 0) + 101}` },
      { key: "size", label: "Size", value: "ANSI_D",
        options: ["ANSI_A", "ANSI_B", "ANSI_C", "ANSI_D", "ARCH_D",
                  "ARCH_E"] }]);
    if (v) {
      const r = await postJSON("/api/execute", { command: "create_sheet",
        params: { name: v.name, size: v.size } });
      logResult(r);
      if (r.ok) setSpace(r.created[0]);
    }
  }
  else if (act === "titleblock") prefill(S.space !== "model"
    ? `titleblock ${spaceLabel()} project="PROJECT" sheet_title="ROADWAY PLAN" sheet_number=${spaceLabel()}`
    : "titleblock C-101 project=\"PROJECT\"");
  else if (act === "newlayer")
    prefill("mklayer V-NEW color=red linetype=continuous lineweight_mm=0.35");
  else if (act === "print") {
    const onSheet = S.space !== "model";
    const sheets = (S.state && S.state.sheets || []).map(s => s.name);
    const current = "current: " + (onSheet ? spaceLabel() : "model space");
    const v = await openForm("Print to PDF", [
      { key: "what", label: "Print", value: current,
        options: [current, "model space", "all sheets"].concat(sheets) },
      { key: "paper", label: "Paper",
        value: onSheet ? "(same as sheet)" : "ANSI_D",
        options: ["(same as sheet)", "ANSI_A", "ANSI_B", "ANSI_C", "ANSI_D",
                  "ARCH_D", "ARCH_E"] },
      { key: "orientation", label: "Orientation", value: "landscape",
        options: ["landscape", "portrait"] },
      { key: "scale", label: "Scale (fit · 1:2 · 50% · ft/in in model)",
        value: "fit" },
      { key: "area", label: "Model area",
        value: S.modelBounds ? "current view" : "extents",
        options: ["current view", "extents"] },
      { key: "monochrome", label: "Monochrome", value: "no",
        options: ["no", "yes"] }]);
    if (!v) return;
    const params = {};
    if (v.what === current) params.space = onSheet ? S.space : "model";
    else if (v.what === "model space") params.space = "model";
    else if (v.what !== "all sheets") params.space = v.what;
    if (v.paper !== "(same as sheet)") params.paper = v.paper;
    if (v.orientation !== "landscape") params.orientation = v.orientation;
    const scale = (v.scale || "").trim();
    if (scale && scale.toLowerCase() !== "fit")
      params.scale = isNaN(Number(scale)) ? scale : Number(scale);
    if (params.space === "model" && v.area === "current view" && S.modelBounds)
      params.bounds = S.modelBounds;
    if (v.monochrome === "yes") params.monochrome = true;
    logEcho("print " + JSON.stringify(params));
    const r = await postJSON("/api/query", { query: "print_pdf", params });
    if (!r.ok) { logResult(r); return; }
    logHTML(`<span class="ok">printed ${r.page_count} page` +
      `${r.page_count === 1 ? "" : "s"}${r.monochrome ? ", monochrome" : ""}` +
      `</span>` + (r.pages || []).map(pg =>
        `<br><span class="hint">${esc(pg.space)} → ${esc(pg.paper)} ` +
        `(${pg.paper_in[0]} × ${pg.paper_in[1]} in) at ${esc(pg.scale)}</span>`)
        .join("") + `<br><span class="hint">→ ${esc(r.path)}</span>`);
  }
  else if (act === "dxf" || act === "pdf") {
    logEcho(act);
    logResult(await postJSON("/api/query",
      { query: act === "dxf" ? "export_dxf" : "export_pdf", params: {} }));
  }
  else if (["new", "open", "save", "saveas"].includes(act)) await fileAct(act);
  else if (act === "journal") {   // kept beside the drawing
    logResult(await postJSON("/api/query", { query: "save_journal",
      params: { path: S.state.file.journal } }));
  }
  else if (act === "editalign") {
    const a = alignNames();
    if (!a.length) { logHint("no alignments yet — lay one out with the " +
                             "Alignment tool (G)"); return; }
    const v = a.length === 1 ? { name: a[0] } : await openForm(
      "Edit alignment", [{ key: "name", label: "Alignment", value: a[0],
                           options: a }]);
    if (v) { setTool("select"); selectAlignment(v.name); }
  }
  else if (act === "drawalign") {
    const a = alignNames();
    prefill(`drawalign ${a[0] || "NAME"} layer=` +
            (S.state ? S.state.current_layer : "0"));
  }
  else if (act === "curvetable") {
    const a = alignNames();
    if (S.space === "model")
      logHint("curve tables go on sheets — switch to a sheet tab (or " +
              "Insert ▸ New Sheet), then run the prefilled command");
    prefill(`curvetable 24,8.5 ${a[0] || "NAME"}`);
  }
  else if (act === "label") {
    const a = alignNames();
    if (!a.length) {
      logHint("no alignments yet — create one with the Alignment tool (G) " +
              "or: alignment NAME x,y x,y,R x,y begin_station=10+00");
      return;
    }
    const v = await openForm("Place label", [
      { key: "alignment", label: "Alignment", value: a[0], options: a },
      { key: "anchor", label: "Anchor (PC-1, T-2, MC-1, 18+00@25L…)",
        value: "PC-1" },
      { key: "kind", label: "Kind", value: "(from anchor)",
        options: ["(from anchor)", "station", "pc", "pt", "pi", "mc", "pcc",
                  "prc", "bearing", "begin", "end", "equation", "curve_data",
                  "custom"] },
      { key: "content", label: "Content (custom / override)", value: "" },
      { key: "side", label: "Side", value: "(default)",
        options: ["(default)", "left", "right"] },
      { key: "rotation", label: "Rotation", value: "along",
        options: ["along", "perpendicular", "horizontal"] }]);
    if (v) {
      const params = { alignment: v.alignment, anchor: v.anchor.trim(),
                       rotation: v.rotation };
      if (v.kind !== "(from anchor)") params.kind = v.kind;
      if (v.content.trim()) params.content = v.content;
      if (v.side !== "(default)") params.side = v.side;
      await exec("place_label", params);
    }
  }
  else if (act === "landxml") {
    logEcho("landxml");
    logResult(await postJSON("/api/query",
      { query: "export_landxml", params: {} }));
  }
  else if (act === "snaps") toggleSnapMenu(true);
  else if (act === "zoomin") zoomBtn(0.8);
  else if (act === "zoomout") zoomBtn(1.25);
  else if (act === "zoomfit") { S.zoom = 0; S.modelBounds = null;
    applyZoom(); updateCanvas(); }

// Constrain a point to horizontal or vertical from an anchor — what ORTHO
// (F8) and a held Shift do: whichever axis the cursor has travelled furthest
// along wins, and the other keeps the anchor's value.
function orthoFrom(anchor, pt, ev) {
  if (!(ev.shiftKey || S.ortho) || !anchor) return pt;
  return Math.abs(pt[0] - anchor[0]) >= Math.abs(pt[1] - anchor[1])
    ? [pt[0], anchor[1]] : [anchor[0], pt[1]];

  const sq = p => p[0] * p[0] + p[1] * p[1];
  return [(sq(a) * (b[1] - c[1]) + sq(b) * (c[1] - a[1]) +
           sq(c) * (a[1] - b[1])) / d,

async function toolClick(pt, ev) {

  } else if (tool === "select") {
    const hits = await hitAt(pt, 8, true);
    if (hits.length) {
      if (S.selected && S.selected.id === hits[0].id) return;  // already shown
      const info = await postJSON("/api/query",
        { query: "get_entity", params: { id: hits[0].id } });
      const anchor = info.ok && !info.reference && info.entity.anchor;
      if (anchor && anchor.kind === "element" && alignmentOf(anchor.alignment)) {
        // a drawn alignment element: what is selected is the alignment
        if (!(S.selected && S.selected.alignment === anchor.alignment))
          selectAlignment(anchor.alignment);
        return;
      }
      if (info.ok) {
        S.selected = { id: hits[0].id, bbox: info.bbox, entity: info.entity,
                       reference: info.reference || null,
                       properties: info.properties || null };
        renderProps();
        if (info.reference)
          logHTML(`<span class="hint">located ${esc(hits[0].id)} (` +
            `${esc(info.entity.type)}) in reference ${esc(info.reference)}, ` +
            `level ${esc(info.entity.layer)} — read-only; edit the basefile ` +
            `and Reload Refs</span>`);
        else
          logHTML(`<span class="hint">selected ${esc(hits[0].id)} (` +
            `${esc(info.entity.type)}) on layer ${esc(info.entity.layer)} — ` +
            `drag a grip to edit the geometry, or type values in the ` +
            `Properties panel; Enter/double-click opens the full editor, ` +
            `Delete erases</span>`);
      }
    } else { S.selected = null; renderProps(); }
  } else if (tool === "refclip") {
    S.pts.push(pt);
  } else if (tool === "traverse") {
    // started from a snapped line end, the traverse carries on from that line
    const fromEnd = sp && S.snap && S.snap.kind === "endpoint" && S.snap.ids &&
      S.snap.ids.length === 1 && /^(start|end) of /.test(S.snap.label)
      ? { id: S.snap.ids[0], at: S.snap.label.startsWith("start") ? "start" : "end" }
      : null;
    await traverseDialog(pt, fromEnd);
  } else if (tool === "offset") {
    await offsetClick(raw, ev, sp);
  } else if (tool === "fillet") {
    await filletClick(raw);
  } else if (tool === "measure") {
    S.pts.push(pt);
    if (S.pts.length === 2) {
      const [a, b] = S.pts; S.pts = [];
      await measureBetween(a, b);
    }
  } else if (tool === "measurealong") {
    await measureAlongClick(raw, ev, sp);
  } else if (tool === "trim" || tool === "extend") {
    await trimExtendClick(tool, raw, ev);
  } else if (SEL_TOOLS.has(tool)) {
    await selToolClick(tool, pt, raw);
  } else if (tool === "break") {
    await breakClick(pt, raw);
  } else if (tool === "explode") {
    const pick = await pickEntity(raw, ["polyline", "blockref", "dimension", "table",
                                        "point", "hatch"]);
    if (pick) await run("explode_entities", { ids: [pick.id] });
    else logHint("click a polyline, block, dimension, table, point or hatch");
  } else if (tool === "chamfer") {
    await chamferClick(raw);
  } else if (tool === "lengthen") {
    await lengthenClick(raw);
  } else if (tool === "hatch") {
    await hatchClick(raw);
  } else if (tool === "area") {
    await areaClick(raw);
  } else if (tool === "points") {
    await pointsClick(pt);
  } else if (tool === "pointtable") {
    await pointTableClick(pt);
  } else if (tool === "labelseg") {
    await labelSegClick(raw);
  }
  drawOverlay();
}

// ---------------------------------------- traverse / offset / fillet / measure
const PATH_TYPES = ["line", "polyline", "arc", "circle"];
// An entity under a click, with its JSON (for the highlight), or null.
async function pickEntity(pt, types) {
  const hits = await hitAt(pt, 8, true);
  const hit = hits.find(h => types.includes(h.type));
  if (!hit) return null;
  const info = await postJSON("/api/query", { query: "get_entity",
                                              params: { id: hit.id } });
  return info.ok ? { id: hit.id, entity: info.entity, pt,
                     reference: info.reference || null } : null;
}
// Bearing & distance: the courses for a traverse from the point picked.
async function traverseDialog(pt, fromEnd) {
  const layers = S.state ? S.state.layers.map(l => l.name) : ["0"];
  const start = fromEnd ? `the ${fromEnd.at} of ${fromEnd.id}` : fmtPt(pt);
  const v = await openForm(`Bearing & distance from ${start}`, [
    { key: "legs", wide: true, multiline: true, value: S.travLegs,
      label: "Courses, one per line: N 45°30'15\" E 250 · AZ 75.5 250 · " +
             "40 L 250 (turned from the course before) · CURVE R=300 RIGHT " +
             "L=200 (or DELTA=, CHORD=; CB= for a non-tangent chord bearing)" },
    { key: "close", label: "Close on the start (report the misclosure, " +
      "draw the closing course)", value: "no", options: ["no", "yes"] },
    { key: "as", label: "Draw as", value: "lines & arcs",
      options: ["lines & arcs", "one polyline"] },
    { key: "layer", label: "Layer", value: S.state ? S.state.current_layer : "0",
      options: layers }]);
  if (!v) return;
  S.travLegs = v.legs.trim();
  const legs = v.legs.split("\n").map(x => x.trim()).filter(Boolean);
  if (!legs.length) { logHint("no courses entered"); return; }
  const params = { legs, layer: v.layer };
  if (v.close === "yes") params.close = true;
  if (v.as === "one polyline") params.polyline = true;
  if (fromEnd) { params.start = fromEnd.id; params.start_at = fromEnd.at; }
  else params.start = pt;
  logEcho(`draw_traverse ${JSON.stringify(params)}`);
  await exec("draw_traverse", params);
}
// Offset: pick what to copy (Shift adds pieces of a chain), then the side.
async function offsetClick(raw, ev, sp) {
  if (!S.picks.length || ev.shiftKey) {
    const pick = await pickEntity(raw, PATH_TYPES);
    if (!pick) {
      logHint(S.picks.length ? "Shift-click adds a piece that joins on"
                             : "click a line, polyline, arc or circle to offset");
      return;
    }
    if (S.picks.some(p => p.id === pick.id)) return;
    S.picks.push(pick);
    logHint(`${S.picks.map(p => p.id).join(" > ")} — click the side to offset to` +
            (S.picks.length === 1 ? " (Shift-click adds pieces that join on)" : ""));
    drawOverlay();
    return;
  }
  const ids = S.picks.map(p => p.id);
  const params = S.offsetDist === null ? { ids, through: sp || raw }
                                       : { ids, distance: S.offsetDist, toward: raw };
  S.picks = [];
  logEcho(`offset_entity ${JSON.stringify(params)}`);
  logResult(await postJSON("/api/execute", { command: "offset_entity", params }));
  drawOverlay();
}
// Fillet: two lines, each clicked on the part to keep.
async function filletClick(raw) {
  const pick = await pickEntity(raw, ["line"]);
  if (!pick) { logHint("click a line — fillet joins two lines"); return; }
  if (S.picks.some(p => p.id === pick.id)) return;
  S.picks.push(pick);
  if (S.picks.length < 2) {
    logHint(`${pick.id} — now the other line`); drawOverlay(); return; }
  const [a, b] = S.picks; S.picks = [];
  const params = { ids: [a.id, b.id], radius: S.filletRadius, keep: [a.pt, b.pt] };
  logEcho(`fillet ${JSON.stringify(params)}`);
  logResult(await postJSON("/api/execute", { command: "fillet", params }));
  drawOverlay();
}
const fmtLen = v => `${v.toFixed(2)}${S.space === "model" ? "'" : "\""}`;
async function measureBetween(a, b) {
  const r = await postJSON("/api/query", { query: "measure",
                                           params: { from: a, to: b } });
  if (!r.ok) { logResult(r); return; }
  logHTML(`<span class="ok">distance ${esc(r.text)} · ${esc(r.bearing)} · ` +
          `ΔX ${r.dx.toFixed(2)} · ΔY ${r.dy.toFixed(2)}</span>`);
  S.meas.push({ kind: "dist", a, b, label: `${r.text}  ${r.bearing}` });
}
// Along / square off: pick the line, curve or alignment, then points.
async function measureAlongClick(raw, ev, sp) {
  if (!S.picks.length || ev.shiftKey) {
    const pick = await pickEntity(raw, PATH_TYPES);
    if (!pick) { logHint("click the line, curve or alignment to measure against");
                 return; }
    const anchor = !pick.reference && pick.entity.anchor;
    if (!S.picks.length && anchor && anchor.kind === "element" &&
        alignmentOf(anchor.alignment))
      pick.alignment = anchor.alignment;  // a drawn alignment: in stations
    if (S.picks.some(p => p.id === pick.id)) return;
    S.picks.push(pick); S.pts = [];
    logHint((pick.alignment ? `measuring against alignment ${pick.alignment} ` +
             `(stations)` : `measuring against ` +
             S.picks.map(p => p.id).join(" > ")) + " — click points");
    drawOverlay();
    return;
  }
  S.pts.push(sp || raw);
  const first = S.picks[0];
  const along = first.alignment ||
    (S.picks.length > 1 ? S.picks.map(p => p.id) : first.id);
  const params = { from: S.pts[0], along };
  if (S.pts.length === 2) params.to = S.pts[1];
  const r = await postJSON("/api/query", { query: "measure", params });
  if (!r.ok) { logResult(r); S.pts = []; return; }
  const where = row => (row.station_text ? `STA ${row.station_text}`
                                         : `${fmtLen(row.along)} along`) +
                       `, ${row.offset_text}` + (row.beyond ? ` (past its ` +
                       `${row.beyond})` : "");
  if (S.pts.length === 1) {
    logHTML(`<span class="ok">${esc(where(r.from))}</span>`);
    S.meas.push({ kind: "perp", a: r.from.point, b: r.from.foot,
                  label: r.from.offset_text });
  } else {
    logHTML(`<span class="ok">${esc(where(r.to))}; between the two: ` +
            `${esc(r.along_text)} along, ${esc(r.perpendicular_text)} across ` +
            `(${esc(r.text)} direct)</span>`);
    S.meas.push({ kind: "perp", a: r.to.point, b: r.to.foot,
                  label: r.to.offset_text });
    S.meas.push({ kind: "along", a: r.from.foot, b: r.to.foot,
                  label: `${r.along_text} along` });
    S.pts = [];
  }
}

// ------------------------------------------------------------- modify tools
// A command with no space of its own (the entity ids say where).
async function run(command, params) {
  logEcho(`${command} ${JSON.stringify(params)}`);
  const r = await postJSON("/api/execute", { command, params });
  logResult(r);
  return r;
}
// Trim cuts the part clicked (Shift: keeps it); extend runs on the end clicked.
// Every line, arc and circle in the space is an edge, as in AutoCAD's quick trim.
async function trimExtendClick(tool, raw, ev) {
  const pick = await pickEntity(raw, PATH_TYPES);
  if (!pick) {
    logHint(tool === "trim" ? "click the part of a line, polyline, arc or circle to cut away"
                            : "click near the end of a line, arc or polyline");
    return;
  }
  const target = { id: pick.id };
  target[tool === "trim" && ev.shiftKey ? "keep" : "at"] = raw;
  await run(tool, { targets: [target] });
}
const selNext = () => ({
  copy: "now the base point, then where it goes",
  rotate: "now the base point, then the angle",
  mirror: "now the first point of the mirror line",
  scale: "now the base point, then type the factor",
  linetable: "now click the table's top-left corner" }[S.tool] || "");
function finishSel() { S.picks = []; S.pts = []; S.selDone = false; drawOverlay(); }
// Copy, rotate, mirror, scale, array, join, line table: pick, Enter, then act.
async function selToolClick(tool, pt, raw) {
  if (!S.selDone) {
    const pick = tool === "linetable" ? await pickSegment(raw)
                                      : await pickEntity(raw, EVERY_TYPE);
    if (!pick) { logHint("nothing there to pick"); return; }
    const k = S.picks.findIndex(p => p.id === pick.id);
    if (k >= 0) S.picks.splice(k, 1); else S.picks.push(pick);
    logHint(`${S.picks.length} picked (${S.picks.map(p => p.id).join(", ")}) — ` +
            `click more, Enter when done`);
    return;
  }
  const ids = S.picks.map(p => p.id);
  if (tool === "copy") {
    if (!S.pts.length) { S.pts = [pt]; logHint("where does it go? (more clicks: more copies)");
                         return; }
    await run("copy_entities", { ids, from: S.pts[0], to: pt });
  } else if (tool === "rotate") {
    if (!S.pts.length) { S.pts = [pt]; logHint("click the angle, or type it"); return; }
    await run("rotate_entities", { ids, base: S.pts[0],
                                   angle: +angDeg(S.pts[0], pt).toFixed(6) });
    finishSel();
  } else if (tool === "mirror") {
    if (!S.pts.length) { S.pts = [pt]; logHint("the second point of the mirror line");
                         return; }
    await run("mirror_entities", { ids, line: [S.pts[0], pt] });
    finishSel();
  } else if (tool === "scale") {
    if (!S.pts.length) { S.pts = [pt]; logHint("type the scale factor"); return; }
    logHint("type the scale factor (a number) on the command line");
  } else if (tool === "linetable") {
    await run("label_segments", { ids, style: "tags", space: S.space,
                                  table: { position: pt } });
    finishSel();
  }
}
// Enter on a selection tool: the selection is settled (or, for join, joined).
async function finishSelection() {
  if (!S.picks.length) { logHint("pick something first"); return; }
  if (S.tool === "join") {
    await run("join_entities", { ids: S.picks.map(p => p.id) }); finishSel(); return;
  }
  S.selDone = true;
  if (S.tool === "array") { await arrayDialog(); return; }
  logHint(selNext()); drawOverlay();
}
// Break: the first click picks the entity and the first point.
async function breakClick(pt, raw) {

    logHint(`${pick.id} — click a second point to cut out the part between, or Enter ` +
            `to split it here`);

  }
  const b = S.breakPick; S.breakPick = null; S.picks = [];
  await run("break_entity", { id: b.id, at: b.at, to: pt });
}

// A line or curve under the click -- on a sheet, the model's seen through
// the viewport too, which is how right of way is lettered on a plan sheet.
async function pickSegment(raw) {
  const pick = await pickEntity(raw, ["line", "polyline", "arc"]);
  if (pick || S.space === "model") return pick;
  const r = await postJSON("/api/query", { query: "sheet_to_model",
                                           params: { sheet: S.space, point: raw } });
  if (!r.ok || !r.inside || !r.nearest || r.nearest.distance_in > 10 * unitsPerPx())
    return null;
  const info = await postJSON("/api/query", { query: "get_entity",
                                              params: { id: r.nearest.id } });
  if (!info.ok || !["line", "polyline", "arc"].includes(info.entity.type)) return null;
  return { id: r.nearest.id, entity: null, pt: raw };  // model coordinates: no outline
}
async function labelSegClick(raw) {
  const pick = await pickSegment(raw);
  if (!pick) { logHint("click a line, arc or polyline"); return; }
  await run("label_segments", { ids: [pick.id], space: S.space });
}
async function arrayDialog() {
  const ids = S.picks.map(p => p.id);
  const aligns = alignNames();
  const v = await openForm(`Array ${ids.join(", ")}`, [
    { key: "kind", label: "Kind", value: "rectangular",
      options: ["rectangular", "polar", "path"] },
    { key: "grid", label: "Rectangular: rows x columns", value: "1 x 4" },
    { key: "spacing", label: "Rectangular: row spacing, column spacing", value: "10, 10" },
    { key: "center", label: "Polar: center x,y", value: "" },
    { key: "count", label: "Polar: items, the original included · Path: how many copies",
      value: "4" },
    { key: "path", label: "Path: an alignment or entity id(s), comma separated",
      value: aligns[0] || "" },
    { key: "every", label: "Path: every (blank: count, evenly spaced)", value: "100" },
    { key: "offset", label: "Path: offset from it (2R, 2L)", value: "" }]);
  if (!v) { finishSel(); return; }
  const params = { ids, kind: v.kind };
  const nums = t => t.split(/[^-+0-9.eE]+/).filter(Boolean).map(Number);
  if (v.kind === "rectangular") {
    const [rows, cols] = nums(v.grid), [dr, dc] = nums(v.spacing);
    Object.assign(params, { rows: rows || 1, columns: cols || 1,
                            row_spacing: dr || 0, column_spacing: dc ?? dr ?? 0 });
  } else if (v.kind === "polar") {
    const c = nums(v.center);
    if (c.length !== 2) { logHint("a polar array needs a center x,y"); finishSel(); return; }
    Object.assign(params, { center: c, count: Math.round(nums(v.count)[0] || 4) });
  } else {
    const path = v.path.split(",").map(x => x.trim()).filter(Boolean);
    params.path = path.length === 1 ? path[0] : path;
    if (v.every.trim()) params.every = parseFloat(v.every);
    else params.count = Math.round(nums(v.count)[0] || 4);
    if (v.offset.trim()) params.offset = v.offset.trim();
  }
  await run("array_entities", params);
  finishSel();
}
async function staoffDialog() {
