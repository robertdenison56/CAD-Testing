<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadDraft</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #16171b; --panel: #24262b; --panel2: #2d3036; --panel3: #383b42;
    --border: #3a3d45; --text: #d8dbe0; --dim: #8f95a0; --accent: #4f9cf5;
    --accent2: #2f6db3; --ok: #74cf92; --warn: #e5b567; --err: #e57862;
    --canvas: #26282d; --ribbon: #2b2e34; --tabstrip: #1d1f24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: 34px 118px 1fr auto 26px;
    grid-template-columns: 242px 1fr 320px;
    grid-template-areas: "qat qat qat" "ribbon ribbon ribbon"
                         "side canvas log" "cmd cmd cmd"
                         "status status status";
    background: var(--bg); color: var(--text);
    font: 12.5px/1.4 -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    user-select: none;
  }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  svg.ic { display: block; }
  svg.ic * { stroke: currentColor; stroke-width: 1.7; fill: none;
             stroke-linecap: round; stroke-linejoin: round; }
  svg.ic .f { fill: currentColor; stroke: none; }

  /* ---------------------------------------------- quick access toolbar */
  #qat { grid-area: qat; display: flex; align-items: center; gap: 4px;
         padding: 0 10px; background: var(--tabstrip);
         border-bottom: 1px solid #000; }
  #qat .logo { font-weight: 700; font-size: 13px; margin-right: 8px; }
  #qat .logo span { color: var(--accent); }
  .qbtn { padding: 3px 6px; border-radius: 4px; color: var(--dim);
          cursor: pointer; }
  .qbtn:hover { background: var(--panel2); color: var(--text); }
  #qat .proj { color: var(--dim); margin-left: 10px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #qat .grow { flex: 1; }
  #conn { font-size: 11px; color: var(--dim); }
  #conn.bad { color: var(--err); }

  /* --------------------------------------------------------- ribbon */
  #ribbon { grid-area: ribbon; display: flex; flex-direction: column;
            background: var(--ribbon); border-bottom: 1px solid #000; }
  #rtabs { display: flex; gap: 2px; padding: 4px 10px 0;
           background: var(--tabstrip); }
  .rtab { padding: 4px 16px 5px; font-size: 12px; color: var(--dim);
          cursor: pointer; border-radius: 5px 5px 0 0;
          border: 1px solid transparent; border-bottom: none; }
  .rtab:hover { color: var(--text); }
  .rtab.active { background: var(--ribbon); color: var(--text);
                 border-color: #000; font-weight: 600; }
  #rpanels { flex: 1; display: flex; align-items: stretch; gap: 0;
             padding: 5px 6px 3px; overflow-x: auto; }
  .rpanel { display: flex; flex-direction: column; padding: 0 7px;
            border-right: 1px solid var(--border); min-width: 60px; }
  .rpanel:last-child { border-right: none; }
  .rtools { flex: 1; display: flex; align-items: stretch; gap: 3px; }
  .rcap { text-align: center; font-size: 10px; color: var(--dim);
          padding: 2px 0 1px; letter-spacing: .3px; }
  .rbig { display: flex; flex-direction: column; align-items: center;
          justify-content: flex-start; gap: 3px; width: 56px;
          padding: 6px 2px 3px; border-radius: 5px; cursor: pointer;
          color: var(--text); border: 1px solid transparent;
          text-align: center; font-size: 10.5px; line-height: 1.15; }
  .rbig:hover { background: var(--panel3); border-color: var(--border); }
  .rbig.active { background: var(--accent2); border-color: var(--accent);
                 color: #fff; }
  .rbig .ic { color: var(--accent); }
  .rbig.active .ic { color: #fff; }
  .rstack { display: flex; flex-direction: column; gap: 2px;
            justify-content: center; }
  .rsmall { display: flex; align-items: center; gap: 5px; padding: 2px 7px;
            border-radius: 4px; cursor: pointer; font-size: 11px;
            color: var(--text); border: 1px solid transparent;
            white-space: nowrap; }
  .rsmall:hover { background: var(--panel3); border-color: var(--border); }
  .rsmall.active { background: var(--accent2); border-color: var(--accent);
                   color: #fff; }
  .rsmall .ic { color: var(--accent); }
  .rctl { display: flex; flex-direction: column; gap: 5px;
          justify-content: center; }
  .rctl select { background: var(--panel2); color: var(--text);
                 border: 1px solid var(--border); border-radius: 4px;
                 padding: 3px 6px; font-size: 11.5px; max-width: 170px; }
  .rctl label { display: flex; gap: 5px; align-items: center;
                color: var(--dim); font-size: 11px; cursor: pointer; }

  /* ------------------------------------------------------ toolspace */
  aside { grid-area: side; background: var(--panel);
          border-right: 1px solid #000; display: flex;
          flex-direction: column; overflow: hidden; }
  #ts-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
              letter-spacing: .8px; color: var(--dim);
              background: var(--panel2); border-bottom: 1px solid var(--border); }
  #tstree { flex: 1; overflow-y: auto; }
  .tsec { border-bottom: 1px solid var(--border); }
  .tsec-h { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            cursor: pointer; font-size: 11.5px; font-weight: 600;
            color: var(--text); }
  .tsec-h:hover { background: var(--panel2); }
  .tsec-h .tri { color: var(--dim); font-size: 9px; width: 10px; }
  .tsec-h .cnt { color: var(--dim); font-weight: 400; margin-left: auto; }
  .trow { display: flex; align-items: center; gap: 7px;
          padding: 4px 10px 4px 24px; cursor: pointer;
          border-left: 3px solid transparent; font-size: 12px; }
  .trow:hover { background: var(--panel2); }
  .trow.current { border-left-color: var(--accent); background: var(--panel2); }
  .eye { cursor: pointer; width: 15px; text-align: center; color: var(--dim);
         user-select: none; flex: none; font-size: 11px; }
  .eye.on { color: var(--text); }
  .swatch { width: 11px; height: 11px; border-radius: 2px;
            border: 1px solid var(--border); flex: none; }
  .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           flex: 1; }
  .trow .status { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .trow .status.loaded { background: var(--ok); }
  .trow .status.error { background: var(--err); }
  .trow .x { color: var(--dim); padding: 0 3px; }
  .trow .x:hover { color: var(--err); }
  .tempty { padding: 4px 10px 6px 24px; color: var(--dim); font-size: 11.5px; }

  /* ------------------------------------------------- properties panel */
  #props { display: none; flex-direction: column; overflow: hidden;
           flex: none; max-height: 62%; border-top: 1px solid #000; }
  #props.open { display: flex; }
  #props-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
                 letter-spacing: .8px; color: var(--dim);
                 background: var(--panel2);
                 border-bottom: 1px solid var(--border);
                 display: flex; align-items: center; gap: 8px; }
  #props-id { color: var(--text); font-weight: 400; letter-spacing: 0;
              flex: 1; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; font-family: ui-monospace, Menlo, monospace;
              font-size: 11px; }
  #props-close { cursor: pointer; padding: 0 2px; }
  #props-close:hover { color: var(--err); }
  #props-body { overflow-y: auto; padding: 2px 0 8px; }
  .psec { padding: 8px 12px 3px; font-size: 10px; font-weight: 700;
          letter-spacing: .6px; color: var(--accent); }
  .prow { display: grid; grid-template-columns: 82px 1fr;
          align-items: center; gap: 7px; padding: 2px 12px; min-width: 0; }
  .prow > label { color: var(--dim); font-size: 11px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .prow input[type=text], .prow select {
      width: 100%; min-width: 0; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 3px 6px; font: inherit;
      font-size: 11.5px; outline: none; }
  .prow input[type=text]:focus, .prow select:focus {
      border-color: var(--accent); }
  .prow .ro { font-size: 11.5px; color: var(--text); padding: 3px 0;
              user-select: text; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .prow input[type=checkbox] { justify-self: start; margin: 3px 0; }
  .colorwrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .colorwrap select { flex: 1; }
  .colorwrap input[type=color] { width: 26px; height: 22px; padding: 1px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); cursor: pointer; flex: none; }
  .phint { padding: 5px 12px 0; color: var(--dim); font-size: 10.5px; }

  /* --------------------------------------------------------- canvas */
  main { grid-area: canvas; display: flex; flex-direction: column;
         overflow: hidden; background: var(--canvas); }
  #viewwrap { flex: 1; overflow: auto; position: relative; }
  #stage { position: relative; display: block; margin: 12px auto;
           width: calc(100% - 24px); }
  #view { display: block; width: 100%;
          box-shadow: 0 3px 16px rgba(0,0,0,.55); }
  #ovl { position: absolute; inset: 0; width: 100%; height: 100%;
         pointer-events: none; }
  #ovl .ch { stroke: #7ab5ff88; stroke-width: 1;
             vector-effect: non-scaling-stroke; }
  #ovl .rb { stroke: var(--accent); stroke-width: 1.4; fill: none;
             stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
  #ovl .hlglow { stroke: #e5b56766; stroke-width: 8; fill: none;
                 stroke-linecap: round; stroke-linejoin: round;
                 vector-effect: non-scaling-stroke; }
  #ovl .hlcore { stroke: #ffd27a; stroke-width: 2.2; fill: none;
                 stroke-linecap: round; stroke-linejoin: round;
                 vector-effect: non-scaling-stroke; }
  #ovl .hlbox { stroke: #ffd27a; stroke-width: 1.6; fill: #e5b56733;
                vector-effect: non-scaling-stroke; }
  #ovl .mark { fill: var(--accent); stroke: #10121a; stroke-width: 1;
               vector-effect: non-scaling-stroke; }
  #zoomer { position: absolute; right: 14px; bottom: 12px; display: flex;
            gap: 5px; background: rgba(22,23,27,.92);
            border: 1px solid var(--border); border-radius: 7px;
            padding: 4px 6px; align-items: center; z-index: 5; }
  .zbtn { padding: 2px 9px; background: var(--panel2); color: var(--text);
          border: 1px solid var(--border); border-radius: 5px;
          cursor: pointer; font-size: 12px; }
  .zbtn:hover { border-color: var(--accent); }
  #zoompct { color: var(--dim); font-size: 11px; min-width: 34px;
             text-align: center; }
  #ltabs { display: flex; gap: 2px; padding: 3px 8px 0;
           background: var(--panel); border-top: 1px solid #000; }
  .ltab { padding: 3px 16px 4px; font-size: 11.5px; background: var(--panel2);
          color: var(--dim); cursor: pointer; border-radius: 0 0 6px 6px;
          border: 1px solid var(--border); border-top: none; }
  .ltab.active { background: #e8e8e8; color: #222; font-weight: 600; }
  .ltab.plus { color: var(--accent); }

  /* ------------------------------------------------------------ log */
  #logpane { grid-area: log; background: var(--panel);
             border-left: 1px solid #000; display: flex;
             flex-direction: column; overflow: hidden; }
  #log-title { padding: 7px 12px; font-size: 11px; font-weight: 700;
               letter-spacing: .8px; color: var(--dim);
               background: var(--panel2);
               border-bottom: 1px solid var(--border); }
  #log { flex: 1; overflow-y: auto; padding: 6px 10px; font-size: 12px;
         user-select: text; }
  .entry { margin-bottom: 6px; white-space: pre-wrap;
           word-break: break-word; }
  .entry .echo { color: var(--dim); }
  .entry .ok { color: var(--ok); }
  .entry .warn { color: var(--warn); }
  .entry .err { color: var(--err); }
  .entry .hint { color: var(--dim); }
  .entry summary { color: var(--accent); cursor: pointer; font-size: 11px; }
  .entry pre { margin: 3px 0 0; padding: 6px 8px; background: var(--bg);
               border: 1px solid var(--border); border-radius: 5px;
               overflow-x: auto; max-height: 240px; }

  /* ---------------------------------------------------- command bar */
  #cmdbar { grid-area: cmd; display: flex; gap: 8px; padding: 7px 12px;
            background: var(--panel); border-top: 1px solid #000;
            align-items: center; }
  #prompt { color: var(--accent); white-space: nowrap; }
  #cmd { flex: 1; background: var(--bg); border: 1px solid var(--border);
         color: var(--text); border-radius: 6px; padding: 6px 10px;
         outline: none; }
  #cmd:focus { border-color: var(--accent); }
  #run { padding: 5px 14px; background: var(--panel2); color: var(--text);
         border: 1px solid var(--border); border-radius: 6px;
         cursor: pointer; }

  /* ------------------------------------------------------ status bar */
  #statusbar { grid-area: status; display: flex; gap: 14px;
               align-items: center; padding: 0 12px;
               background: var(--tabstrip); border-top: 1px solid #000;
               color: var(--dim); font-size: 11px; white-space: nowrap;
               overflow: hidden; }
  #st-coord { min-width: 190px; color: var(--text); }
  .sttog { padding: 1px 9px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--border); }
  .sttog.on { background: var(--accent2); color: #fff;
              border-color: var(--accent); }
  #st-tool { color: var(--text); }

  /* ---------------------------------------------------------- modal */
  #modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55);
              display: none; align-items: center; justify-content: center;
              z-index: 50; }
  #modal { background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; padding: 16px 18px; min-width: 330px; }
  #modal h3 { margin: 0 0 12px; font-size: 14px; }
  #modal .row { display: flex; align-items: center; gap: 10px;
                margin-bottom: 9px; }
  #modal .row label { flex: 1; color: var(--dim); font-size: 12px; }
  #modal .row input, #modal .row select, #modal .row textarea {
      width: 220px; background: var(--bg);
      border: 1px solid var(--border); color: var(--text); border-radius: 5px;
      padding: 5px 8px; outline: none; font: inherit; }
  #modal .row textarea { resize: vertical; font-family: ui-monospace, Menlo,
      monospace; font-size: 12px; }
  #modal .actions { display: flex; justify-content: flex-end; gap: 8px;
                    margin-top: 14px; }
  #modal .actions .zbtn { padding: 4px 16px; }
</style>
</head>
<body>
  <div id="qat">
    <div class="logo">Road<span>Draft</span></div>
    <div class="qbtn" id="q-save" title="Save document"></div>
    <div class="qbtn" id="q-undo" title="Undo"></div>
    <div class="qbtn" id="q-redo" title="Redo"></div>
    <div class="proj" id="proj">…</div>
    <div class="grow"></div>
    <span id="conn">connecting…</span>
  </div>

  <div id="ribbon">
    <div id="rtabs"></div>
    <div id="rpanels"></div>
  </div>

  <aside>
    <div id="ts-title">TOOLSPACE</div>
    <div id="tstree"></div>
    <div id="props">
      <div id="props-title">PROPERTIES<span id="props-id"></span>
        <span id="props-close" title="deselect (Esc)">✕</span></div>
      <div id="props-body"></div>
    </div>
  </aside>

  <main>
    <div id="viewwrap">
      <div id="stage">
        <img id="view" alt="drawing view">
        <svg id="ovl" preserveAspectRatio="none"></svg>
      </div>
      <div id="zoomer">
        <div class="zbtn" id="zout">−</div>
        <div id="zoompct">fit</div>
        <div class="zbtn" id="zin">+</div>
        <div class="zbtn" id="zfit">Fit</div>
        <div class="zbtn" id="zpng" title="open PNG">⤢</div>
      </div>
    </div>
    <div id="ltabs"></div>
  </main>

  <div id="logpane">
    <div id="log-title">COMMAND LOG</div>
    <div id="log" class="mono"></div>
  </div>

  <div id="cmdbar" class="mono">
    <span id="prompt">RD [model]&gt;</span>
    <input id="cmd" autocomplete="off" spellcheck="false"
           placeholder="Type a command — help lists everything. Or pick a ribbon tool and click.">
    <div class="zbtn" id="run">Run</div>
  </div>

  <div id="statusbar">
    <span id="st-coord"></span>
    <span class="sttog" id="tog-ortho" title="Constrain drawing to horizontal/vertical (F8)">ORTHO</span>
    <span id="st-tool"></span>
    <span class="grow" style="flex:1"></span>
    <span id="st-journal"></span>
    <span id="st-entities"></span>
  </div>

  <div id="modal-bg"><div id="modal"></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const S = { space: "model", rev: -1, zoom: 0, history: [], hIdx: 0, names: [],
            state: null, view: null, modelBounds: null, tool: "select",
            pts: [], cursor: null, stationPicks: [], selected: null,
            ribbonTab: "Home", dpi: 130, frames: true, dark: true,
            ortho: false, tsOpen: { layers: true, sheets: true, refs: true } };

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getJSON = async p => (await fetch(p)).json();
const postJSON = async (p, body) => (await fetch(p, { method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body) })).json();

// ------------------------------------------------------------------ icons
const ICONS = {
  select: `<path class="f" d="M6 3 L18.5 11.2 L12.6 12.3 L15.6 19.2 L12.9 20.4 L10 13.5 L6 17 Z"/>`,
  pan: `<path d="M7.6 12 V7 a1.3 1.3 0 0 1 2.6 0 v4 M10.2 11 V5.4 a1.3 1.3 0 0 1 2.6 0 V11 M12.8 11 V6.4 a1.3 1.3 0 0 1 2.6 0 V12 M15.4 12.6 V9.6 a1.3 1.3 0 0 1 2.6 0 V15 c0 3.6-2.6 6-6 6-3 0-4.7-1.2-5.9-3.4 l-1.9-3.9 a1.3 1.3 0 0 1 2.3-1.2 l1 1.6 V12"/>`,
  line: `<path d="M4.5 19.5 L19.5 4.5"/><circle class="f" cx="4.5" cy="19.5" r="1.7"/><circle class="f" cx="19.5" cy="4.5" r="1.7"/>`,
  pline: `<path d="M3.5 19 L8.5 7.5 L14 14 L20.5 5"/><circle class="f" cx="3.5" cy="19" r="1.5"/><circle class="f" cx="8.5" cy="7.5" r="1.5"/><circle class="f" cx="14" cy="14" r="1.5"/><circle class="f" cx="20.5" cy="5" r="1.5"/>`,
  circle: `<circle cx="12" cy="12" r="8"/><path d="M12 10.6 V13.4 M10.6 12 H13.4"/>`,
  arc: `<path d="M4 19 A14.5 14.5 0 0 1 20 7.5"/><circle class="f" cx="4" cy="19" r="1.6"/><circle class="f" cx="20" cy="7.5" r="1.6"/><circle class="f" cx="10.6" cy="11.7" r="1.3"/>`,
  text: `<path d="M6.5 20 L12 4.5 L17.5 20 M8.6 14.6 H15.4"/>`,
  station: `<path d="M3 17 H10 Q14.5 17 16.5 13 T21.5 7.5"/><path d="M6.2 14.6 V19.4 M10.4 14.6 V19.4 M15.1 10.4 L18.3 13.2"/>`,
  move: `<path d="M12 4 V20 M4 12 H20 M12 4 l-2.2 2.2 M12 4 l2.2 2.2 M12 20 l-2.2-2.2 M12 20 l2.2-2.2 M4 12 l2.2-2.2 M4 12 l2.2 2.2 M20 12 l-2.2-2.2 M20 12 l-2.2 2.2"/>`,
  erase: `<path d="M9 20 H5 L3.2 18.1 a1.6 1.6 0 0 1 0-2.2 L13.2 5.4 a1.6 1.6 0 0 1 2.2 0 l5 5.2 a1.6 1.6 0 0 1 0 2.2 L13.6 20 H9 Z"/><path d="M9.6 9.2 L16.8 16.6"/>`,
  block: `<path d="M12 3 L20 7 V17 L12 21 L4 17 V7 Z"/><path d="M4 7 L12 11 L20 7 M12 11 V21"/>`,
  xref: `<path d="M13.5 3 H7 a1.6 1.6 0 0 0-1.6 1.6 V19.4 A1.6 1.6 0 0 0 7 21 h10 a1.6 1.6 0 0 0 1.6-1.6 V8 Z M13.5 3 v5 h5.1"/><path d="M2.5 13 h7.2 M9.7 13 l-2.4-2.4 M9.7 13 l-2.4 2.4"/>`,
  reload: `<path d="M19.5 12 a7.5 7.5 0 1 1-2.3-5.4 M17.6 3.4 l.3 3.6 3.5-.4"/>`,
  table: `<rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="M3.5 10 H20.5 M9.2 10 V19 M14.8 10 V19"/>`,
  sheet: `<path d="M14 3 H6.6 A1.6 1.6 0 0 0 5 4.6 v14.8 A1.6 1.6 0 0 0 6.6 21 h10.8 A1.6 1.6 0 0 0 19 19.4 V8 Z M14 3 v5 h5"/><path d="M9 14.5 h6 M12 11.5 v6"/>`,
  titleblock: `<rect x="3" y="4.5" width="18" height="15"/><path d="M3 15.5 H21 M13.5 15.5 V19.5"/>`,
  undo: `<path d="M7.5 5.5 L4 9 L7.5 12.5"/><path d="M4 9 H14 a5.2 5.2 0 0 1 0 10.4 H9"/>`,
  redo: `<path d="M16.5 5.5 L20 9 L16.5 12.5"/><path d="M20 9 H10 a5.2 5.2 0 0 0 0 10.4 H15"/>`,
  zoomfit: `<circle cx="10.5" cy="10.5" r="6.8"/><path d="M15.6 15.6 L21 21"/><rect x="7.6" y="7.6" width="5.8" height="5.8"/>`,

// ------------------------------------------------------------------- log
function logHTML(html) {
  const div = document.createElement("div");
  div.className = "entry"; div.innerHTML = html;
  $("log").appendChild(div);
  while ($("log").children.length > 300) $("log").firstChild.remove();
  $("log").scrollTop = $("log").scrollHeight;
}
const logEcho = line => logHTML(`<span class="echo">&gt; ${esc(line)}</span>`);
const logHint = m => logHTML(`<span class="hint">${esc(m)}</span>`);
function jsonBlock(obj, label) {
  const text = JSON.stringify(obj, null, 2);
  return `<details${text.length < 500 ? " open" : ""}><summary>${esc(label)}` +
         `</summary><pre>${esc(text.length > 20000 ?
           text.slice(0, 20000) + "\n…" : text)}</pre></details>`;
}
function logResult(res) {
  if (!res) return;
  if (res.ok) {
    let html = `<span class="ok">${esc(res.message || "ok")}</span>`;
    (res.warnings || []).forEach(w => {
      html += `<br><span class="warn">⚠ ${esc(w)}</span>`; });
    const extra = { ...res };
    ["ok","name","message","warnings","command_id","created","modified",
     "deleted"].forEach(k => delete extra[k]);
    if (res.path) { html += `<br><span class="hint">→ ${esc(res.path)}</span>`;
                    delete extra.path; delete extra.size_bytes; }
    if (Object.keys(extra).length) html += jsonBlock(extra, "result data");
    logHTML(html);
  } else {
    const e = res.error || {};
    let html = `<span class="err">✗ ${esc(e.type || "error")}: ` +
               `${esc(e.message || "failed")}</span>`;
    if (e.hint) html += `<br><span class="hint">hint: ${esc(e.hint)}</span>`;
    if (e.example) html += jsonBlock(e.example, "valid example");
    logHTML(html);
  }
}

// ------------------------------------------------------- coordinate maps
function evtSpace(ev) {
  const r = $("view").getBoundingClientRect();
  const u = (ev.clientX - r.left) / r.width;
  const v = (ev.clientY - r.top) / r.height;
  if (!S.view) return null;
  if (S.view.kind === "model") {
    const b = S.view.bounds;
    return [b[0] + u * (b[2] - b[0]), b[3] - v * (b[3] - b[1])];
  }
  const [W, H] = S.view.sizeIn;
  return [u * W, H - v * H];
}
function spacePx(p) {
  const img = $("view");
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (S.view.kind === "model") {
    const b = S.view.bounds;
    return [(p[0] - b[0]) / (b[2] - b[0]) * nw,
            (b[3] - p[1]) / (b[3] - b[1]) * nh];
  }
  const [W, H] = S.view.sizeIn;
  return [p[0] / W * nw, (H - p[1]) / H * nh];
}
function unitsPerPx() {
  const r = $("view").getBoundingClientRect();
  if (!S.view || !r.width) return 1;
  if (S.view.kind === "model") {
    const b = S.view.bounds; return (b[2] - b[0]) / r.width;
  }
  return S.view.sizeIn[0] / r.width;
}
const fmtPt = p => S.view && S.view.kind === "model"
  ? `${p[0].toFixed(2)}, ${p[1].toFixed(2)} ft`
  : `${p[0].toFixed(3)}, ${p[1].toFixed(3)} in`;

// ------------------------------------------------------------ canvas img
function imgURL() {
  let url = `/render/${encodeURIComponent(S.space)}.png?rev=${S.rev}` +
            `&dpi=${S.dpi}&frames=${S.frames ? 1 : 0}`;
  if (S.space === "model") {
    if (S.dark) url += "&theme=dark";
    if (S.modelBounds)
      url += `&bounds=${S.modelBounds.map(v => v.toFixed(4)).join(",")}`;
  }
  return url;
}
let canvasToken = 0;
async function updateCanvas() {
  const tok = ++canvasToken;
  const resp = await fetch(imgURL());
  if (tok !== canvasToken) return;
  const kind = resp.headers.get("X-RD-Kind");
  if (kind === "model")
    S.view = { kind, bounds: resp.headers.get("X-RD-Bounds")
                             .split(",").map(Number) };
  else if (kind === "sheet")
    S.view = { kind, sizeIn: resp.headers.get("X-RD-Size-In")
                             .split(",").map(Number) };
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const img = $("view");
  const old = img.dataset.obj;
  img.onload = () => {
    if (old) URL.revokeObjectURL(old);
    clearPendingZoom();
    $("ovl").setAttribute("viewBox",
      `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    drawOverlay();
  };
  img.dataset.obj = url; img.src = url;
}

async function ribbonAct(act) {
  const prefill = v => { $("cmd").value = v; $("cmd").focus(); };
  if (act === "undo" || act === "redo")
    logResult(await postJSON("/api/execute", { command: act, params: {} }));
  else if (act === "props") {
    if (S.selected) renderProps();
    else logHint("select an entity first (Select tool) — its properties " +
                 "open in the panel below the Toolspace");
  }
  else if (act === "toolspace") {
    const aside = document.querySelector("aside");
    aside.style.display = aside.style.display === "none" ? "" : "none";
  }
  else if (act === "table") prefill(S.space === "model"
    ? 'table position=1200,900 title="CURVE DATA" columns=[{"header":"CURVE","width":80},{"header":"R","width":100}] rows=[["C-1","800.00"]] text_height=8'
    : 'table position=26,8 title="CURVE DATA" columns=[{"header":"CURVE","width":1.0},{"header":"R","width":1.2}] rows=[["C-1","800.00\'"]] text_height=0.12');
  else if (act === "defblock") prefill(
    'block MARKER entities=[{"type":"circle","center":[0,0],"radius":1},' +
    '{"type":"line","start":[-1,0],"end":[1,0]}]');
  else if (act === "attachref") {
    const v = await openForm("Attach reference (basefile)", [
      { key: "name", label: "Reference name", value: "SURVEY" },
      { key: "path", label: "Path to .rdoc.json", value: "examples/output/demo.rdoc.json" },
      { key: "offset", label: "Offset x,y", value: "0,0" },
      { key: "scale", label: "Scale", value: "1" }]);
    if (v) {
      const off = v.offset.split(",").map(Number);
      logResult(await postJSON("/api/execute", { command: "attach_reference",
        params: { name: v.name, path: v.path, space: S.space,
                  offset: off.length === 2 && off.every(n => !isNaN(n))
                          ? off : [0, 0],
                  scale: parseFloat(v.scale) || 1 } }));
    }
  }
  else if (act === "reloadrefs")
    logResult(await postJSON("/api/execute",
      { command: "reload_references", params: {} }));
  else if (act === "detachref") prefill("xdetach NAME");
  else if (act === "newsheet") {
    const v = await openForm("New sheet", [
      { key: "name", label: "Sheet name", value:
        `C-${(S.state ? S.state.sheets.length : 0) + 101}` },
      { key: "size", label: "Size", value: "ANSI_D",
        options: ["ANSI_A", "ANSI_B", "ANSI_C", "ANSI_D", "ARCH_D",
                  "ARCH_E"] }]);
    if (v) {
      const r = await postJSON("/api/execute", { command: "create_sheet",
        params: { name: v.name, size: v.size } });
      logResult(r);
      if (r.ok) setSpace(r.created[0]);
    }
  }
  else if (act === "titleblock") prefill(S.space !== "model"
    ? `titleblock ${spaceLabel()} project="PROJECT" sheet_title="ROADWAY PLAN" sheet_number=${spaceLabel()}`
    : "titleblock C-101 project=\"PROJECT\"");
  else if (act === "newlayer")
    prefill("mklayer V-NEW color=red linetype=continuous lineweight_mm=0.35");
  else if (act === "dxf" || act === "pdf") {
    logEcho(act);
    logResult(await postJSON("/api/query",
      { query: act === "dxf" ? "export_dxf" : "export_pdf", params: {} }));
  }
  else if (act === "save") {
    logResult(await postJSON("/api/query", { query: "save_document",
      params: { path: slugProject() + ".rdoc.json" } }));
  }
  else if (act === "journal") {
    logResult(await postJSON("/api/query", { query: "save_journal",
      params: { path: slugProject() + ".journal.jsonl" } }));
  }
  else if (act === "zoomin") zoomBtn(0.8);
  else if (act === "zoomout") zoomBtn(1.25);
  else if (act === "zoomfit") { S.zoom = 0; S.modelBounds = null;
    applyZoom(); updateCanvas(); }
}

function tsSection(key, title, count, rowsHTMLBuilder) {

  head.className = "tsec-h";
  head.innerHTML = `<span class="tri">${S.tsOpen[key] ? "▼" : "▶"}</span>` +

  head.onclick = () => { S.tsOpen[key] = !S.tsOpen[key]; renderToolspace(); };
  sec.appendChild(head);
  if (S.tsOpen[key]) rowsHTMLBuilder(sec);
  return sec;
}
function renderToolspace() {
  if (!S.state) return;
  const tree = $("tstree"); tree.innerHTML = "";

  tree.appendChild(tsSection("layers", "Layers", S.state.layers.length,
    sec => {
      S.state.layers.forEach(layer => {
        const row = document.createElement("div");

        eye.className = "eye" + (layer.visible ? " on" : "");

        const sw = document.createElement("span");
        sw.className = "swatch"; sw.style.background = layer.color;

        const dot = document.createElement("span");

          logResult(await postJSON("/api/execute",

        sec.appendChild(row);

async function refresh() {
  S.state = await getJSON("/api/state");
  if (!S.state.spaces.some(sp => sp.ref === S.space)) setSpace("model");
  if (S.state.rev !== S.rev) { S.rev = S.state.rev; updateCanvas(); }
  if (S.selected) {  // revalidate: the entity may have moved or been erased
    const info = await postJSON("/api/query",
      { query: "get_entity", params: { id: S.selected.id } });
    if (info.ok) { S.selected.bbox = info.bbox;
                   S.selected.entity = info.entity; }
    else S.selected = null;
    drawOverlay();
    // don't rebuild the panel under the user's cursor mid-edit
    if (!S.selected || !$("props").contains(document.activeElement))
      renderProps();
  }
  renderToolspace(); renderLTabs(); renderStatus(); renderRibbon();
}
function setSpace(ref) {
  S.space = ref; S.pts = []; S.stationPicks = []; S.selected = null;
  renderProps();
  if (S.state) { renderLTabs(); renderToolspace(); renderStatus(); }
  updateCanvas();

// ----------------------------------------------------------------- tools
const TOOLS = {
  select:  { hint: "click an entity — it highlights and its properties " +
                   "open in the side panel; Delete removes, Esc clears" },
  pan:     { hint: "drag to pan; wheel zooms" },
  line:    { hint: "click start, then end (Shift or ORTHO = orthogonal)" },
  pline:   { hint: "click vertices; Enter or right-click to finish" },
  circle:  { hint: "click center, then a radius point" },
  arc:     { hint: "click start, a point on the arc, then end" },
  text:    { hint: "click the insertion point" },
  station: { hint: "click centerline elements in order; Enter to configure" },
  move:    { hint: "click an entity, then base point, then destination" },
  erase:   { hint: "click an entity to erase it" },
  insblock:{ hint: "click the insertion point" },
  edittext:{ hint: "click a text or table to edit it" },
};
function setTool(key) {
  S.tool = key; S.pts = []; S.stationPicks = []; S.selected = null;
  renderRibbon(); drawOverlay(); renderProps();
  $("st-tool").textContent = `${key.toUpperCase()}: ${TOOLS[key].hint}`;
}
function cancelTool() {
  S.pts = []; S.stationPicks = []; S.selected = null;
  drawOverlay(); renderProps();
}
function orthoAdjust(pt, ev) {
  if (!(ev.shiftKey || S.ortho) || !S.pts.length) return pt;
  const last = S.pts[S.pts.length - 1];
  return Math.abs(pt[0] - last[0]) >= Math.abs(pt[1] - last[1])
    ? [pt[0], last[1]] : [last[0], pt[1]];
}
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
function circumcenter(a, b, c) {
  const d = 2 * (a[0] * (b[1] - c[1]) + b[0] * (c[1] - a[1]) +
                 c[0] * (a[1] - b[1]));
  if (Math.abs(d) < 1e-9) return null;
  const sq = p => p[0] * p[0] + p[1] * p[1];
  return [(sq(a) * (b[1] - c[1]) + sq(b) * (c[1] - a[1]) +
           sq(c) * (a[1] - b[1])) / d,
          (sq(a) * (c[0] - b[0]) + sq(b) * (a[0] - c[0]) +
           sq(c) * (b[0] - a[0])) / d];
}
const angDeg = (c, p) => Math.atan2(p[1] - c[1], p[0] - c[0]) * 180 / Math.PI;
function arcFrom3(p1, p2, p3) {
  const c = circumcenter(p1, p2, p3);
  if (!c) return null;
  const r = dist(c, p1);
  const a1 = angDeg(c, p1), a2 = angDeg(c, p2), a3 = angDeg(c, p3);
  const span = x => ((x - a1) % 360 + 360) % 360;
  const ccw = span(a2) <= span(a3);
  return { center: c, radius: r, start: ccw ? a1 : a3, end: ccw ? a3 : a1 };
}
async function exec(command, params) {
  logResult(await postJSON("/api/execute",
    { command, params: { space: S.space, ...params } }));
}
async function hitAt(pt, tolPx) {
  const r = await postJSON("/api/query", { query: "hit_test",
    params: { space: S.space, point: pt, tolerance: tolPx * unitsPerPx() } });
  return r.ok && r.hits.length ? r.hits : [];
}
async function toolClick(pt, ev) {
  const tool = S.tool;
  if (tool === "line") {
    S.pts.push(orthoAdjust(pt, ev));
    if (S.pts.length === 2) {
      const [a, b] = S.pts; S.pts = [];
      await exec("draw_line", { start: a, end: b });
    }
  } else if (tool === "pline") {
    S.pts.push(orthoAdjust(pt, ev));
  } else if (tool === "circle") {
    S.pts.push(pt);
    if (S.pts.length === 2) {
      const [c, e] = S.pts; S.pts = [];
      const r = dist(c, e);
      if (r > 0) await exec("draw_circle", { center: c, radius: r });
    }
  } else if (tool === "arc") {
    S.pts.push(pt);
    if (S.pts.length === 3) {
      const [p1, p2, p3] = S.pts; S.pts = [];
      const arc = arcFrom3(p1, p2, p3);
      if (!arc) await exec("draw_line", { start: p1, end: p3 });
      else await exec("draw_arc", { center: arc.center, radius: arc.radius,
        start_angle_deg: arc.start, end_angle_deg: arc.end });
    }
  } else if (tool === "text") {
    const values = await openForm("Place text", [
      { key: "content", label: "Text", value: "" },
      { key: "height", label: `Height (${S.view.kind === "model" ? "ft" : "in"})`,
        value: S.view.kind === "model" ? "8" : "0.15" },
      { key: "rotation", label: "Rotation (deg)", value: "0" }]);
    if (values && values.content)
      await exec("place_text", { position: pt, content: values.content,
        height: parseFloat(values.height) || 0.15,
        rotation_deg: parseFloat(values.rotation) || 0 });
  } else if (tool === "insblock") {
    const blocks = S.state ? S.state.blocks : ["NORTH_ARROW"];
    const values = await openForm("Insert block", [
      { key: "block", label: "Block", value: blocks[0] || "NORTH_ARROW",
        options: blocks },
      { key: "scale", label: "Scale", value: "1" },
      { key: "rotation", label: "Rotation (deg)", value: "0" }]);
    if (values)
      await exec("insert_block", { block_name: values.block, position: pt,
        scale: parseFloat(values.scale) || 1,
        rotation_deg: parseFloat(values.rotation) || 0 });
  } else if (tool === "station") {
    const hits = await hitAt(pt, 10);
    const hit = hits.find(h => ["line", "polyline", "arc"].includes(h.type));
    if (!hit) { logHint("no line/polyline/arc within tolerance"); return; }
    if (!S.stationPicks.some(sp => sp.id === hit.id)) {
      S.stationPicks.push({ id: hit.id, pt });
      logHint(`path element ${S.stationPicks.length}: ${hit.id} ` +
              `(${hit.type}) — Enter when done`);
    }
  } else if (tool === "edittext") {
    const hits = await hitAt(pt, 8);
    const hit = hits.find(h => h.type === "text" || h.type === "table");
    if (hit) openEditorFor(hit.id);
    else logHint("no text or table there");
  } else if (tool === "erase") {
    const hits = await hitAt(pt, 8);
    if (hits.length)
      logResult(await postJSON("/api/execute",
        { command: "delete_entities", params: { ids: [hits[0].id] } }));
    else logHint("nothing to erase there");
  } else if (tool === "move") {
    if (!S.selected) {
      const hits = await hitAt(pt, 8);
      if (!hits.length) { logHint("click an entity to move"); return; }
      const info = await postJSON("/api/query",
        { query: "get_entity", params: { id: hits[0].id } });
      if (info.ok) {
        S.selected = { id: hits[0].id, bbox: info.bbox, entity: info.entity };
        renderProps();
        logHint(`moving ${hits[0].id}: click base point`);
      }
    } else if (S.pts.length === 0) {
      S.pts.push(pt);
      logHint("click destination");
    } else {
      const base = S.pts[0]; S.pts = [];
      const delta = [pt[0] - base[0], pt[1] - base[1]];
      const id = S.selected.id; S.selected = null; renderProps();
      logResult(await postJSON("/api/execute", { command: "move_entities",
        params: { ids: [id], delta } }));
    }
  } else if (tool === "select") {
    const hits = await hitAt(pt, 8);
    if (hits.length) {
      if (S.selected && S.selected.id === hits[0].id) return;  // already shown
      const info = await postJSON("/api/query",
        { query: "get_entity", params: { id: hits[0].id } });
      if (info.ok) {
        S.selected = { id: hits[0].id, bbox: info.bbox, entity: info.entity };
        renderProps();
        logHTML(`<span class="hint">selected ${esc(hits[0].id)} (` +
          `${esc(info.entity.type)}) on layer ${esc(info.entity.layer)} — ` +
          `edit in the Properties panel; Enter/double-click opens the full ` +
          `editor, Delete erases</span>`);
      }
    } else { S.selected = null; renderProps(); }
  }
  drawOverlay();
}
async function finishTool() {
  if (S.tool === "select" && S.selected) {
    openEditorFor(S.selected.id);
    return;
  }
  if (S.tool === "pline" && S.pts.length >= 2) {
    const verts = S.pts; S.pts = [];
    await exec("draw_polyline", { vertices: verts });
  } else if (S.tool === "station" && S.stationPicks.length) {
    const values = await openForm("Annotate stationing", [
      { key: "begin", label: "Begin station (e.g. 10+00)", value: "10+00" },
      { key: "interval", label: "Interval (ft)", value: "100" },
      { key: "tick", label: "Tick half-length (ft)", value: "10" },
      { key: "height", label: "Text height (ft)", value: "8" },
      { key: "offset", label: "Label offset (ft)", value: "16" }]);
    if (values) {
      const parseSta = s => s.includes("+")
        ? parseFloat(s.split("+")[0]) * 100 + parseFloat(s.split("+")[1] || 0)
        : parseFloat(s);
      await exec("annotate_stationing", {
        path_ids: S.stationPicks.map(sp => sp.id),
        begin_station: parseSta(values.begin) || 0,
        interval: parseFloat(values.interval) || 100,
        tick_half_len: parseFloat(values.tick) || 10,
        text_height: parseFloat(values.height) || 8,
        label_offset: parseFloat(values.offset) || 16 });
      S.stationPicks = [];
    }
  }
  drawOverlay();
}

// --------------------------------------------------------------- editors
async function applyChanges(id, changes) {
  if (!Object.keys(changes).length) { logHint("no changes"); return; }
  const r = await postJSON("/api/execute",
    { command: "modify_entity", params: { id, changes } });
  logResult(r);
  if (S.selected && S.selected.id === id) await reselect(id);
}

// Re-fetch the selected entity (after an edit, or on failure to revert the
// panel to server truth) and repaint the highlight + properties panel.
async function reselect(id) {
  const info = await postJSON("/api/query",
    { query: "get_entity", params: { id } });
  if (!S.selected || S.selected.id !== id) return;  // selection moved on
  S.selected = info.ok
    ? { id, bbox: info.bbox, entity: info.entity } : null;
  drawOverlay(); renderProps();
}

async function openEditorFor(id) {
  const info = await postJSON("/api/query",
    { query: "get_entity", params: { id } });
  if (!info.ok) { logResult(info); return; }
  const e = info.entity;
  if (e.type === "text") return editText(e);
  if (e.type === "table") return editTable(e);
  return editProperties(e);
}

async function editText(e) {
  const layers = S.state ? S.state.layers.map(l => l.name) : [e.layer];
  const styles = (S.state && S.state.text_styles) || ["STANDARD"];
  const v = await openForm(`Edit text ${e.id}`, [
    { key: "content", label: "Text", value: e.content, multiline: true },
    { key: "height", label: `Height (${S.view && S.view.kind === "model"
        ? "ft" : "in"})`, value: String(e.height) },
    { key: "rotation_deg", label: "Rotation (deg)",
      value: String(e.rotation_deg) },
    { key: "halign", label: "Justify H", value: e.halign,
      options: ["left", "center", "right"] },
    { key: "valign", label: "Justify V", value: e.valign,
      options: ["bottom", "middle", "top"] },
    { key: "style", label: "Style", value: e.style, options: styles },
    { key: "layer", label: "Layer", value: e.layer, options: layers },
  ]);
  if (!v) return;
  const changes = {};
  if (v.content !== e.content && v.content.trim())
    changes.content = v.content;
  const h = parseFloat(v.height);
  if (!isNaN(h) && h > 0 && h !== e.height) changes.height = h;
  const rot = parseFloat(v.rotation_deg);
  if (!isNaN(rot) && rot !== e.rotation_deg) changes.rotation_deg = rot;
  ["halign", "valign", "style", "layer"].forEach(k => {
    if (v[k] !== e[k]) changes[k] = v[k]; });
  await applyChanges(e.id, changes);
}

function serializeRows(rows) { return rows.map(r => r.join(" | ")).join("\n"); }
function parseRowsText(text, ncols) {
  return text.split("\n")
    .filter(line => line.trim() !== "")  // blank LINES only; " | " spacers stay
    .map(line => {
      const cells = line.split("|").map(s => s.trim()).slice(0, ncols);
      while (cells.length < ncols) cells.push("");
      return cells;
    });
}
async function editTable(e) {
  const unsafe = e.columns.some(c => /[|\n]/.test(c.header)) ||
    e.rows.some(r => r.some(cell => /[|\n]/.test(cell)));
  if (unsafe) {
    logHint("this table has cells containing '|' — opening the raw " +
            "Properties editor instead so nothing is corrupted");
    return editProperties(e);
  }
  const v = await openForm(`Edit table ${e.id}`, [
    { key: "title", label: "Title", value: e.title || "" },
    { key: "text_height", label: "Text height", value: String(e.text_height) },
    { key: "headers", label: "Headers (A | B | C)",
      value: e.columns.map(c => c.header).join(" | ") },
    { key: "rows", label: "Rows (one per line, cells with |)",
      value: e.rows.map(r => r.join(" | ")).join("\n"), multiline: true },
  ]);
  if (!v) return;
  const ncols = e.columns.length;
  const changes = {};
  if (v.title !== (e.title || "")) changes.title = v.title;
  const th = parseFloat(v.text_height);
  if (!isNaN(th) && th > 0 && th !== e.text_height) changes.text_height = th;
  const heads = v.headers.split("|").map(s => s.trim());
  if (heads.length === ncols) {
    if (JSON.stringify(heads) !==
        JSON.stringify(e.columns.map(c => c.header)))
      changes.columns = e.columns.map((c, i) =>
        ({ header: heads[i], width: c.width }));
  } else logHint(`headers unchanged: need ${ncols}, got ${heads.length}`);
  const userRows = parseRowsText(v.rows, ncols);
  const origRows = parseRowsText(serializeRows(e.rows), ncols);
  if (JSON.stringify(userRows) !== JSON.stringify(origRows))
    changes.rows = userRows;
  await applyChanges(e.id, changes);
}

async function editProperties(e) {
  const skip = new Set(["id", "type"]);
  const base = Object.entries(e).filter(([k]) => !skip.has(k));
  if (!("color" in e)) base.push(["color", null]);
  if (!("linetype" in e)) base.push(["linetype", null]);
  const fields = base.map(([k, val]) => ({
    key: k, label: k.replace(/_/g, " "),
    value: val === null ? "" :
           typeof val === "string" ? val : JSON.stringify(val),
    _orig: val,
  }));
  const v = await openForm(`Properties — ${e.type} ${e.id}`, fields);
  if (!v) return;
  const changes = {};
  fields.forEach(f => {
    const raw = v[f.key];
    let parsed;
    if (f.key === "color" || f.key === "linetype")
      parsed = raw === "" ? null : raw;  // empty always means ByLayer
    else if (raw === "" && (f._orig === null || typeof f._orig !== "string"))
      parsed = null;
    else if (typeof f._orig === "string" || f._orig === null) parsed = raw;
    else {
      try { parsed = JSON.parse(raw); }
      catch (err) {
        const nums = raw.split(",").map(Number);
        parsed = Array.isArray(f._orig) && nums.length > 1 &&
                 nums.every(n => !isNaN(n)) ? nums : raw;
      }
    }
    if (JSON.stringify(parsed) !== JSON.stringify(f._orig ?? null))
      changes[f.key] = parsed;
  });
  await applyChanges(e.id, changes);
}

// ------------------------------------------------------- properties panel
const fmtNum = v => String(Math.round(v * 10000) / 10000);

async function applyProp(changes) {
  if (!S.selected) return;
  const id = S.selected.id;
  const r = await postJSON("/api/execute",
    { command: "modify_entity", params: { id, changes } });
  logResult(r);
  await reselect(id);  // success updates the panel; failure reverts it
}

function propRow(label, node) {
  const row = document.createElement("div");
  row.className = "prow";
  const lab = document.createElement("label");
  lab.textContent = label; lab.title = label;
  row.append(lab, node);
  return row;
}
function propRO(label, text) {
  const span = document.createElement("span");
  span.className = "ro"; span.textContent = text; span.title = text;
  return propRow(label, span);
}
function propSelect(label, value, options, apply) {
  const sel = document.createElement("select");
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o; opt.textContent = o; opt.selected = o === value;
    sel.appendChild(opt);
  });
  sel.onchange = () => apply(sel.value);
  return propRow(label, sel);
}
function propInput(label, value, apply) {
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = value;
  inp.onkeydown = ev => {
    if (ev.key === "Enter") inp.blur();
    else if (ev.key === "Escape") { inp.value = value; inp.blur(); }
    ev.stopPropagation();
  };
  inp.onblur = () => { if (inp.value !== String(value)) apply(inp.value); };
  return propRow(label, inp);
}
function propNum(label, value, apply, opts = {}) {
  return propInput(label, fmtNum(value), raw => {
    const v = parseFloat(raw);
    if (isNaN(v)) { logHint(`${label}: "${raw}" is not a number`);
                    renderProps(); return; }
    if (opts.positive && v <= 0) { logHint(`${label} must be positive`);
                                   renderProps(); return; }
    apply(v);
  });
}
function propCheck(label, value, apply) {
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.checked = value;
  inp.onchange = () => apply(inp.checked);
  return propRow(label, inp);
}
function effectiveHex(e) {
  const named = (S.state && S.state.colors) || {};
  if (e.color) {
    if (e.color[0] === "#") return e.color;
    if (named[e.color]) return named[e.color];
  }
  const layer = S.state &&
    S.state.layers.find(l => l.name === e.layer);
  return layer ? layer.color : "#888888";
}
function propColor(e) {
  const named = Object.keys((S.state && S.state.colors) || {});
  const wrap = document.createElement("div");
  wrap.className = "colorwrap";
  const isHex = typeof e.color === "string" && e.color[0] === "#";
  const current = e.color == null ? "ByLayer" : isHex ? "Custom…" : e.color;
  const sel = document.createElement("select");
  ["ByLayer", ...named, "Custom…"].forEach(o => {
    const opt = document.createElement("option");
    opt.value = o; opt.textContent = o; opt.selected = o === current;
    sel.appendChild(opt);
  });
  const pick = document.createElement("input");
  pick.type = "color"; pick.value = effectiveHex(e).toLowerCase();
  pick.title = "pick a custom color";
  pick.onchange = () => applyProp({ color: pick.value.toUpperCase() });
  sel.onchange = () => {
    if (sel.value === "ByLayer") applyProp({ color: null });
    else if (sel.value === "Custom…") pick.click();
    else applyProp({ color: sel.value });
  };
  wrap.append(sel, pick);
  return propRow("Color", wrap);
}

function renderProps() {
  const panel = $("props");
  const e = S.selected && S.selected.entity;
  if (!e) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  $("props-id").textContent = `${e.type} ${e.id}`;
  const body = $("props-body"); body.innerHTML = "";
  const add = row => body.appendChild(row);
  const sec = title => {
    const d = document.createElement("div");
    d.className = "psec"; d.textContent = title;
    body.appendChild(d);
  };
  const hint = text => {
    const d = document.createElement("div");
    d.className = "phint"; d.textContent = text;
    body.appendChild(d);
  };

  sec("GENERAL");
  add(propSelect("Layer", e.layer,
    S.state ? S.state.layers.map(l => l.name) : [e.layer],
    v => applyProp({ layer: v })));
  add(propColor(e));
  add(propSelect("Linetype", e.linetype || "ByLayer",
    ["ByLayer", ...((S.state && S.state.linetypes) || [])],
    v => applyProp({ linetype: v === "ByLayer" ? null : v })));

  const unit = S.view && S.view.kind === "model" ? "ft" : "in";
  if (e.type === "line") {
    sec("GEOMETRY");
    add(propNum("Start X", e.start[0],
      v => applyProp({ start: [v, e.start[1]] })));
    add(propNum("Start Y", e.start[1],
      v => applyProp({ start: [e.start[0], v] })));
    add(propNum("End X", e.end[0], v => applyProp({ end: [v, e.end[1]] })));
    add(propNum("End Y", e.end[1], v => applyProp({ end: [e.end[0], v] })));
    add(propRO("Length", `${fmtNum(dist(e.start, e.end))} ${unit}`));
    add(propRO("Angle",
      fmtNum(((angDeg(e.start, e.end) % 360) + 360) % 360) + "°"));
  } else if (e.type === "circle") {
    sec("GEOMETRY");
    add(propNum("Center X", e.center[0],
      v => applyProp({ center: [v, e.center[1]] })));
    add(propNum("Center Y", e.center[1],
      v => applyProp({ center: [e.center[0], v] })));
    add(propNum("Radius", e.radius, v => applyProp({ radius: v }),
      { positive: true }));
  } else if (e.type === "arc") {
    sec("GEOMETRY");
    add(propNum("Center X", e.center[0],
      v => applyProp({ center: [v, e.center[1]] })));
    add(propNum("Center Y", e.center[1],
      v => applyProp({ center: [e.center[0], v] })));
    add(propNum("Radius", e.radius, v => applyProp({ radius: v }),
      { positive: true }));
    add(propNum("Start angle", e.start_angle_deg,
      v => applyProp({ start_angle_deg: v })));
    add(propNum("End angle", e.end_angle_deg,
      v => applyProp({ end_angle_deg: v })));
  } else if (e.type === "polyline") {
    sec("GEOMETRY");
    add(propRO("Vertices", String(e.vertices.length)));
    add(propCheck("Closed", e.closed, v => applyProp({ closed: v })));
    let len = 0;
    for (let i = 1; i < e.vertices.length; i++)
      len += dist(e.vertices[i - 1], e.vertices[i]);
    if (e.closed && e.vertices.length > 2)
      len += dist(e.vertices[e.vertices.length - 1], e.vertices[0]);
    add(propRO("Length", `${fmtNum(len)} ${unit}`));
    hint("double-click the polyline for the raw editor (vertices)");
  } else if (e.type === "text") {
    sec("TEXT");
    add(propInput("Contents", e.content,
      v => v.trim() ? applyProp({ content: v }) : renderProps()));
    add(propNum("Height", e.height, v => applyProp({ height: v }),
      { positive: true }));
    add(propNum("Rotation", e.rotation_deg,
      v => applyProp({ rotation_deg: v })));
    add(propSelect("Justify H", e.halign, ["left", "center", "right"],
      v => applyProp({ halign: v })));
    add(propSelect("Justify V", e.valign, ["bottom", "middle", "top"],
      v => applyProp({ valign: v })));
    add(propSelect("Style", e.style,
      (S.state && S.state.text_styles) || [e.style],
      v => applyProp({ style: v })));
    sec("GEOMETRY");
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
  } else if (e.type === "blockref") {
    sec("BLOCK");
    add(propRO("Block", e.block_name));
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
    add(propNum("Scale", e.scale, v => applyProp({ scale: v }),
      { positive: true }));
    add(propNum("Rotation", e.rotation_deg,
      v => applyProp({ rotation_deg: v })));
  } else if (e.type === "table") {
    sec("TABLE");
    add(propInput("Title", e.title || "", v => applyProp({ title: v })));
    add(propNum("Text height", e.text_height,
      v => applyProp({ text_height: v }), { positive: true }));
    add(propRO("Size", `${e.columns.length} cols × ${e.rows.length} rows`));
    sec("GEOMETRY");
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
    hint("double-click the table to edit headers and cells");
  }
}
$("props-close").onclick = () => { S.selected = null;
  drawOverlay(); renderProps(); };

// --------------------------------------------------------------- overlay
function seg(a, b, cls) {
  return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ` +
         `class="${cls}"/>`;
}
function arcSweepDeg(s, e) {
  s = ((s % 360) + 360) % 360; e = ((e % 360) + 360) % 360;
  if (e <= s) e += 360;
  return [s, e];
}
function sampleArcPts(c, r, a0, a1) {
  const n = Math.max(16, Math.ceil((a1 - a0) / 6));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    pts.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]);
  }
  return pts;
}
// Space-coordinate polylines tracing an entity's real shape; null means the
// caller should fall back to the bbox (text, tables, block references).
function entityOutline(e) {
  if (!e) return null;
  if (e.type === "line") return [{ pts: [e.start, e.end] }];
  if (e.type === "polyline" && e.vertices.length >= 2)
    return [{ pts: e.vertices, closed: e.closed }];
  if (e.type === "circle")
    return [{ pts: sampleArcPts(e.center, e.radius, 0, 360), closed: true }];
  if (e.type === "arc") {
    const [s, en] = arcSweepDeg(e.start_angle_deg, e.end_angle_deg);
    return [{ pts: sampleArcPts(e.center, e.radius, s, en) }];
  }
  return null;
}
// The selected entity, drawn shifted by [dx, dy] space units. Default styling
// is the glow highlight; pass cls (e.g. "rb") for the move rubber-band ghost.
function highlightSVG(dx, dy, cls) {
  if (!S.selected) return "";
  const shift = p => [p[0] + dx, p[1] + dy];
  const shapes = entityOutline(S.selected.entity);
  if (shapes) {
    return shapes.map(sh => {
      const tag = sh.closed ? "polygon" : "polyline";
      const pts = sh.pts.map(p => spacePx(shift(p))
        .map(v => v.toFixed(2)).join(",")).join(" ");
      return cls
        ? `<${tag} points="${pts}" class="${cls}"/>`
        : `<${tag} points="${pts}" class="hlglow"/>` +
          `<${tag} points="${pts}" class="hlcore"/>`;
    }).join("");
  }
  const bb = S.selected.bbox;
  if (!bb) return "";
  const a = spacePx(shift([bb[0], bb[1]])), b = spacePx(shift([bb[2], bb[3]]));
  return `<rect x="${Math.min(a[0], b[0])}" y="${Math.min(a[1], b[1])}" ` +
         `width="${Math.abs(b[0] - a[0])}" ` +
         `height="${Math.abs(b[1] - a[1])}" class="${cls || "hlbox"}"/>`;
}
function drawOverlay() {
  const svg = $("ovl");
  const img = $("view");
  if (!S.view || !img.naturalWidth) { svg.innerHTML = ""; return; }
  const nw = img.naturalWidth, nh = img.naturalHeight;
  let out = "";
  if (S.cursor && !["select", "pan"].includes(S.tool)) {
    const c = spacePx(S.cursor);
    out += seg([0, c[1]], [nw, c[1]], "ch") + seg([c[0], 0], [c[0], nh], "ch");
  }
  const px = S.pts.map(spacePx);
  const cur = S.cursor ? spacePx(S.cursor) : null;
  if (S.tool === "line" && px.length === 1 && cur) out += seg(px[0], cur, "rb");
  if (S.tool === "pline" && px.length) {
    for (let i = 1; i < px.length; i++) out += seg(px[i - 1], px[i], "rb");
    if (cur) out += seg(px[px.length - 1], cur, "rb");
  }
  if (S.tool === "circle" && px.length === 1 && cur) {
    const rp = dist(px[0], cur);
    out += `<circle cx="${px[0][0]}" cy="${px[0][1]}" r="${rp}" class="rb"/>`;
  }
  if (S.tool === "arc") {
    if (px.length === 1 && cur) out += seg(px[0], cur, "rb");
    if (px.length === 2 && cur && S.cursor) {
      const arc = arcFrom3(S.pts[0], S.pts[1], S.cursor);
      if (arc) {
        const s0 = ((arc.start % 360) + 360) % 360;
        let s1 = ((arc.end % 360) + 360) % 360;
        if (s1 <= s0) s1 += 360;
        const pts = [];
        for (let i = 0; i <= 32; i++) {
          const a = (s0 + (s1 - s0) * i / 32) * Math.PI / 180;
          pts.push(spacePx([arc.center[0] + arc.radius * Math.cos(a),
                            arc.center[1] + arc.radius * Math.sin(a)]));
        }
        out += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" ` +
               `class="rb"/>`;
      } else out += seg(px[0], cur, "rb");
    }
  }
  if (S.tool === "move" && S.selected && px.length === 1 && cur) {
    out += seg(px[0], cur, "rb");
    if (S.cursor)
      out += highlightSVG(S.cursor[0] - S.pts[0][0],
                          S.cursor[1] - S.pts[0][1], "rb");
  }
  S.stationPicks.forEach(sp => {
    const p = spacePx(sp.pt);
    out += `<rect x="${p[0] - 4}" y="${p[1] - 4}" width="8" height="8" ` +
           `class="mark"/>`;
  });
  if (S.selected) out += highlightSVG(0, 0);
  svg.innerHTML = out;
}

// ----------------------------------------------------- stage interactions
const stage = $("stage");
let pan = null;
stage.addEventListener("pointerdown", ev => {
  if (ev.button === 1 || (ev.button === 0 && S.tool === "pan")) {
    pan = { x: ev.clientX, y: ev.clientY,
            bounds: S.view && S.view.bounds,
            sl: $("viewwrap").scrollLeft, st: $("viewwrap").scrollTop };
    stage.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  }
});
stage.addEventListener("pointermove", ev => {
  const pt = evtSpace(ev);
  if (pt) {
    S.cursor = ["line", "pline"].includes(S.tool) ? orthoAdjust(pt, ev) : pt;
    $("st-coord").textContent = fmtPt(pt);
    drawOverlay();
  }
  if (pan) {
    if (S.view && S.view.kind === "model") {
      const t = `translate(${ev.clientX - pan.x}px, ${ev.clientY - pan.y}px)`;
      $("view").style.transform = t; $("ovl").style.transform = t;
    } else {
      $("viewwrap").scrollLeft = pan.sl - (ev.clientX - pan.x);
      $("viewwrap").scrollTop = pan.st - (ev.clientY - pan.y);
    }
  }
});
stage.addEventListener("pointerup", ev => {
  if (pan) {
    if (S.view && S.view.kind === "model" && pan.bounds) {
      const r = $("view").getBoundingClientRect();
      const b = pan.bounds;
      const dx = (ev.clientX - pan.x) / r.width * (b[2] - b[0]);
      const dy = (ev.clientY - pan.y) / r.height * (b[3] - b[1]);
      $("view").style.transform = ""; $("ovl").style.transform = "";
      if (dx || dy) {
        S.modelBounds = [b[0] - dx, b[1] + dy, b[2] - dx, b[3] + dy];
        updateCanvas();
      }
    }
    pan = null;
    return;
  }
  if (ev.button === 0 && S.view) {
    const pt = evtSpace(ev);
    if (pt) toolClick(pt, ev);
  }
});
stage.addEventListener("dblclick", async ev => {
  ev.preventDefault();
  if (S.pts.length || S.stationPicks.length) {
    // the double-click's own two clicks each added a vertex; drop the dupe
    if (S.tool === "pline" && S.pts.length >= 3) S.pts.pop();
    finishTool();
    return;
  }
  if (S.tool !== "select") { finishTool(); return; }
  const pt = evtSpace(ev);
  if (!pt) return;
  const hits = await hitAt(pt, 8);
  if (hits.length) openEditorFor(hits[0].id);
});
stage.addEventListener("contextmenu", ev => { ev.preventDefault();
                                              finishTool(); });
stage.addEventListener("pointerleave", () => { S.cursor = null;
  $("st-coord").textContent = ""; drawOverlay(); });

// Wheel zoom: factor proportional to scroll delta (smooth on trackpads and
// scroll wheels alike), anchored at the cursor. Model space gets instant CSS
// feedback scaled about the cursor while the true re-render at the new
// coordinate window catches up; sheets zoom the raster with scroll anchoring.
let wheelTimer = null;
const pend = { k: 1, x: 0, y: 0 };
function applyPendingZoom() {
  const o = `${pend.x}px ${pend.y}px`;
  const t = pend.k === 1 ? "" : `scale(${pend.k})`;
  const img = $("view"), ovl = $("ovl");
  img.style.transformOrigin = o; ovl.style.transformOrigin = o;
  img.style.transform = t; ovl.style.transform = t;
}
function clearPendingZoom() {
  pend.k = 1;
  $("view").style.transform = ""; $("ovl").style.transform = "";
}
$("viewwrap").addEventListener("wheel", ev => {
  if (!S.view) return;
  ev.preventDefault();
  const delta = Math.max(-80, Math.min(80, ev.deltaY));
  const f = Math.exp(delta * 0.002);  // >1 zooms out, <1 zooms in
  if (f === 1) return;
  if (S.view.kind === "model") {
    const pt = evtSpace(ev);
    const b = S.modelBounds || S.view.bounds;
    S.modelBounds = [pt[0] - (pt[0] - b[0]) * f, pt[1] - (pt[1] - b[1]) * f,
                     pt[0] + (b[2] - pt[0]) * f, pt[1] + (b[3] - pt[1]) * f];
    const r = $("stage").getBoundingClientRect();
    pend.k /= f;
    pend.x = ev.clientX - r.left;
    pend.y = ev.clientY - r.top;
    applyPendingZoom();
    applyZoom();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(updateCanvas, 140);
  } else {
    const wrap = $("viewwrap");
    const oldZoom = S.zoom || 1;
    const newZoom = Math.max(0.3, Math.min(8, oldZoom / f));
    if (newZoom === oldZoom) return;
    const r = wrap.getBoundingClientRect();
    const cx = ev.clientX - r.left + wrap.scrollLeft;
    const cy = ev.clientY - r.top + wrap.scrollTop;
    const ratio = newZoom / oldZoom;
    S.zoom = newZoom;
    applyZoom();
    wrap.scrollLeft = cx * ratio - (ev.clientX - r.left);
    wrap.scrollTop = cy * ratio - (ev.clientY - r.top);
  }
}, { passive: false });

function applyZoom() {
  const st = $("stage");
  if (!S.zoom) { st.style.width = "calc(100% - 24px)";
    $("zoompct").textContent =
      S.space === "model" && S.modelBounds ? "zoom" : "fit"; }
  else { st.style.width = (S.zoom * 100) + "%";
         $("zoompct").textContent = Math.round(S.zoom * 100) + "%"; }
}
function zoomBtn(f) {
  if (S.space === "model") {
    const b = S.modelBounds || (S.view && S.view.bounds);
    if (!b) return;
    const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    S.modelBounds = [cx - (cx - b[0]) * f, cy - (cy - b[1]) * f,
                     cx + (b[2] - cx) * f, cy + (b[3] - cy) * f];
    updateCanvas(); applyZoom();
  } else { S.zoom = Math.max(0.3, (S.zoom || 1) / f); applyZoom(); }
}
$("zin").onclick = () => zoomBtn(0.8);
$("zout").onclick = () => zoomBtn(1.25);
$("zfit").onclick = () => { S.zoom = 0; S.modelBounds = null; applyZoom();
                            updateCanvas(); };
$("zpng").onclick = () => window.open(imgURL(), "_blank");

// ----------------------------------------------------------------- modal
function openForm(title, fields) {
  return new Promise(resolve => {
    const modal = $("modal");
    modal.innerHTML = `<h3>${esc(title)}</h3>` + fields.map((f, i) =>
      `<div class="row"><label>${esc(f.label)}</label>` +
      (f.multiline
        ? `<textarea id="mf${i}" rows="${Math.min(8, Math.max(3,
            String(f.value).split("\n").length + 1))}">\n${esc(f.value)}` +
          `</textarea>`
        : f.options
        ? `<select id="mf${i}">` + f.options.map(o =>
            `<option${o === f.value ? " selected" : ""}>${esc(o)}</option>`)
            .join("") + `</select>`
        : `<input type="text" id="mf${i}" value="${esc(f.value)}">`) +
      `</div>`).join("") +
      `<div class="actions"><div class="zbtn" id="mcancel">Cancel</div>` +
      `<div class="zbtn" id="mok">OK</div></div>`;
    $("modal-bg").style.display = "flex";
    const done = values => { $("modal-bg").style.display = "none";
                             resolve(values); };
    $("mok").onclick = () => done(Object.fromEntries(
      fields.map((f, i) => [f.key, $("mf" + i).value])));
    $("mcancel").onclick = () => done(null);
    modal.onkeydown = ev => {
      if (ev.key === "Enter" && ev.target.tagName !== "TEXTAREA")
        $("mok").click();
      if (ev.key === "Escape") $("mcancel").click();
      ev.stopPropagation();
    };
    $("mf0").focus();
    if ($("mf0").select) $("mf0").select();
  });
}

// ------------------------------------------------------------ command bar
async function sendLine(line) {
  logEcho(line);
  const resp = await postJSON("/api/line", { line, space: S.space });
  if (resp.kind === "noop") { if (resp.message) logHint(resp.message); }
  else if (resp.kind === "error")
    logHTML(`<span class="err">✗ ${esc(resp.message)}</span>`);
  else if (resp.kind === "space") { S.space = resp.space;
    logHint(resp.message); renderLTabs(); renderStatus(); updateCanvas(); }
  else if (resp.kind === "help") {
    if (resp.item)
      logHTML(`<span class="ok">${esc(resp.item.name)}</span> ` +
        `<span class="hint">(${esc(resp.item.kind)}): ` +
        `${esc(resp.item.description)}</span>` +
        jsonBlock(resp.item.example, "example") +
        jsonBlock(resp.item.params_schema, "schema"));
    else logHTML(`<span class="hint">` + resp.topics.map(t =>
      `<b>${esc(t.name)}</b> — ${esc(t.description)}`).join("<br>") +
      `</span>`);
  } else if (resp.kind === "result") logResult(resp.result);
}
$("cmd").addEventListener("keydown", ev => {
  ev.stopPropagation();
  const input = $("cmd");
  if (ev.key === "Enter") {
    const line = input.value.trim();
    if (!line) return;
    S.history.push(line); S.hIdx = S.history.length; input.value = "";
    sendLine(line);
  } else if (ev.key === "ArrowUp") {
    if (S.hIdx > 0) { S.hIdx--; input.value = S.history[S.hIdx]; }
    ev.preventDefault();
  } else if (ev.key === "ArrowDown") {
    if (S.hIdx < S.history.length - 1) { S.hIdx++;
      input.value = S.history[S.hIdx]; }
    else { S.hIdx = S.history.length; input.value = ""; }
    ev.preventDefault();
  } else if (ev.key === "Tab") {
    ev.preventDefault();
    const parts = input.value.split(" ");
    if (parts.length === 1 && parts[0]) {
      const matches = S.names.filter(n =>
        n.startsWith(parts[0].toLowerCase()));
      if (matches.length === 1) input.value = matches[0] + " ";
      else if (matches.length > 1) logHint(matches.join("  "));
    }
  } else if (ev.key === "Escape") { input.value = ""; input.blur(); }
});
$("run").onclick = () => {
  const line = $("cmd").value.trim();
  if (line) { S.history.push(line); S.hIdx = S.history.length;
              $("cmd").value = ""; sendLine(line); }
};

// -------------------------------------------------------------- QAT etc.
$("q-save").innerHTML = icon("save", 16);
$("q-undo").innerHTML = icon("undo", 16);
$("q-redo").innerHTML = icon("redo", 16);
$("q-save").onclick = () => ribbonAct("save");
$("q-undo").onclick = () => ribbonAct("undo");
$("q-redo").onclick = () => ribbonAct("redo");
$("tog-ortho").onclick = () => { S.ortho = !S.ortho;
  $("tog-ortho").classList.toggle("on", S.ortho); };

// ------------------------------------------------------- global keyboard
const TOOL_KEYS = { v: "select", h: "pan", l: "line", p: "pline",
                    c: "circle", a: "arc", t: "text", s: "station",
                    m: "move", e: "erase", i: "insblock", x: "edittext" };
document.addEventListener("keydown", ev => {
  if ($("modal-bg").style.display === "flex") return;  // dialog owns the keys
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" ||
      ev.target.tagName === "SELECT") return;
  const key = ev.key.toLowerCase();
  if (ev.key === "F8") { ev.preventDefault(); $("tog-ortho").click(); }
  else if (TOOL_KEYS[key] && !ev.metaKey && !ev.ctrlKey)
    setTool(TOOL_KEYS[key]);
  else if (ev.key === "Enter") finishTool();
  else if (ev.key === "Escape") cancelTool();
  else if ((ev.key === "Delete" || ev.key === "Backspace") && S.selected) {
    postJSON("/api/execute", { command: "delete_entities",
      params: { ids: [S.selected.id] } }).then(logResult);
    S.selected = null; drawOverlay(); renderProps();
  }
});

// ------------------------------------------------------------------- SSE
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("conn").textContent = "● live";
                      $("conn").classList.remove("bad"); };
  es.onmessage = ev => {
    try { const { rev } = JSON.parse(ev.data);
          if (rev !== S.rev) refresh(); } catch (e) {}
  };
  es.onerror = () => { $("conn").textContent = "○ reconnecting…";
                       $("conn").classList.add("bad"); };
}

// ------------------------------------------------------------------ boot
(async function boot() {
  renderRibbon();
  setTool("select");
  const manifest = await getJSON("/api/manifest");
  const names = new Set();
  manifest.commands.concat(manifest.queries).forEach(i => names.add(i.name));
  ["line","pline","arc","circle","text","insert","table","sheet","viewport",
   "titleblock","erase","move","mklayer","layer","space","state","layers",
   "sheets","blocks","styles","entities","extents","journal","help","dxf",
   "pdf","save","undo","redo","station","xref","refs"].forEach(n =>
    names.add(n));
  S.names = [...names].sort();
  await refresh();
  connect();
  logHint("RoadDraft ready. Ribbon tools are selectable (or keys " +
    "V/H/L/P/C/A/T/S/M/E/I); click the canvas to draw. ORTHO and F8 " +
    "constrain to horizontal/vertical. The command line speaks the full " +
    "language — 'help' lists it.");
})();
