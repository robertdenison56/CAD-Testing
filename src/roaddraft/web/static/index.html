async function alongDialog() {
  const aligns = alignNames();
  const picked = S.selected && !S.selected.alignment ? S.selected.id : null;
  const blocks = S.state ? S.state.blocks : [];
  const v = await openForm("Place along a path (measure / divide)", [
    { key: "path", label: "Path: an alignment, or entity id(s) comma separated",
      value: picked || aligns[0] || "" },
    { key: "every", label: "Every (blank: use count)", value: "100" },
    { key: "count", label: "Count, evenly spaced (when every is blank)", value: "" },
    { key: "from", label: "From: station or distance (blank: the start)", value: "" },
    { key: "to", label: "To (blank: the end)", value: "" },
    { key: "offset", label: "Offset (2R, 2L; blank: on it)", value: "" },
    { key: "what", label: "Place", value: "COGO points", options: ["COGO points", ...blocks] },
    { key: "description", label: "Point description", value: "" }]);
  if (!v) return;
  const path = v.path.split(",").map(x => x.trim()).filter(Boolean);
  if (!path.length) { logHint("name a path"); return; }
  const params = { path: path.length === 1 ? path[0] : path };
  if (v.every.trim()) params.every = parseFloat(v.every);
  else params.count = parseInt(v.count, 10) || 2;
  const num = t => (/^[-+]?\d*\.?\d+$/.test(t.trim()) ? parseFloat(t) : t.trim());
  if (v.from.trim()) params.from = num(v.from);
  if (v.to.trim()) params.to = num(v.to);
  if (v.offset.trim()) params.offset = v.offset.trim();
  if (v.what !== "COGO points") params.block = v.what;
  else if (v.description.trim()) params.description = v.description.trim();
  await run("place_along", params);
}
// LIST: what the engine reads off the selected entity.
async function listSelected() {
  if (!S.selected || S.selected.alignment) {
    logHint("select an entity first (Select tool), then List"); return; }
  const info = await postJSON("/api/query", { query: "get_entity",
                                              params: { id: S.selected.id } });
  if (!info.ok) { logResult(info); return; }
  const p = info.properties || {};
  const show = v => Array.isArray(v) ? (v.length === 2 && typeof v[0] === "number"
    ? fmtPt(v) : JSON.stringify(v)) : (typeof v === "number" ? fmtNum(v) : String(v));
  const rows = Object.entries(p).filter(([k]) => !["segments", "extents", "units"].includes(k))
    .map(([k, v]) => `<b>${esc(k.replace(/_/g, " "))}</b> ${esc(show(v))}`);
  logHTML(`<span class="ok">${esc(info.entity.type)} ${esc(S.selected.id)} on ` +
          `${esc(info.entity.layer)}</span><br><span class="hint">${rows.join(" · ")}` +
          `</span>` + (p.segments ? jsonBlock(p.segments, "segments") : ""));
}
// A station and offset typed for a point: 30+00@12R, SR-100:PC-1@12L,
// STA 30+00 OFF 12R -- Civil 3D's transparent 'SO.
async function typedStation(t) {
  let anchor = null, align = null, m;
  if ((m = t.match(/^STA\.?\s*(\S+)\s+(?:OFF(?:SET)?\.?\s*)?(\S+)$/i)))
    anchor = `${m[1]}@${m[2]}`;
  else if (t.includes("@")) {
    const k = t.lastIndexOf(":", t.indexOf("@"));
    if (k > 0) { align = t.slice(0, k); anchor = t.slice(k + 1); } else anchor = t;
  }
  if (!anchor || !/^(\d+\+\d+(\.\d*)?|BEGIN|END|(PI|PC|PT|BC|EC|MC)-\d+)@[-+]?\d*\.?\d+\s*[LR]?$/i
        .test(anchor.replace(/\s+/g, ""))) return null;
  const aligns = alignNames();
  if (!align) {
    if (!aligns.length) { logHint("no alignment to count stations along"); return "error"; }
    align = aligns[0];
    if (aligns.length > 1) logHint(`on ${align} — name another: SR-200:30+00@12R`);
  }
  const r = await postJSON("/api/query", { query: "resolve_anchor",
    params: { anchor: anchor.replace(/\s+/g, ""), alignment: align } });
  if (!r.ok) { logResult(r); return "error"; }
  return r.anchor_point;
}
// A typed number or word while a modify tool waits: true when it was taken.
function modifyInput(t, line) {
  const num = new RegExp(`^${NUM}$`).test(t) ? +t : null;
  if (S.tool === "chamfer") {
    const parts = t.split(/[\s,]+/).filter(Boolean).map(Number);
    if (parts.length && parts.length <= 2 && parts.every(x => x > 0)) {
      S.chamfer = [parts[0], parts[1] || parts[0]]; logEcho(line); logHint(chamferSays());
      return true;
    }
  }
  if (S.tool === "lengthen" && num !== null && num !== 0) {
    S.lengthenBy = num; logEcho(line); logHint(lengthenSays()); return true; }
  if (S.tool === "hatch") {
    if (num !== null && num > 0) { S.hatchScale = num; logEcho(line); logHint(hatchSays());
                                   return true; }
    if (/^[A-Z][A-Z0-9_\-.]*$/i.test(t) && !/^(hatch|help|undo|redo)$/i.test(t)) {
      S.hatchPattern = t.toUpperCase(); logEcho(line); logHint(hatchSays()); return true; }
  }
  if (S.tool === "points" && /^desc(ription)?\b/i.test(t)) {
    S.pointDesc = t.replace(/^desc(ription)?\s*=?\s*/i, ""); logEcho(line);
    logHint(S.pointDesc ? `points are described ${S.pointDesc}` : "no description");
    return true;
  }
  if (S.tool === "rotate" && S.selDone && S.pts.length === 1 && t &&
      /^[-+]?[\d.°'"\- ]+\s*(CW|CCW)?$/i.test(t)) {
    logEcho(line);
    run("rotate_entities", { ids: S.picks.map(p => p.id), base: S.pts[0],
                             angle: num !== null ? num : t }).then(finishSel);
    return true;
  }
  if (S.tool === "scale" && S.selDone && S.pts.length === 1 && num !== null && num > 0) {
    logEcho(line);
    run("scale_entities", { ids: S.picks.map(p => p.id), base: S.pts[0], factor: num })
      .then(finishSel);
    return true;
  }
  return false;
}
// A bare tool name typed on the command line starts the tool, as in AutoCAD.
const TOOL_WORDS = { trim: "trim", tr: "trim", extend: "extend", ex: "extend",
  copy: "copy", co: "copy", cp: "copy", rotate: "rotate", ro: "rotate",
  mirror: "mirror", mi: "mirror", scale: "scale", sc: "scale", array: "array",
  ar: "array", break: "break", br: "break", join: "join", j: "join",
  explode: "explode", x: "explode", chamfer: "chamfer", cha: "chamfer",
  lengthen: "lengthen", len: "lengthen", hatch: "hatch", h: "hatch", area: "area",
  aa: "area", points: "points", point: "points", po: "points",
  pointtable: "pointtable", labelseg: "labelseg", linetable: "linetable",
  offset: "offset", o: "offset", fillet: "fillet", f: "fillet", line: "line",
  l: "line", pline: "pline", pl: "pline", circle: "circle", c: "circle", arc: "arc",
  a: "arc", move: "move", m: "move", erase: "erase", e: "erase", dist: "measure",
  di: "measure" };

// ---------------------------------------------------------- object snaps
// The cursor asks the engine for the key point under it -- endpoint,
// midpoint, center, intersection, alignment PI/BC/EC... -- one request at a
// time, the latest position winning. A click near the marker takes the snap.
const SNAP_PX = 12;
const SNAP_KINDS = ["endpoint", "midpoint", "center", "quadrant", "intersection",
                    "perpendicular", "tangent", "nearest", "insertion", "node",
                    "design"];
const SNAP_NAMES = { design: "design point (PI, BC, EC…)",
                     node: "node (dimension points)" };
function snapWanted() {
  return S.osnap && S.view && (S.grip || POINT_TOOLS.has(S.tool) ||
    (S.tool === "move" && S.selected) || S.tool === "dim" ||
    S.tool === "dimaligned" || (S.tool === "offset" && S.offsetDist === null &&
                                S.picks.length) ||
    (SEL_TOOLS.has(S.tool) && S.selDone) || S.tool === "break");
}
async function requestSnap(pt) {
  if (!snapWanted()) { if (S.snap) { S.snap = null; drawOverlay(); } return; }
  S.snapPending = pt;
  if (S.snapBusy) return;
  S.snapBusy = true;
  try {
    while (S.snapPending) {
      const at = S.snapPending; S.snapPending = null;
      const params = { space: S.space, point: at, tolerance: SNAP_PX * unitsPerPx(),
                       modes: [...S.snapModes] };
      const from = !S.grip && S.pts.length ? S.pts[S.pts.length - 1] : null;
      if (from) params.from = from;
      if (!params.modes.length) { S.snap = null; break; }
      const r = await postJSON("/api/query", { query: "snap", params });
      if (S.snapPending) continue;          // the cursor moved on: ask again
      S.snap = r.ok && r.snapped ? { ...r, at } : null;
      if (S.snap && S.hoverPt === at) {     // still there: the cursor jumps to it
        S.cursor = S.snap.point;
        if (S.grip) S.grip.at = S.snap.point;
        $("st-coord").textContent = fmtPt(S.snap.point);
      }
      drawOverlay();
    }
  } finally { S.snapBusy = false; }
}
// The snap a pick at pt takes, or null when none is showing near it.
function snapped(pt) {
  if (!snapWanted() || !S.snap) return null;
  return dist(S.snap.at, pt) <= SNAP_PX * unitsPerPx() * 1.5 ? S.snap.point : null;
}
function snapSVG() {
  if (!S.snap || !snapWanted()) return "";
  const k = pxScale(), r = 6 * k;
  const [x, y] = spacePx(S.snap.point);
  const pts = a => `<polygon points="${a.map(q => q.map(v => v.toFixed(2))
                                                 .join(",")).join(" ")}" ` +
                   `class="snapmark"/>`;
  const line = (a, b) => seg(a, b, "snapmark");
  let g;
  switch (S.snap.kind) {
    case "endpoint": g = pts([[x - r, y - r], [x + r, y - r], [x + r, y + r],
                              [x - r, y + r]]); break;
    case "midpoint": g = pts([[x, y - r], [x + r, y + r * .8], [x - r, y + r * .8]]);
      break;
    case "center": g = `<circle cx="${x}" cy="${y}" r="${r}" class="snapmark"/>`;
      break;
    case "quadrant": g = pts([[x, y - r], [x + r, y], [x, y + r], [x - r, y]]); break;
    case "intersection": g = line([x - r, y - r], [x + r, y + r]) +
                             line([x - r, y + r], [x + r, y - r]); break;
    case "perpendicular": g = line([x - r, y - r], [x - r, y + r]) +
      line([x - r, y + r], [x + r, y + r]) + line([x - r, y], [x, y]) +
      line([x, y], [x, y + r]); break;
    case "tangent": g = `<circle cx="${x}" cy="${y + r * .25}" r="${r * .75}" ` +
      `class="snapmark"/>` + line([x - r, y - r * .5], [x + r, y - r * .5]); break;
    case "nearest": g = pts([[x - r, y - r], [x + r, y - r], [x - r, y + r],
                             [x + r, y + r]]); break;
    case "insertion": g = pts([[x - r, y - r], [x + r * .2, y - r],
      [x + r * .2, y - r * .2], [x + r, y - r * .2], [x + r, y + r],
      [x - r, y + r]]); break;
    case "node": g = `<circle cx="${x}" cy="${y}" r="${r}" class="snapmark"/>` +
      line([x - r * .7, y - r * .7], [x + r * .7, y + r * .7]) +
      line([x - r * .7, y + r * .7], [x + r * .7, y - r * .7]); break;
    default: g = pts([[x, y - r * 1.2], [x + r * 1.2, y], [x, y + r * 1.2],
                      [x - r * 1.2, y]]) +
      `<circle cx="${x}" cy="${y}" r="${r * .35}" class="snapdot"/>`;
  }
  const label = S.snap.label.replace(/ \(through VP-\d+\)$/, "");
  return g + `<text x="${(x + r * 1.7).toFixed(2)}" y="${(y - r * 1.3).toFixed(2)}" ` +
    `class="snaplabel" font-size="${(11 * k).toFixed(2)}" ` +
    `stroke-width="${(3 * k).toFixed(2)}">${esc(label)}</text>`;
}
// Entities picked by offset / fillet / measure-along, highlighted.
function picksSVG() {
  return S.picks.map(pk => outlineSVG(pk.entity, 0, 0) || "").join("");
}
// Measurements on screen: the line measured, or the square-off and the run
// along, each labelled.
function measSVG() {
  const k = pxScale();
  return S.meas.map(m => {
    if (m.kind === "area") {              // a label at the area's centroid
      const c = spacePx(m.a);
      return `<circle cx="${c[0].toFixed(2)}" cy="${c[1].toFixed(2)}" ` +
        `r="${(4 * k).toFixed(2)}" class="measdot"/><text x="${(c[0] + 7 * k).toFixed(2)}" ` +
        `y="${(c[1] - 7 * k).toFixed(2)}" class="measlabel" ` +
        `font-size="${(12 * k).toFixed(2)}" stroke-width="${(3 * k).toFixed(2)}">` +
        `${esc(m.label)}</text>`;
    }
    const a = spacePx(m.a), b = spacePx(m.b);
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const dot = q => `<circle cx="${q[0].toFixed(2)}" cy="${q[1].toFixed(2)}" ` +
                     `r="${(3.5 * k).toFixed(2)}" class="measdot"/>`;
    return seg(a, b, m.kind === "perp" ? "measdash" : "meas") + dot(a) + dot(b) +
      `<text x="${(mid[0] + 6 * k).toFixed(2)}" y="${(mid[1] - 6 * k).toFixed(2)}" ` +
      `class="measlabel" font-size="${(11.5 * k).toFixed(2)}" ` +
      `stroke-width="${(3 * k).toFixed(2)}">${esc(m.label)}</text>`;
  }).join("");
}
function renderSnapMenu() {
  const menu = $("snapmenu");
  menu.innerHTML = `<h4>OBJECT SNAP (F3)</h4>` + SNAP_KINDS.map(kd =>
    `<label><input type="checkbox" data-kind="${kd}"` +
    `${S.snapModes.has(kd) ? " checked" : ""}> ${esc(SNAP_NAMES[kd] || kd)}</label>`)
    .join("") +
    `<div class="snaphint">perpendicular and tangent work from the last point ` +
    `picked; on a sheet, snaps see the model through the viewport</div>`;
  menu.querySelectorAll("input").forEach(box => box.onchange = () => {
    if (box.checked) S.snapModes.add(box.dataset.kind);
    else S.snapModes.delete(box.dataset.kind);
    S.snap = null; drawOverlay();
  });
}
function toggleSnapMenu(force) {
  const menu = $("snapmenu");
  const open = force === undefined ? !menu.classList.contains("open") : force;
  if (open) {
    renderSnapMenu();
    const r = $("snapcfg").getBoundingClientRect();
    menu.style.left = `${Math.max(8, r.left - 120)}px`;
  }
  menu.classList.toggle("open", open);
}

// ------------------------------------------------ typed points and numbers
// While a tool waits for a point, the command line takes one: x,y ·
// N 3000 E 1000 · @dx,dy · @dist<angle (degrees CCW from east) ·
// @dist<N45E · a course (N 45°30' E 250, AZ 75 250, 40 L 250 -- turned from
// the last segment) · or just a distance, along the rubber band.
const NUM = "[-+]?(?:\\d+\\.?\\d*|\\.\\d+)";
async function typedPoint(text) {
  const t = text.trim();
  const last = S.pts.length ? S.pts[S.pts.length - 1] : null;
  let m;
  if ((m = t.match(new RegExp(`^(${NUM})\\s*,\\s*(${NUM})$`))))
    return [+m[1], +m[2]];
  if ((m = t.match(new RegExp(`^N\\s*(${NUM})\\s*,?\\s*E\\s*(${NUM})$`, "i"))))
    return [+m[2], +m[1]];                 // northing first, as it is said
  if ((m = t.match(new RegExp(`^E\\s*(${NUM})\\s*,?\\s*N\\s*(${NUM})$`, "i"))))
    return [+m[1], +m[2]];
  const station = await typedStation(t);  // 30+00@12R: by station and offset
  if (station) return station;
  if (!last) return null;
  if ((m = t.match(new RegExp(`^@(${NUM})\\s*,\\s*(${NUM})$`))))
    return [last[0] + +m[1], last[1] + +m[2]];
  if ((m = t.match(new RegExp(`^@(${NUM})\\s*<\\s*(${NUM})$`)))) {
    const a = +m[2] * Math.PI / 180;
    return [last[0] + +m[1] * Math.cos(a), last[1] + +m[1] * Math.sin(a)];
  }
  if ((m = t.match(new RegExp(`^(${NUM})$`)))) {
    if (!S.cursor) return null;           // direct distance: along the cursor
    const v = sub2(S.cursor, last), len = Math.hypot(v[0], v[1]);
    if (!len) return null;
    return add2(last, mul2(v, +m[1] / len));
  }
  let leg = t;                            // the engine reads bearings
  if ((m = t.match(new RegExp(`^@(${NUM})\\s*<\\s*(.+)$`)))) leg = `${m[2]} ${m[1]}`;
  // only something shaped like a course: a command typed meanwhile still runs
  if (!/^(?:[NS]\s*\d|AZ[\s=:]*\d|\d[\d.°'"\- ]*\s*(?:LT|RT|LEFT|RIGHT|L|R)\b|(?:LT|RT|LEFT|RIGHT|L|R)\s*\d)/i
        .test(leg)) return null;
  const params = { start: last, legs: [leg] };
  if (S.pts.length >= 2) {                // a deflection turns from the last segment
    const a = S.pts[S.pts.length - 2];
    params.initial_azimuth =
      ((90 - Math.atan2(last[1] - a[1], last[0] - a[0]) * 180 / Math.PI) % 360 + 360) % 360;
  }
  const r = await postJSON("/api/query", { query: "traverse", params });
  if (!r.ok) { logResult(r); return "error"; }
  return r.end;
}
// What the command line means while a tool is active, or false to run it.
async function toolInput(line) {
  const t = line.trim();
  if (TOOL_WORDS[t.toLowerCase()] && TOOLS[TOOL_WORDS[t.toLowerCase()]]) {
    logEcho(line); setTool(TOOL_WORDS[t.toLowerCase()]); return true;
  }
  if (modifyInput(t, line)) return true;
  if (S.tool === "fillet" && new RegExp(`^${NUM}$`).test(t) && +t >= 0) {
    S.filletRadius = +t; logEcho(line);
    logHint(`fillet radius ${t} — click the two lines`); return true;
  }
  if (S.tool === "offset" && (/^t(hrough)?$/i.test(t) ||
                              (new RegExp(`^${NUM}$`).test(t) && +t > 0))) {
    S.offsetDist = /^t/i.test(t) ? null : +t; logEcho(line);
    logHint(offsetSays()); return true;
  }
  const waiting = POINT_TOOLS.has(S.tool) && !["measurealong"].includes(S.tool)
    || (S.tool === "move" && S.selected) ||
    (S.tool === "measurealong" && S.picks.length) ||
    (SEL_TOOLS.has(S.tool) && S.selDone);
  if (!waiting) return false;
  const pt = await typedPoint(t);
  if (pt === null) return false;
  if (pt === "error") return true;
  logEcho(line);
  await toolClick(pt, { shiftKey: false, typed: true });
  return true;
}
async function finishTool() {
  if (SEL_TOOLS.has(S.tool) && !S.selDone) { await finishSelection(); return; }
  if (S.tool === "break" && S.breakPick) {
    const b = S.breakPick; S.breakPick = null; S.picks = [];
    await run("break_entity", { id: b.id, at: b.at }); drawOverlay(); return;
  }
  if (S.tool === "select" && S.selected) {
    if (S.selected.alignment) {
      logHint("edit the alignment by its grips or in the Properties panel");
      return;
    }
    if (S.selected.reference)
      logHint(`${S.selected.id} belongs to reference ` +
              `${S.selected.reference} (read-only)`);
    else openEditorFor(S.selected.id);
    return;
  }
  if (S.tool === "refclip") {
    if (S.pts.length >= 3) await finishRefClip();
    else logHint("a clip polygon needs at least 3 points");
    return;
  }
  if (S.tool === "pline" && S.pts.length >= 2) {
    const verts = S.pts; S.pts = [];
    await exec("draw_polyline", { vertices: verts });
  } else if (S.tool === "alignment" && S.pts.length >= 2) {
    const pts = S.pts; S.pts = []; drawOverlay();
    const layers = S.state ? S.state.layers.map(l => l.name) : ["0"];
    const v = await openForm("Create alignment by PI", [
      { key: "name", label: "Name", value: `ALIGN-${alignNames().length + 1}` },
      { key: "begin", label: "Begin station", value: "10+00" },
      { key: "radius", label: "Curve radius at interior PIs (ft; 0 = " +
        "tangents only, add curves later)", value: String(S.alignRadius) },
      { key: "layer", label: "Draw on layer",
        value: S.state ? S.state.current_layer : "0", options: layers },
      { key: "draw", label: "Draw now", value: "yes", options: ["yes", "no"] }]);
    if (v) {
      const R = Math.max(0, parseFloat(v.radius) || 0);
      S.alignRadius = R;
      const pis = pts.map((p, i) =>
        (i === 0 || i === pts.length - 1) ? p : [p[0], p[1], R]);
      const r = await postJSON("/api/execute", { command: "create_alignment",
        params: { name: v.name, begin_station: v.begin.trim() || "0", pis,
                  angle_points: true } });
      logResult(r);
      if (r.ok && v.draw === "yes")
        logResult(await postJSON("/api/execute", { command: "draw_alignment",
          params: { alignment: v.name, layer: v.layer } }));
      if (r.ok) { await refresh(); setTool("select"); selectAlignment(v.name); }
    }
  } else if (S.tool === "station" &&
             (S.stationPicks.length || alignNames().length)) {
    const aligns = alignNames();
    const fields = [];
    if (aligns.length)
      fields.push({ key: "alignment", label: "Alignment (design mode)",
        value: S.stationPicks.length ? "(picked entities)" : aligns[0],
        options: ["(picked entities)", ...aligns] });
    const sz = (S.state && S.state.annotation && S.state.annotation.model_sizes)
      || { text_height: 8, tick_half_len: 10, label_offset: 16 };
    fields.push(
      { key: "begin", label: "Begin station (picked entities only)",
        value: "10+00" },
      { key: "interval", label: "Interval (ft)", value: "100" },
      { key: "tick", label: "Tick half-length (ft)", value: String(sz.tick_half_len) },
      { key: "height", label: "Text height (ft)", value: String(sz.text_height) },
      { key: "offset", label: "Label offset (ft)", value: String(sz.label_offset) });
    const values = await openForm("Annotate stationing", fields);
    if (values) {
      const parseSta = s => s.includes("+")
        ? parseFloat(s.split("+")[0]) * 100 + parseFloat(s.split("+")[1] || 0)
        : parseFloat(s);
      const common = {
        interval: parseFloat(values.interval) || 100,
        tick_half_len: parseFloat(values.tick) || 10,
        text_height: parseFloat(values.height) || 8,
        label_offset: parseFloat(values.offset) || 16 };
      const useAlign = values.alignment &&
                       values.alignment !== "(picked entities)";
      if (useAlign)
        await exec("annotate_stationing", { alignment: values.alignment,
                                            ...common });
      else if (S.stationPicks.length)
        await exec("annotate_stationing", {
          path_ids: S.stationPicks.map(sp => sp.id),
          begin_station: parseSta(values.begin) || 0, ...common });
      else logHint("pick centerline entities first, or choose an alignment");
      S.stationPicks = [];
    }
  }
  drawOverlay();
}

// Reference clip tool: the picked polygon becomes a clip boundary (only the
// basefile inside it shows) or an added clip mask (the basefile inside it is
// hidden) on one attachment in the current space.
async function finishRefClip() {
  const refs = (S.state.references || []).filter(r => r.space === S.space);
  if (!refs.length) {
    logHint(`no reference is attached in ${spaceLabel()} — Insert ▸ Attach`);
    S.pts = []; drawOverlay(); return;
  }
  const poly = S.pts.map(p => [p[0], p[1]]);
  const v = await openForm("Reference clip", [
    { key: "ref", label: "Reference", value: refs[0].name,
      options: refs.map(r => r.name) },
    { key: "kind", label: "Polygon is a", value: "clip boundary",
      options: ["clip boundary", "clip mask (add)"] }]);
  S.pts = []; drawOverlay();
  if (!v) return;
  const ref = refs.find(r => r.name === v.ref) || refs[0];
  const changes = v.kind === "clip boundary"
    ? { clip: poly } : { masks: [...(ref.masks || []), poly] };
  logResult(await postJSON("/api/execute",
    { command: "modify_reference", params: { name: ref.name, changes } }));
}

// --------------------------------------------------------------- editors
async function applyChanges(id, changes) {
  if (!Object.keys(changes).length) { logHint("no changes"); return; }
  const r = await postJSON("/api/execute",
    { command: "modify_entity", params: { id, changes } });
  logResult(r);
  if (S.selected && S.selected.id === id) await reselect(id);
}

// Re-fetch the selected entity (after an edit, or on failure to revert the
// panel to server truth) and repaint the highlight + properties panel.
async function reselect(id) {
  const info = await postJSON("/api/query",
    { query: "get_entity", params: { id } });
  if (!S.selected || S.selected.id !== id) return;  // selection moved on
  S.selected = info.ok
    ? { id, bbox: info.bbox, entity: info.entity,
        reference: info.reference || null, properties: info.properties || null } : null;
  drawOverlay(); renderProps();
}

async function openEditorFor(id) {
  const info = await postJSON("/api/query",
    { query: "get_entity", params: { id } });
  if (!info.ok) { logResult(info); return; }
  const e = info.entity;
  if (e.type === "text") return editText(e);
  if (e.type === "table") return editTable(e);
  return editProperties(e);
}

async function editText(e) {
  const layers = S.state ? S.state.layers.map(l => l.name) : [e.layer];
  const styles = (S.state && S.state.text_styles) || ["STANDARD"];
  const v = await openForm(`Edit text ${e.id}`, [
    { key: "content", label: "Text", value: e.content, multiline: true },
    { key: "height", label: `Height (${S.view && S.view.kind === "model"
        ? "ft" : "in"})`, value: String(e.height) },
    { key: "rotation_deg", label: "Rotation (deg)",
      value: String(e.rotation_deg) },
    { key: "halign", label: "Justify H", value: e.halign,
      options: ["left", "center", "right"] },
    { key: "valign", label: "Justify V", value: e.valign,
      options: ["bottom", "middle", "top"] },
    { key: "style", label: "Style", value: e.style, options: styles },
    { key: "layer", label: "Layer", value: e.layer, options: layers },
  ]);
  if (!v) return;
  const changes = {};
  if (v.content !== e.content && v.content.trim())
    changes.content = v.content;
  const h = parseFloat(v.height);
  if (!isNaN(h) && h > 0 && h !== e.height) changes.height = h;
  const rot = parseFloat(v.rotation_deg);
  if (!isNaN(rot) && rot !== e.rotation_deg) changes.rotation_deg = rot;
  ["halign", "valign", "style", "layer"].forEach(k => {
    if (v[k] !== e[k]) changes[k] = v[k]; });
  await applyChanges(e.id, changes);
}

function serializeRows(rows) { return rows.map(r => r.join(" | ")).join("\n"); }
function parseRowsText(text, ncols) {
  return text.split("\n")
    .filter(line => line.trim() !== "")  // blank LINES only; " | " spacers stay
    .map(line => {
      const cells = line.split("|").map(s => s.trim()).slice(0, ncols);
      while (cells.length < ncols) cells.push("");
      return cells;
    });
}
async function editTable(e) {
  const unsafe = e.columns.some(c => /[|\n]/.test(c.header)) ||
    e.rows.some(r => r.some(cell => /[|\n]/.test(cell)));
  if (unsafe) {
    logHint("this table has cells containing '|' — opening the raw " +
            "Properties editor instead so nothing is corrupted");
    return editProperties(e);
  }
  const v = await openForm(`Edit table ${e.id}`, [
    { key: "title", label: "Title", value: e.title || "" },
    { key: "text_height", label: "Text height", value: String(e.text_height) },
    { key: "headers", label: "Headers (A | B | C)",
      value: e.columns.map(c => c.header).join(" | ") },
    { key: "rows", label: "Rows (one per line, cells with |)",
      value: e.rows.map(r => r.join(" | ")).join("\n"), multiline: true },
  ]);
  if (!v) return;
  const ncols = e.columns.length;
  const changes = {};
  if (v.title !== (e.title || "")) changes.title = v.title;
  const th = parseFloat(v.text_height);
  if (!isNaN(th) && th > 0 && th !== e.text_height) changes.text_height = th;
  const heads = v.headers.split("|").map(s => s.trim());
  if (heads.length === ncols) {
    if (JSON.stringify(heads) !==
        JSON.stringify(e.columns.map(c => c.header)))
      changes.columns = e.columns.map((c, i) =>
        ({ header: heads[i], width: c.width }));
  } else logHint(`headers unchanged: need ${ncols}, got ${heads.length}`);
  const userRows = parseRowsText(v.rows, ncols);
  const origRows = parseRowsText(serializeRows(e.rows), ncols);
  if (JSON.stringify(userRows) !== JSON.stringify(origRows))
    changes.rows = userRows;
  await applyChanges(e.id, changes);
}

async function editProperties(e) {
  const skip = new Set(["id", "type"]);
  const base = Object.entries(e).filter(([k]) => !skip.has(k));
  if (!("color" in e)) base.push(["color", null]);
  if (!("linetype" in e)) base.push(["linetype", null]);
  const fields = base.map(([k, val]) => ({
    key: k, label: k.replace(/_/g, " "),
    value: val === null ? "" :
           typeof val === "string" ? val : JSON.stringify(val),
    _orig: val,
  }));
  const v = await openForm(`Properties — ${e.type} ${e.id}`, fields);
  if (!v) return;
  const changes = {};
  fields.forEach(f => {
    const raw = v[f.key];
    let parsed;
    if (f.key === "color" || f.key === "linetype")
      parsed = raw === "" ? null : raw;  // empty always means ByLayer
    else if (raw === "" && (f._orig === null || typeof f._orig !== "string"))
      parsed = null;
    else if (typeof f._orig === "string" || f._orig === null) parsed = raw;
    else {
      try { parsed = JSON.parse(raw); }
      catch (err) {
        const nums = raw.split(",").map(Number);
        parsed = Array.isArray(f._orig) && nums.length > 1 &&
                 nums.every(n => !isNaN(n)) ? nums : raw;
      }
    }
    if (JSON.stringify(parsed) !== JSON.stringify(f._orig ?? null))
      changes[f.key] = parsed;
  });
  await applyChanges(e.id, changes);
}

// ------------------------------------------------------- properties panel
const fmtNum = v => String(Math.round(v * 10000) / 10000);

async function applyProp(changes) {
  if (!S.selected) return;
  const id = S.selected.id;
  const r = await postJSON("/api/execute",
    { command: "modify_entity", params: { id, changes } });
  logResult(r);
  await reselect(id);  // success updates the panel; failure reverts it
}

function propRow(label, node) {
  const row = document.createElement("div");
  row.className = "prow";
  const lab = document.createElement("label");
  lab.textContent = label; lab.title = label;
  row.append(lab, node);
  return row;
}
function propRO(label, text) {
  const span = document.createElement("span");
  span.className = "ro"; span.textContent = text; span.title = text;
  return propRow(label, span);
}
function propSelect(label, value, options, apply) {
  const sel = document.createElement("select");
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o; opt.textContent = o; opt.selected = o === value;
    sel.appendChild(opt);
  });
  sel.onchange = () => apply(sel.value);
  return propRow(label, sel);
}
function propInput(label, value, apply) {
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = value;
  inp.onkeydown = ev => {
    if (ev.key === "Enter") inp.blur();
    else if (ev.key === "Escape") { inp.value = value; inp.blur(); }
    ev.stopPropagation();
  };
  inp.onblur = () => { if (inp.value !== String(value)) apply(inp.value); };
  return propRow(label, inp);
}
function propNum(label, value, apply, opts = {}) {
  return propInput(label, fmtNum(value), raw => {
    const v = parseFloat(raw);
    if (isNaN(v)) { logHint(`${label}: "${raw}" is not a number`);
                    renderProps(); return; }
    if (opts.positive && v <= 0) { logHint(`${label} must be positive`);
                                   renderProps(); return; }
    apply(v);
  });
}
function propCheck(label, value, apply) {
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.checked = value;
  inp.onchange = () => apply(inp.checked);
  return propRow(label, inp);
}
function effectiveHex(e) {
  const named = (S.state && S.state.colors) || {};
  if (e.color) {
    if (e.color[0] === "#") return e.color;
    if (named[e.color]) return named[e.color];
  }
  const layer = S.state &&
    S.state.layers.find(l => l.name === e.layer);
  return layer ? layer.color : "#888888";
}
function propColor(e) {
  const named = Object.keys((S.state && S.state.colors) || {});
  const wrap = document.createElement("div");
  wrap.className = "colorwrap";
  const isHex = typeof e.color === "string" && e.color[0] === "#";
  const current = e.color == null ? "ByLayer" : isHex ? "Custom…" : e.color;
  const sel = document.createElement("select");
  ["ByLayer", ...named, "Custom…"].forEach(o => {
    const opt = document.createElement("option");
    opt.value = o; opt.textContent = o; opt.selected = o === current;
    sel.appendChild(opt);
  });
  const pick = document.createElement("input");
  pick.type = "color"; pick.value = effectiveHex(e).toLowerCase();
  pick.title = "pick a custom color";
  pick.onchange = () => applyProp({ color: pick.value.toUpperCase() });
  sel.onchange = () => {
    if (sel.value === "ByLayer") applyProp({ color: null });
    else if (sel.value === "Custom…") pick.click();
    else applyProp({ color: sel.value });
  };
  wrap.append(sel, pick);
  return propRow("Color", wrap);
}

// A number box for the PI table, shown to the hundredth of a foot: Enter or
// leaving it applies, Esc reverts, and an untouched box changes nothing.
function piField(value, title, onCommit) {
  const shown = (Math.round(value * 100) / 100).toFixed(2);
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = shown; inp.title = `${title}: ${fmtNum(value)}`;
  inp.onkeydown = ev => {
    if (ev.key === "Enter") inp.blur();
    else if (ev.key === "Escape") { inp.value = shown; inp.blur(); }
    ev.stopPropagation();
  };
  inp.onblur = () => {
    if (inp.value === shown) return;
    const v = parseFloat(inp.value);
    if (isNaN(v)) { logHint(`${title}: "${inp.value}" is not a number`);
                    inp.value = shown; return; }
    onCommit(v);
  };
  return inp;
}
// The Properties panel for a selected alignment: its PIs as a table, each
// change one modify_alignment (the drawn centerline follows).
function renderAlignmentProps(panel) {
  const a = alignmentOf(S.selected.alignment);
  if (!a) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  $("props-id").textContent = `alignment ${a.name}`;
  const body = $("props-body"); body.innerHTML = "";
  const add = row => body.appendChild(row);
  const sec = title => { const d = document.createElement("div");
    d.className = "psec"; d.textContent = title; body.appendChild(d); };
  const hint = text => { const d = document.createElement("div");
    d.className = "phint"; d.textContent = text; body.appendChild(d); };
  sec("ALIGNMENT");
  add(propInput("Name", a.name,
    v => v.trim() && alignmentChange(a.name, { rename: v.trim() })));
  add(propInput("Begin station", a.begin_station_text,
    v => alignmentChange(a.name, { begin_station: v.trim() })));
  add(propRO("Stations", a.station_range));
  add(propRO("Length", `${fmtNum(a.length)} ft`));
  add(propRO("Elements", `${a.tangents} tangent${a.tangents === 1 ? "" : "s"}, ` +
                         `${a.curves} curve${a.curves === 1 ? "" : "s"}`));
  if (!a.editable) {
    hint("back-to-back curves have no PIs between them, so this alignment " +
         "cannot be edited by PI");
    return;
  }
  sec("PIs — X, Y, curve radius (0 = none)");
  const n = a.pis.length;
  a.pis.forEach((q, i) => {
    const set = (k, v) => editAlignment(a.name, a.pis.map((x, j) => {
      if (j !== i) return x;
      const y = x.slice(); y[k] = v; return y; }));
    const cells = document.createElement("div");
    cells.className = "picells";
    cells.append(piField(q[0], `${piLabel(i, n)} X`, v => set(0, v)),
                 piField(q[1], `${piLabel(i, n)} Y`, v => set(1, v)));
    if (i > 0 && i < n - 1) {
      cells.append(piField(q[2] || 0, `${piLabel(i, n)} radius`,
        v => v < 0 ? logHint("a radius cannot be negative") : set(2, v)));
      const x = document.createElement("span");
      x.className = "x"; x.textContent = "✕"; x.title = `delete ${piLabel(i, n)}`;
      x.onclick = () => editAlignment(a.name, a.pis.filter((_, j) => j !== i));
      cells.append(x);
    } else cells.append(document.createElement("span"),
                        document.createElement("span"));
    const row = propRow(piLabel(i, n), cells);
    row.classList.add("pirow");
    add(row);
  });
  hint("Drag a triangle to move a PI, a circle to change its curve's " +
       "radius (onto the PI removes it), a hollow square in a corner to add " +
       "a curve, or one on a leg to add a PI.");
  if (!a.drawn) {
    const b = document.createElement("div");
    b.className = "zbtn"; b.textContent = `Draw on ${S.state.current_layer}`;
    b.onclick = async () => logResult(await postJSON("/api/execute",
      { command: "draw_alignment", params: { alignment: a.name,
        layer: S.state.current_layer } }));
    add(propRow("Not drawn", b));
  }
}

function renderProps() {
  const panel = $("props");
  if (S.selected && S.selected.alignment) { renderAlignmentProps(panel); return; }
  const e = S.selected && S.selected.entity;
  if (!e) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  $("props-id").textContent = `${e.type} ${e.id}`;
  const body = $("props-body"); body.innerHTML = "";
  const add = row => body.appendChild(row);
  const sec = title => {
    const d = document.createElement("div");
    d.className = "psec"; d.textContent = title;
    body.appendChild(d);
  };
  const hint = text => {
    const d = document.createElement("div");
    d.className = "phint"; d.textContent = text;
    body.appendChild(d);
  };

  if (S.selected.reference) {
    const unit = S.view && S.view.kind === "model" ? "ft" : "in";
    $("props-id").textContent = `${e.type} ${S.selected.id}`;
    sec("REFERENCE ELEMENT");
    add(propRO("Attachment", S.selected.reference));
    add(propRO("Level", e.layer));
    add(propRO("Type", e.type));
    if (e.type === "line") {
      add(propRO("Start", fmtPt(e.start)));
      add(propRO("End", fmtPt(e.end)));
      add(propRO("Length", `${fmtNum(dist(e.start, e.end))} ${unit}`));
    } else if (e.type === "circle") {
      add(propRO("Center", fmtPt(e.center)));
      add(propRO("Radius", `${fmtNum(e.radius)} ${unit}`));
    } else if (e.type === "arc") {
      add(propRO("Center", fmtPt(e.center)));
      add(propRO("Radius", `${fmtNum(e.radius)} ${unit}`));
      add(propRO("Angles", `${fmtNum(e.start_angle_deg)}° → ` +
                           `${fmtNum(e.end_angle_deg)}°`));
    } else if (e.type === "polyline") {
      add(propRO("Vertices", String(e.vertices.length)));
    } else if (e.type === "text") {
      add(propRO("Contents", e.content));
      add(propRO("Insertion", fmtPt(e.position)));
    }
    hint("read-only: this geometry lives in the basefile. Coordinates are " +
         "host units after true scale, placement and clipping.");
    return;
  }

  sec("GENERAL");
  add(propSelect("Layer", e.layer,
    S.state ? S.state.layers.map(l => l.name) : [e.layer],
    v => applyProp({ layer: v })));
  add(propColor(e));
  add(propSelect("Linetype", e.linetype || "ByLayer",
    ["ByLayer", ...((S.state && S.state.linetypes) || [])],
    v => applyProp({ linetype: v === "ByLayer" ? null : v })));

  const unit = S.view && S.view.kind === "model" ? "ft" : "in";
  const pr = S.selected.properties || {};
  if (e.type === "line") {
    sec("GEOMETRY");
    add(propNum("Start X", e.start[0],
      v => applyProp({ start: [v, e.start[1]] })));
    add(propNum("Start Y", e.start[1],
      v => applyProp({ start: [e.start[0], v] })));
    add(propNum("End X", e.end[0], v => applyProp({ end: [v, e.end[1]] })));
    add(propNum("End Y", e.end[1], v => applyProp({ end: [e.end[0], v] })));
    add(propRO("Length", `${fmtNum(dist(e.start, e.end))} ${unit}`));
    add(propRO("Angle",
      fmtNum(((angDeg(e.start, e.end) % 360) + 360) % 360) + "°"));
    if (pr.bearing) add(propRO("Bearing", pr.bearing));
  } else if (e.type === "circle") {
    sec("GEOMETRY");
    add(propNum("Center X", e.center[0],
      v => applyProp({ center: [v, e.center[1]] })));
    add(propNum("Center Y", e.center[1],
      v => applyProp({ center: [e.center[0], v] })));
    add(propNum("Radius", e.radius, v => applyProp({ radius: v }),
      { positive: true }));
  } else if (e.type === "arc") {
    sec("GEOMETRY");
    add(propNum("Center X", e.center[0],
      v => applyProp({ center: [v, e.center[1]] })));
    add(propNum("Center Y", e.center[1],
      v => applyProp({ center: [e.center[0], v] })));
    add(propNum("Radius", e.radius, v => applyProp({ radius: v }),
      { positive: true }));
    add(propNum("Start angle", e.start_angle_deg,
      v => applyProp({ start_angle_deg: v })));
    add(propNum("End angle", e.end_angle_deg,
      v => applyProp({ end_angle_deg: v })));
    if (pr.length !== undefined) {
      add(propRO("Length", `${fmtNum(pr.length)} ${unit}`));
      add(propRO("Delta", pr.delta));
      add(propRO("Chord", `${fmtNum(pr.chord)} ${unit} ${pr.chord_bearing}`));
    }
  } else if (e.type === "polyline") {
    sec("GEOMETRY");
    add(propRO("Vertices", String(e.vertices.length)));
    add(propCheck("Closed", e.closed, v => applyProp({ closed: v })));
    let len = 0;
    for (let i = 1; i < e.vertices.length; i++)
      len += dist(e.vertices[i - 1], e.vertices[i]);
    if (e.closed && e.vertices.length > 2)
      len += dist(e.vertices[e.vertices.length - 1], e.vertices[0]);
    add(propRO("Length", `${fmtNum(pr.length !== undefined ? pr.length : len)} ${unit}`));
    if (pr.arc_segments) add(propRO("Arc segments", String(pr.arc_segments)));
    if (pr.area !== undefined) add(propRO("Area", areaText(pr)));
    hint("drag a vertex grip to move it, a hollow midpoint grip to add " +
         "one; double-click the polyline for the raw editor");
  } else if (e.type === "text") {
    sec("TEXT");
    add(propInput("Contents", e.content,
      v => v.trim() ? applyProp({ content: v }) : renderProps()));
    add(propNum("Height", e.height, v => applyProp({ height: v }),
      { positive: true }));
    add(propNum("Rotation", e.rotation_deg,
      v => applyProp({ rotation_deg: v })));
    add(propSelect("Justify H", e.halign, ["left", "center", "right"],
      v => applyProp({ halign: v })));
    add(propSelect("Justify V", e.valign, ["bottom", "middle", "top"],
      v => applyProp({ valign: v })));
    add(propSelect("Style", e.style,
      (S.state && S.state.text_styles) || [e.style],
      v => applyProp({ style: v })));
    sec("GEOMETRY");
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
  } else if (e.type === "blockref") {
    sec("BLOCK");
    add(propRO("Block", e.block_name));
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
    add(propNum("Scale", e.scale, v => applyProp({ scale: v }),
      { positive: true }));
    add(propNum("Rotation", e.rotation_deg,
      v => applyProp({ rotation_deg: v })));
  } else if (e.type === "point") {
    sec("POINT");
    add(propNum("Number", e.number || 0, v => applyProp({ number: Math.round(v) }),
      { positive: true }));
    add(propNum("Northing", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
    add(propNum("Easting", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propInput("Elevation", e.elevation === null ? "" : fmtNum(e.elevation),
      v => applyProp({ elevation: v.trim() === "" ? null : parseFloat(v) })));
    add(propInput("Description", e.description || "",
      v => applyProp({ description: v })));
    add(propSelect("Marker", e.marker, ["x", "cross", "circle", "circle_x", "dot", "none"],
      v => applyProp({ marker: v })));
    add(propNum("Label height", e.text_height, v => applyProp({ text_height: v }),
      { positive: true }));
  } else if (e.type === "hatch") {
    sec("HATCH");
    add(propInput("Pattern", e.pattern,
      v => v.trim() ? applyProp({ pattern: v.trim().toUpperCase() }) : renderProps()));
    add(propNum("Scale", e.scale, v => applyProp({ scale: v }), { positive: true }));
    add(propNum("Angle", e.angle_deg, v => applyProp({ angle_deg: v })));
    add(propNum("Opacity", e.opacity, v => applyProp({ opacity: Math.min(1, v) }),
      { positive: true }));
    add(propRO("Loops", String(e.loops.length)));
    if (pr.area !== undefined) add(propRO("Area", areaText(pr)));
  } else if (e.type === "table") {
    sec("TABLE");
    add(propInput("Title", e.title || "", v => applyProp({ title: v })));
    add(propNum("Text height", e.text_height,
      v => applyProp({ text_height: v }), { positive: true }));
    add(propRO("Size", `${e.columns.length} cols × ${e.rows.length} rows`));
    sec("GEOMETRY");
    add(propNum("X", e.position[0],
      v => applyProp({ position: [v, e.position[1]] })));
    add(propNum("Y", e.position[1],
      v => applyProp({ position: [e.position[0], v] })));
    hint("double-click the table to edit headers and cells");
  }
}
$("props-close").onclick = () => { S.selected = null;
  drawOverlay(); renderProps(); };

// ------------------------------------------------------------------ grips
// AutoCAD's grips. A selected entity shows its editable points as small
// squares: drag one, or click it to pick it up and click again to drop it.
// Every grip hands back a modify_entity change set — the same edit the
// Properties panel makes — so a grip edit validates, journals and undoes
// exactly like a typed one, and the server stays the single source of truth.
const GRIP_PICK_PX = 8;   // how near the cursor must come to grab a grip
const GRIP_SIZE_PX = 7;   // the square's on-screen size, at any zoom

// Grips for one entity, in space units. kind drives only the look: "insert"
// grips (a polyline's segment midpoints) draw hollow, the rest solid.
function gripsFor(e) {
  if (!e) return [];
  const g = (pt, kind, label, patch) => ({ pt, kind, label, patch });

    p => withPI(i, [p[0], p[1], q[2] || 0]))));

    return `<rect x="${(q[0] - h).toFixed(2)}" y="${(q[1] - h).toFixed(2)}" ` +
           `width="${(h * 2).toFixed(2)}" height="${(h * 2).toFixed(2)}" ` +
           `class="${cls}"/>`;
  };
  // Civil 3D's shapes for an alignment: a triangle on each PI, a circle on
  // each curve; everything else is AutoCAD's square
  const triangle = (p, cls) => {
    const q = spacePx(p), h = GRIP_SIZE_PX * k * 0.75;
    return `<polygon points="${q[0]},${(q[1] - h).toFixed(2)} ` +
           `${(q[0] - h).toFixed(2)},${(q[1] + h * 0.8).toFixed(2)} ` +
           `${(q[0] + h).toFixed(2)},${(q[1] + h * 0.8).toFixed(2)}" ` +
           `class="${cls}"/>`;
  };
  const circle = (p, cls) => {
    const q = spacePx(p);
    return `<circle cx="${q[0].toFixed(2)}" cy="${q[1].toFixed(2)}" ` +
           `r="${(GRIP_SIZE_PX * k * 0.6).toFixed(2)}" class="${cls}"/>`;
  };
  const shape = gr => gr.kind === "pi" ? triangle
                    : gr.kind === "radius" ? circle : square;
  let out = "";
  currentGrips().forEach(gr => {
    if (active && active.grip === gr) return;   // that one is drawn hot below
    out += shape(gr)(gr.pt, "grip" + (gr.kind === "insert" ? " sec" : "") +
                            (gr === S.gripHover ? " over" : ""));
  });
  if (active) out += shape(active.grip)(active.at, "grip hot");
  return out;
}
function drawOverlay() {
  const svg = $("ovl");
  const img = $("view");
  if (!S.view || !img.naturalWidth) { svg.innerHTML = ""; return; }
  const nw = img.naturalWidth, nh = img.naturalHeight;
  let out = "";
  if (S.cursor && !["select", "pan"].includes(S.tool)) {
    const c = spacePx(S.cursor);
    out += seg([0, c[1]], [nw, c[1]], "ch") + seg([c[0], 0], [c[0], nh], "ch");
  }
  const px = S.pts.map(spacePx);
  const cur = S.cursor ? spacePx(S.cursor) : null;
  if (S.tool === "line" && px.length === 1 && cur) out += seg(px[0], cur, "rb");
  if (S.tool === "alignment" && S.pts.length) {
    // the layout as it will be created: curves of the radius last used
    const pis = (S.cursor ? [...S.pts, S.cursor] : S.pts).map((p, i, all) =>
      [p[0], p[1], i > 0 && i < all.length - 1 ? S.alignRadius : 0]);
    if (pis.length >= 2) out += alignmentSVG(pis, "rb");
  } else if (["pline", "refclip"].includes(S.tool) && px.length) {
    for (let i = 1; i < px.length; i++) out += seg(px[i - 1], px[i], "rb");
    if (cur) out += seg(px[px.length - 1], cur, "rb");
    if (S.tool === "refclip" && px.length >= 2)  // closing edge of the polygon
      out += seg(cur || px[px.length - 1], px[0], "rb");
  }
  if (S.tool === "circle" && px.length === 1 && cur) {
    const rp = dist(px[0], cur);
    out += `<circle cx="${px[0][0]}" cy="${px[0][1]}" r="${rp}" class="rb"/>`;
  }
  if (S.tool === "arc") {
    if (px.length === 1 && cur) out += seg(px[0], cur, "rb");
    if (px.length === 2 && cur && S.cursor) {
      const arc = arcFrom3(S.pts[0], S.pts[1], S.cursor);
      if (arc) {
        const s0 = ((arc.start % 360) + 360) % 360;
        let s1 = ((arc.end % 360) + 360) % 360;
        if (s1 <= s0) s1 += 360;
        const pts = [];
        for (let i = 0; i <= 32; i++) {
          const a = (s0 + (s1 - s0) * i / 32) * Math.PI / 180;
          pts.push(spacePx([arc.center[0] + arc.radius * Math.cos(a),
                            arc.center[1] + arc.radius * Math.sin(a)]));
        }
        out += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" ` +
               `class="rb"/>`;
      } else out += seg(px[0], cur, "rb");
    }
  }
  if (["dim", "dimaligned"].includes(S.tool) && px.length && cur) {
    // the dimension line follows the cursor, the same band a grip drags
    if (px.length < 2) out += seg(px[0], cur, "rb");
    else out += dimBandSVG(px[0], px[1], cur, S.tool === "dimaligned");
  }
  if (S.tool === "move" && S.selected && px.length === 1 && cur) {
    out += seg(px[0], cur, "rb");
    if (S.cursor)
      out += highlightSVG(S.cursor[0] - S.pts[0][0],
                          S.cursor[1] - S.pts[0][1], "rb");
  }
  if (SEL_TOOLS.has(S.tool) && S.selDone && S.pts.length === 1 && S.cursor &&
      ["copy", "rotate", "mirror"].includes(S.tool)) {
    const b = S.pts[0], c = S.cursor;
    let fn;
    if (S.tool === "copy") fn = q => [q[0] + c[0] - b[0], q[1] + c[1] - b[1]];
    else if (S.tool === "rotate") {
      const t = Math.atan2(c[1] - b[1], c[0] - b[0]), co = Math.cos(t), si = Math.sin(t);
      fn = q => [b[0] + (q[0] - b[0]) * co - (q[1] - b[1]) * si,
                 b[1] + (q[0] - b[0]) * si + (q[1] - b[1]) * co];
    } else {
      const L = dist(b, c) || 1, ux = (c[0] - b[0]) / L, uy = (c[1] - b[1]) / L;
      fn = q => { const dx = q[0] - b[0], dy = q[1] - b[1], d = dx * ux + dy * uy;
                  return [b[0] + 2 * d * ux - dx, b[1] + 2 * d * uy - dy]; };
    }
    out += seg(spacePx(b), cur, "rb");
    S.picks.forEach(pk => {
      (entityOutline(pk.entity) || []).forEach(sh => {
        const pts = sh.pts.map(q => spacePx(fn(q)).map(v => v.toFixed(2)).join(","))
          .join(" ");
        out += `<${sh.closed ? "polygon" : "polyline"} points="${pts}" class="rb"/>`;
      });
    });
  }
  S.stationPicks.forEach(sp => {
    const p = spacePx(sp.pt);
    out += `<rect x="${p[0] - 4}" y="${p[1] - 4}" width="8" height="8" ` +
           `class="mark"/>`;
  });
  if (S.selected) out += highlightSVG(0, 0);
  if (S.grip) out += gripGhostSVG(S.grip);
  out += gripsSVG();
  out += picksSVG() + measSVG() + snapSVG();
  svg.innerHTML = out;
}

// ----------------------------------------------------- stage interactions
const stage = $("stage");
let pan = null;
stage.addEventListener("pointerdown", ev => {
  if (ev.button === 1 || (ev.button === 0 && S.tool === "pan")) {
    pan = { x: ev.clientX, y: ev.clientY,
            bounds: S.view && S.view.bounds,
            sl: $("viewwrap").scrollLeft, st: $("viewwrap").scrollTop };
    stage.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  } else if (ev.button === 0 && !S.grip && S.view) {
    const pt = evtSpace(ev);       // a press on a grip grabs it, not the pick
    const grip = pt && gripAt(pt);
    if (grip) {
      startGrip(grip, ev);
      stage.setPointerCapture(ev.pointerId);
      ev.preventDefault();
      drawOverlay();
    }
  }
});
stage.addEventListener("pointermove", ev => {
  const pt = evtSpace(ev);
  if (pt) {
    S.hoverPt = pt;
    requestSnap(pt);
    const sp = snapped(pt);
    if (S.grip) S.grip.at = sp || orthoFrom(S.grip.grip.pt, pt, ev);
    S.gripHover = S.grip ? null : gripAt(pt);
    stage.style.cursor = S.gripHover ? "pointer" : "";
    S.cursor = sp || (["line", "pline", "alignment"].includes(S.tool)
      ? orthoAdjust(pt, ev) : pt);
    $("st-coord").textContent = fmtPt(sp || pt);
    drawOverlay();
  }
  if (pan) {
    if (S.view && S.view.kind === "model") {
      const t = `translate(${ev.clientX - pan.x}px, ${ev.clientY - pan.y}px)`;
      $("view").style.transform = t; $("ovl").style.transform = t;
    } else {
      $("viewwrap").scrollLeft = pan.sl - (ev.clientX - pan.x);
      $("viewwrap").scrollTop = pan.st - (ev.clientY - pan.y);
    }
  }
});
stage.addEventListener("pointerup", ev => {
  if (pan) {
    if (S.view && S.view.kind === "model" && pan.bounds) {
      const r = $("view").getBoundingClientRect();
      const b = pan.bounds;
      const dx = (ev.clientX - pan.x) / r.width * (b[2] - b[0]);
      const dy = (ev.clientY - pan.y) / r.height * (b[3] - b[1]);
      $("view").style.transform = ""; $("ovl").style.transform = "";
      if (dx || dy) {
        S.modelBounds = [b[0] - dx, b[1] + dy, b[2] - dx, b[3] + dy];
        updateCanvas();
      }
    }
    pan = null;
    return;
  }
  if (S.grip && !S.grip.hot) {
    // the two ways into a grip edit: drag it to its new place, or click it to
    // pick it up (it then follows the cursor until the next click sets it)
    const dragged = Math.hypot(ev.clientX - S.grip.down[0],
                               ev.clientY - S.grip.down[1]) > 3;
    const drop = evtSpace(ev);   // where it was let go, not where it last drew
    if (dragged)
      commitGrip(drop ? (snapped(drop) || orthoFrom(S.grip.grip.pt, drop, ev))
                      : S.grip.at);
    else {
      S.grip.hot = true;
      logHint(`${S.grip.grip.label} — click where it goes (Esc lets go)`);
      drawOverlay();
    }
    return;
  }
  if (ev.button === 0 && S.view) {
    const pt = evtSpace(ev);
    if (pt) toolClick(pt, ev);
  }
});
stage.addEventListener("dblclick", async ev => {
  ev.preventDefault();
  if (S.pts.length || S.stationPicks.length) {
    // the double-click's own two clicks each added a vertex; drop the dupe
    if ((S.tool === "pline" || S.tool === "alignment") && S.pts.length >= 3)
      S.pts.pop();
    finishTool();
    return;
  }
  if (S.tool !== "select") { finishTool(); return; }
  const pt = evtSpace(ev);
  if (!pt) return;
  const hits = await hitAt(pt, 8);
  if (hits.length) openEditorFor(hits[0].id);
});
stage.addEventListener("contextmenu", ev => { ev.preventDefault();
                                              finishTool(); });
stage.addEventListener("pointerleave", () => { S.cursor = null;
  S.gripHover = null; stage.style.cursor = ""; S.snap = null;
  $("st-coord").textContent = ""; drawOverlay(); });

// Wheel zoom: factor proportional to scroll delta (smooth on trackpads and
// scroll wheels alike), anchored at the cursor. Model space gets instant CSS
// feedback scaled about the cursor while the true re-render at the new
// coordinate window catches up; sheets zoom the raster with scroll anchoring.
let wheelTimer = null;
const pend = { k: 1, x: 0, y: 0 };
function applyPendingZoom() {
  const o = `${pend.x}px ${pend.y}px`;
  const t = pend.k === 1 ? "" : `scale(${pend.k})`;
  const img = $("view"), ovl = $("ovl");
  img.style.transformOrigin = o; ovl.style.transformOrigin = o;
  img.style.transform = t; ovl.style.transform = t;
}
function clearPendingZoom() {
  pend.k = 1;
  $("view").style.transform = ""; $("ovl").style.transform = "";
}
$("viewwrap").addEventListener("wheel", ev => {
  if (!S.view) return;
  ev.preventDefault();
  const delta = Math.max(-80, Math.min(80, ev.deltaY));
  const f = Math.exp(delta * 0.002);  // >1 zooms out, <1 zooms in
  if (f === 1) return;
  if (S.view.kind === "model") {
    const pt = evtSpace(ev);
    const b = S.modelBounds || S.view.bounds;
    S.modelBounds = [pt[0] - (pt[0] - b[0]) * f, pt[1] - (pt[1] - b[1]) * f,
                     pt[0] + (b[2] - pt[0]) * f, pt[1] + (b[3] - pt[1]) * f];
    const r = $("stage").getBoundingClientRect();
    pend.k /= f;
    pend.x = ev.clientX - r.left;
    pend.y = ev.clientY - r.top;
    applyPendingZoom();
    applyZoom();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(updateCanvas, 140);
  } else {
    const wrap = $("viewwrap");
    const oldZoom = S.zoom || 1;
    const newZoom = Math.max(0.3, Math.min(8, oldZoom / f));
    if (newZoom === oldZoom) return;
    const r = wrap.getBoundingClientRect();
    const cx = ev.clientX - r.left + wrap.scrollLeft;
    const cy = ev.clientY - r.top + wrap.scrollTop;
    const ratio = newZoom / oldZoom;
    S.zoom = newZoom;
    applyZoom();
    wrap.scrollLeft = cx * ratio - (ev.clientX - r.left);
    wrap.scrollTop = cy * ratio - (ev.clientY - r.top);
  }
}, { passive: false });

function applyZoom() {
  const st = $("stage");
  const model = S.space === "model";  // zooms by re-rendering a new window
  st.classList.toggle("fill", model);
  if (model) { st.style.width = "";
    $("zoompct").textContent = S.modelBounds ? "zoom" : "fit"; }
  else if (!S.zoom) { st.style.width = "calc(100% - 24px)";
    $("zoompct").textContent = "fit"; }
  else { st.style.width = (S.zoom * 100) + "%";
         $("zoompct").textContent = Math.round(S.zoom * 100) + "%"; }
}
// The model view is rendered to the canvas's shape, so a canvas that changes
// shape (a resized window, the Toolspace hidden, the layout settling while a
// render was on its way) gets a fresh render.
let resizeTimer = null;
function fitsCanvas() {
  const box = $("viewwrap").getBoundingClientRect(), b = S.view.bounds;
  return !box.height || Math.abs(box.width / box.height -
                                 (b[2] - b[0]) / (b[3] - b[1])) < 0.005;
}
function refitCanvas() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(updateCanvas, 150);
}
new ResizeObserver(() => {
  if (S.space === "model") refitCanvas();
}).observe($("viewwrap"));
function zoomBtn(f) {
  if (S.space === "model") {
    const b = S.modelBounds || (S.view && S.view.bounds);
    if (!b) return;
    const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    S.modelBounds = [cx - (cx - b[0]) * f, cy - (cy - b[1]) * f,
                     cx + (b[2] - cx) * f, cy + (b[3] - cy) * f];
    updateCanvas(); applyZoom();
  } else { S.zoom = Math.max(0.3, (S.zoom || 1) / f); applyZoom(); }
}
$("zin").onclick = () => zoomBtn(0.8);
$("zout").onclick = () => zoomBtn(1.25);
$("zfit").onclick = () => { S.zoom = 0; S.modelBounds = null; applyZoom();
                            updateCanvas(); };
$("zpng").onclick = () => window.open(imgURL(), "_blank");

// ----------------------------------------------------------------- modal
function openForm(title, fields) {
  return new Promise(resolve => {
    const modal = $("modal");
    modal.innerHTML = `<h3>${esc(title)}</h3>` + fields.map((f, i) =>
      `<div class="row${f.wide ? " wide" : ""}"><label>${esc(f.label)}</label>` +
      (f.multiline
        ? `<textarea id="mf${i}" rows="${Math.min(8, Math.max(3,
            String(f.value).split("\n").length + 1))}">\n${esc(f.value)}` +
          `</textarea>`
        : f.options
        ? `<select id="mf${i}">` + f.options.map(o =>
            `<option${o === f.value ? " selected" : ""}>${esc(o)}</option>`)
            .join("") + `</select>`
        : `<input type="text" id="mf${i}" value="${esc(f.value)}">`) +
      `</div>`).join("") +
      `<div class="actions"><div class="zbtn" id="mcancel">Cancel</div>` +
      `<div class="zbtn" id="mok">OK</div></div>`;
    $("modal-bg").style.display = "flex";
    const done = values => { $("modal-bg").style.display = "none";
                             resolve(values); };
    $("mok").onclick = () => done(Object.fromEntries(
      fields.map((f, i) => [f.key, $("mf" + i).value])));
    $("mcancel").onclick = () => done(null);
    modal.onkeydown = ev => {
      if (ev.key === "Enter" && ev.target.tagName !== "TEXTAREA")
        $("mok").click();
      if (ev.key === "Escape") $("mcancel").click();
      ev.stopPropagation();
    };
    $("mf0").focus();
    if ($("mf0").select) $("mf0").select();
  });
}
// A question with a few answers, laid out the macOS way: with three, the
// first sits apart on the left. Enter gives `enter`, Escape gives `escape`.
function askChoice(title, message, buttons, enter, escape) {
  return new Promise(resolve => {
    const modal = $("modal");
    modal.innerHTML = `<h3>${esc(title)}</h3><div class="msg">${esc(message)}` +
      `</div><div class="actions">` + buttons.map((b, i) =>
        `<div class="zbtn${b === enter ? " primary" : ""}` +
        `${i === 0 && buttons.length > 2 ? " left" : ""}" id="mb${i}">` +
        `${esc(b)}</div>`).join("") + `</div>`;
    $("modal-bg").style.display = "flex";
    const done = v => { $("modal-bg").style.display = "none"; resolve(v); };
    buttons.forEach((b, i) => { $("mb" + i).onclick = () => done(b); });
    modal.onkeydown = ev => {
      if (ev.key === "Enter") done(enter);
      if (ev.key === "Escape") done(escape);
      ev.stopPropagation();
    };
    modal.tabIndex = -1; modal.focus();
  });
}

// ------------------------------------------------------------------ files
// File New / Open / Save / Save As. The server knows which drawing is open
// and whether it has unsaved changes; a request without a path makes it ask
// with a native file dialog.
async function fileRequest(action, extra = {}) {
  let r = await postJSON("/api/file", { action, ...extra });
  if (!r.ok && r.error && r.error.type === "no_file_dialog") {
    // no native dialog on this machine: ask for the path in the page
    const path = prompt(action === "open" ? "Open which drawing? (path)"
                                          : "Save the drawing as (path)",
                        r.error.suggestion || "");
    if (!path) return { ok: false, cancelled: true };
    r = await postJSON("/api/file", { action, ...extra, path });
  }
  return r;
}
async function settleUnsaved(doing) {
  const f = S.state.file;
  const choice = await askChoice(
    `Save the changes to ${f.path ? f.name : S.state.project}?`,
    `Your changes are lost if you ${doing} without saving them.`,
    ["Don't Save", "Cancel", "Save"], "Save", "Cancel");
  if (choice === "Save") {
    const r = await fileRequest("save");
    if (!r.cancelled) logResult(r);
    return !!r.ok;
  }
  return choice === "Don't Save";
}
// Open and New replace the drawing. Unsaved changes are settled first, and
// the server will not drop them unless the person chose Don't Save.
async function replaceDrawing(action, doing, params) {
  let discard = false;
  if (S.state.file.dirty) {
    if (!(await settleUnsaved(doing))) return null;
    discard = true;
  }
  const p = typeof params === "function" ? await params() : params;
  if (!p) return null;
  let r = await fileRequest(action, { ...p, discard });
  if (!r.ok && r.error && r.error.type === "unsaved_changes") {
    if (!(await settleUnsaved(doing))) return null;  // changed meanwhile
    r = await fileRequest(action, { ...p, discard: true });
  }
  return r;
}
async function fileAct(act) {
  let r = null;
  if (act === "save") r = await fileRequest("save");
  else if (act === "saveas") r = await fileRequest("save_as");
  else if (act === "open")
    r = await replaceDrawing("open", "open another drawing", {});
  else if (act === "new")
    r = await replaceDrawing("new", "start a new drawing", async () => {
      const v = await openForm("New drawing",
        [{ key: "project", label: "Project name", value: "Untitled" }]);
      return v && { project: v.project.trim() || "Untitled" };
    });
  if (r && !r.cancelled) logResult(r);
  await refresh();
}
// The desktop window calls this when it is closed over unsaved changes. It
// stays open until they are saved or let go, then the page closes it.
async function rdConfirmClose() {
  await refresh();
  if (S.state.file.dirty && !(await settleUnsaved("close RoadDraft"))) return;
  window.pywebview.api.close_window();
}

// ------------------------------------------------------------ command bar
async function sendLine(line) {
  logEcho(line);
  const resp = await postJSON("/api/line", { line, space: S.space });
  if (resp.kind === "noop") { if (resp.message) logHint(resp.message); }
  else if (resp.kind === "error")
    logHTML(`<span class="err">✗ ${esc(resp.message)}</span>`);
  else if (resp.kind === "space") { S.space = resp.space;
    logHint(resp.message); renderLTabs(); renderStatus(); updateCanvas(); }
  else if (resp.kind === "help") {
    if (resp.item)
      logHTML(`<span class="ok">${esc(resp.item.name)}</span> ` +
        `<span class="hint">(${esc(resp.item.kind)}): ` +
        `${esc(resp.item.description)}</span>` +
        jsonBlock(resp.item.example, "example") +
        jsonBlock(resp.item.params_schema, "schema"));
    else logHTML(`<span class="hint">` + resp.topics.map(t =>
      `<b>${esc(t.name)}</b> — ${esc(t.description)}`).join("<br>") +
      `</span>`);
  } else if (resp.kind === "result") logResult(resp.result);
}
$("cmd").addEventListener("keydown", ev => {
  ev.stopPropagation();
  const input = $("cmd");
  if (ev.key === "Enter") {
    const line = input.value.trim();
    if (!line) return;
    S.history.push(line); S.hIdx = S.history.length; input.value = "";
    toolInput(line).then(done => { if (!done) sendLine(line); });
  } else if (ev.key === "ArrowUp") {
    if (S.hIdx > 0) { S.hIdx--; input.value = S.history[S.hIdx]; }
    ev.preventDefault();
  } else if (ev.key === "ArrowDown") {
    if (S.hIdx < S.history.length - 1) { S.hIdx++;
      input.value = S.history[S.hIdx]; }
    else { S.hIdx = S.history.length; input.value = ""; }
    ev.preventDefault();
  } else if (ev.key === "Tab") {
    ev.preventDefault();
    const parts = input.value.split(" ");
    if (parts.length === 1 && parts[0]) {
      const matches = S.names.filter(n =>
        n.startsWith(parts[0].toLowerCase()));
      if (matches.length === 1) input.value = matches[0] + " ";
      else if (matches.length > 1) logHint(matches.join("  "));
    }
  } else if (ev.key === "Escape") { input.value = ""; input.blur(); }
});
$("run").onclick = () => {
  const line = $("cmd").value.trim();
  if (line) { S.history.push(line); S.hIdx = S.history.length;
              $("cmd").value = "";
              toolInput(line).then(done => { if (!done) sendLine(line); }); }
};

$("q-saveas").onclick = () => fileAct("saveas");
$("q-undo").onclick = () => ribbonAct("undo");
$("q-redo").onclick = () => ribbonAct("redo");
$("tog-ortho").onclick = () => { S.ortho = !S.ortho;
  $("tog-ortho").classList.toggle("on", S.ortho); };
$("tog-osnap").onclick = () => { S.osnap = !S.osnap; S.snap = null;
  $("tog-osnap").classList.toggle("on", S.osnap); drawOverlay(); };
$("snapcfg").onclick = ev => { ev.stopPropagation(); toggleSnapMenu(); };
document.addEventListener("pointerdown", ev => {
  if (!$("snapmenu").contains(ev.target) && ev.target !== $("snapcfg"))
    toggleSnapMenu(false);
});
$("st-annoscale").onchange = async ev => {
  const v = ev.target.value;
  logEcho(`annoscale ${v}`);
  logResult(await postJSON("/api/execute", { command: "set_annotation_scale",
    params: { scale: v === "off" ? null : parseFloat(v) } }));
  ev.target.blur();
};

// ------------------------------------------------------- global keyboard
// File shortcuts work wherever the focus is, the command line included:
// this listener runs in the capture phase, before the focused element's own.
document.addEventListener("keydown", ev => {
  if (!(ev.metaKey || ev.ctrlKey) || ev.altKey) return;
  if ($("modal-bg").style.display === "flex") return;
  const key = ev.key.toLowerCase();
  const act = key === "s" ? (ev.shiftKey ? "saveas" : "save")
            : ev.shiftKey ? null
            : key === "o" ? "open" : key === "n" ? "new" : null;
  if (!act) return;
  ev.preventDefault(); ev.stopPropagation();
  fileAct(act);
}, true);
const TOOL_KEYS = { v: "select", h: "pan", l: "line", p: "pline",
                    c: "circle", a: "arc", t: "text", s: "station",
                    m: "move", e: "erase", i: "insblock", x: "edittext",
                    g: "alignment", o: "offset", f: "fillet", d: "measure",
                    b: "traverse" };
document.addEventListener("keydown", ev => {
  if ($("modal-bg").style.display === "flex") return;  // dialog owns the keys
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" ||
      ev.target.tagName === "SELECT") return;
  const key = ev.key.toLowerCase();
  if (key === "p" && (ev.metaKey || ev.ctrlKey)) {
    ev.preventDefault(); ribbonAct("print");
  }
  else if (ev.key === "F8") { ev.preventDefault(); $("tog-ortho").click(); }
  else if (ev.key === "F3") { ev.preventDefault(); $("tog-osnap").click(); }
  else if (TOOL_KEYS[key] && !ev.metaKey && !ev.ctrlKey)
    setTool(TOOL_KEYS[key]);
  else if (ev.key === "Enter") finishTool();
  else if (ev.key === "Escape") cancelTool();
  else if ((ev.key === "Delete" || ev.key === "Backspace") && S.selected) {
    if (S.selected.alignment) {
      logHint(`to delete alignment ${S.selected.alignment}, use ✕ on its ` +
              `row in Toolspace ▸ Alignments; ✕ in the PI table deletes a PI`);
      return;
    }
    if (S.selected.reference) {
      logHint(`${S.selected.id} is a reference element — detach the ` +
              `reference or edit the basefile instead`);
      return;
    }
    postJSON("/api/execute", { command: "delete_entities",
      params: { ids: [S.selected.id] } }).then(logResult);
    S.selected = null; drawOverlay(); renderProps();
  }
});

// ------------------------------------------------------------------- SSE
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("conn").textContent = "● live";
                      $("conn").classList.remove("bad"); };
  es.onmessage = ev => {
    try { const { rev } = JSON.parse(ev.data);
          if (rev !== S.rev) refresh(); } catch (e) {}
  };
  es.onerror = () => { $("conn").textContent = "○ reconnecting…";
                       $("conn").classList.add("bad"); };
}

// ------------------------------------------------------------------ boot
(async function boot() {
  renderRibbon();
  setTool("select");
  const manifest = await getJSON("/api/manifest");
  const names = new Set();
  manifest.commands.concat(manifest.queries).forEach(i => names.add(i.name));
  ["line","pline","arc","circle","text","insert","table","sheet","viewport",
   "titleblock","erase","move","mklayer","layer","space","state","layers",
   "sheets","blocks","styles","entities","extents","journal","help","dxf",
   "pdf","print","plot","save","undo","redo","station","xref","refs","alignment",
   "drawalign","profile","label","curvetable","landxmlin","landxml","sta2xy",
   "xy2sta","design","anchor","alignments","annoscale","annoscales","annoadd",
   "annodel","annopaper","bd","cogo","traverse","offset","fillet","dist",
   "snap","keypoints","trim","extend","copy","rotate","mirror","scale","array",
   "break","join","explode","chamfer","lengthen","hatch","area","point","points",
   "pointtable","labelseg","linetable","so","along","divide","list"].forEach(n =>
    names.add(n));
  S.names = [...names].sort();
  await refresh();
  connect();
  logHint("RoadDraft ready. Ribbon tools are selectable (or keys " +
    "V/H/L/P/C/A/T/S/M/E/I/G, B bearing & distance, O offset, F fillet, " +
    "D measure); click the canvas to draw. Picks snap to endpoints, " +
    "midpoints, centers, intersections and alignment PIs/BCs/ECs (OSNAP, " +
    "F3; ▾ picks the modes). While a tool waits for a point, type one: " +
    "x,y · N 3000 E 1000 · @dx,dy · N 45°30' E 250 · 40 L 250 · or a " +
    "distance along the cursor, or a station and offset: 30+00@12R. Select an " +
    "entity and drag its grips to edit it. Type a tool's name (trim, copy, " +
    "rotate, mirror, hatch, area…) to start it. ORTHO and F8 constrain to " +
    "horizontal/vertical. The command line speaks the full language — 'help' " +
    "lists it.");
})();
</script>
