$("props-close").onclick = () => { S.selected = null;
  drawOverlay(); renderProps(); };

// ------------------------------------------------------------------ grips
// AutoCAD's grips. A selected entity shows its editable points as small
// squares: drag one, or click it to pick it up and click again to drop it.
// Every grip hands back a modify_entity change set — the same edit the
// Properties panel makes — so a grip edit validates, journals and undoes
// exactly like a typed one, and the server stays the single source of truth.
const GRIP_PICK_PX = 8;   // how near the cursor must come to grab a grip
const GRIP_SIZE_PX = 7;   // the square's on-screen size, at any zoom

// Grips for one entity, in space units. kind drives only the look: "insert"
// grips (a polyline's segment midpoints) draw hollow, the rest solid.
function gripsFor(e) {
  if (!e) return [];
  const g = (pt, kind, label, patch) => ({ pt, kind, label, patch });
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const at = (c, r, deg) => [c[0] + r * Math.cos(deg * Math.PI / 180),
                             c[1] + r * Math.sin(deg * Math.PI / 180)];
  if (e.type === "line") {
    const c = mid(e.start, e.end);
    return [
      g(e.start, "vertex", "start point", p => ({ start: p })),
      g(c, "move", "midpoint (moves the whole line)", p => {
        const d = [p[0] - c[0], p[1] - c[1]];
        return { start: [e.start[0] + d[0], e.start[1] + d[1]],
                 end: [e.end[0] + d[0], e.end[1] + d[1]] };
      }),
      g(e.end, "vertex", "end point", p => ({ end: p }))];
  }
  if (e.type === "polyline" && e.vertices.length) {
    const v = e.vertices;
    const out = v.map((w, i) => g(w, "vertex", `vertex ${i + 1} of ${v.length}`,
      p => ({ vertices: v.map((x, j) => j === i ? p : x) })));
    // a closed polyline has one more segment: the one back to the start
    const segs = e.closed && v.length > 2 ? v.length : v.length - 1;
    for (let i = 0; i < segs; i++)   // a midpoint grip adds a vertex there
      out.push(g(mid(v[i], v[(i + 1) % v.length]), "insert",
        `midpoint of segment ${i + 1} (adds a vertex)`,
        p => ({ vertices: [...v.slice(0, i + 1), p, ...v.slice(i + 1)] })));
    return out;
  }
  if (e.type === "circle")
    return [g(e.center, "move", "center", p => ({ center: p }))].concat(
      [0, 90, 180, 270].map(deg => g(at(e.center, e.radius, deg), "radius",
        "quadrant (changes the radius)",
        p => ({ radius: Math.max(dist(e.center, p), 1e-6) }))));
  if (e.type === "arc") {
    const [s0, s1] = arcSweepDeg(e.start_angle_deg, e.end_angle_deg);
    return [
      g(e.center, "move", "center", p => ({ center: p })),
      g(at(e.center, e.radius, e.start_angle_deg), "vertex", "start angle",
        p => ({ start_angle_deg: angDeg(e.center, p) })),
      g(at(e.center, e.radius, (s0 + s1) / 2), "radius",
        "midpoint (changes the radius)",
        p => ({ radius: Math.max(dist(e.center, p), 1e-6) })),
      g(at(e.center, e.radius, e.end_angle_deg), "vertex", "end angle",
        p => ({ end_angle_deg: angDeg(e.center, p) }))];
  }
  if (["text", "blockref", "table"].includes(e.type))
    return [g(e.position, "move", "insertion point", p => ({ position: p }))];
  if (e.type === "dimension") {
    // A dimension stores the measurement, so its grips move measured points
    // and the place the dimension line was dragged to — the number, arrows
    // and extension lines re-derive from wherever they land. A radial kind
    // measures a circle, so its measured points stay on it.
    const radial = ["radius", "diameter", "arc_length"].includes(e.kind);
    const onArc = p => radial && e.center && e.radius
      ? at(e.center, e.radius, angDeg(e.center, p)) : p;
    const out = [];
    if (e.center)
      out.push(g(e.center, "move", "center of the measured arc",
        p => ({ center: p })));
    if (e.p1)
      out.push(g(e.p1, "vertex", "first measured point",
        p => ({ p1: onArc(p) })));
    if (e.p2)
      out.push(g(e.p2, "vertex", "second measured point",
        p => ({ p2: onArc(p) })));
    out.push(g(e.line_point, "line",
      "dimension line (drag it to place the line and text)",
      p => ({ line_point: p })));
    return out;
  }
  return [];
}

// Grips belong to the entity as the server last described it; recompute when
// that object is replaced (an edit, an undo, another client's command).
function currentGrips() {
  const sel = S.selected;
  if (!sel || sel.reference || S.tool !== "select") return [];
  if (sel.gripsOf !== sel.entity) {
    sel.gripsOf = sel.entity; sel.grips = gripsFor(sel.entity);
  }
  return sel.grips;
}
// The grip under a point, or null. Measured in space units off a pixel
// tolerance, so the grab radius is the same few pixels at any zoom.
function gripAt(pt) {
  let best = null, near = GRIP_PICK_PX * unitsPerPx();
  currentGrips().forEach(gr => {
    const d = dist(gr.pt, pt);
    if (d <= near) { best = gr; near = d; }
  });
  return best;
}
function startGrip(grip, ev) {
  S.grip = { grip, at: grip.pt, hot: false, down: [ev.clientX, ev.clientY] };
  S.gripHover = null;
}
// Land the edit: the grip's patch for the point it was let go at.
async function commitGrip(pt) {
  const active = S.grip;
  S.grip = null; S.gripHover = null;
  drawOverlay();
  if (!active || !S.selected) return;
  await applyProp(active.grip.patch(pt));
}

// --------------------------------------------------------------- overlay
function seg(a, b, cls) {
  return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ` +
         `class="${cls}"/>`;
}
function arcSweepDeg(s, e) {
  s = ((s % 360) + 360) % 360; e = ((e % 360) + 360) % 360;
  if (e <= s) e += 360;
  return [s, e];
}
function sampleArcPts(c, r, a0, a1) {
  const n = Math.max(16, Math.ceil((a1 - a0) / 6));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    pts.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]);
  }
  return pts;
}
// Space-coordinate polylines tracing an entity's real shape; null means the
// caller should fall back to the bbox (text, tables, block references).
function entityOutline(e) {
  if (!e) return null;
  if (e.type === "line") return [{ pts: [e.start, e.end] }];
  if (e.type === "polyline" && e.vertices.length >= 2)
    return [{ pts: e.vertices, closed: e.closed }];
  if (e.type === "circle")
    return [{ pts: sampleArcPts(e.center, e.radius, 0, 360), closed: true }];
  if (e.type === "arc") {
    const [s, en] = arcSweepDeg(e.start_angle_deg, e.end_angle_deg);
    return [{ pts: sampleArcPts(e.center, e.radius, s, en) }];
  }
  return null;
}
// One entity traced in overlay pixels, shifted by [dx, dy] space units, or
// null when it has no traceable outline. Default styling is the glow
// highlight; pass cls (e.g. "rb") for a rubber-band ghost.
function outlineSVG(entity, dx, dy, cls) {
  const shapes = entityOutline(entity);
  if (!shapes) return null;
  const shift = p => [p[0] + dx, p[1] + dy];
  return shapes.map(sh => {
    const tag = sh.closed ? "polygon" : "polyline";
    const pts = sh.pts.map(p => spacePx(shift(p))
      .map(v => v.toFixed(2)).join(",")).join(" ");
    return cls
      ? `<${tag} points="${pts}" class="${cls}"/>`
      : `<${tag} points="${pts}" class="hlglow"/>` +
        `<${tag} points="${pts}" class="hlcore"/>`;
  }).join("");
}
// The selected entity, drawn shifted by [dx, dy] space units. Entities with
// no outline of their own (text, tables, blocks) fall back to their box.
function highlightSVG(dx, dy, cls) {
  if (!S.selected) return "";
  const traced = outlineSVG(S.selected.entity, dx, dy, cls);
  if (traced !== null) return traced;
  const shift = p => [p[0] + dx, p[1] + dy];
  const bb = S.selected.bbox;
  if (!bb) return "";
  const a = spacePx(shift([bb[0], bb[1]])), b = spacePx(shift([bb[2], bb[3]]));
  return `<rect x="${Math.min(a[0], b[0])}" y="${Math.min(a[1], b[1])}" ` +
         `width="${Math.abs(b[0] - a[0])}" ` +
         `height="${Math.abs(b[1] - a[1])}" class="${cls || "hlbox"}"/>`;
}
// The linework a linear or aligned dimension would draw, in overlay pixels:
// the measured pair, the dimension line out at lp, and the extension lines
// that reach it. The engine reads line_point the same way — along the pair
// for an aligned dimension, across one axis for a linear one (the axis that
// separates the points, or the one lp is dragged clear of).
function dimBandSVG(a, b, lp, aligned) {
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let on;
  if (aligned) {
    const len = dist(a, b) || 1;
    const u = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
    const d = [lp[0] - m[0], lp[1] - m[1]];
    const along = d[0] * u[0] + d[1] * u[1];     // slide across only
    const off = [d[0] - u[0] * along, d[1] - u[1] * along];
    on = q => [q[0] + off[0], q[1] + off[1]];
  } else {
    const dx = Math.abs(b[0] - a[0]), dy = Math.abs(b[1] - a[1]);
    const horizontal = dx < 1e-9 ? false : dy < 1e-9 ? true :
      Math.abs(lp[1] - m[1]) >= Math.abs(lp[0] - m[0]);
    on = q => horizontal ? [q[0], lp[1]] : [lp[0], q[1]];
  }
  return seg(a, b, "rb") + seg(on(a), on(b), "rb") +
         seg(a, on(a), "rb") + seg(b, on(b), "rb");
}
// A dimension under a grip: what it measures, not the finished linework —
// arrowheads, the number and the extension lines are the engine's to derive
// once the edit lands.
function dimGhostSVG(d) {
  const P = p => spacePx(p);
  if (["linear", "aligned"].includes(d.kind) && d.p1 && d.p2)
    return dimBandSVG(P(d.p1), P(d.p2), P(d.line_point), d.kind === "aligned");
  if (!d.center) return "";
  const c = P(d.center), lp = P(d.line_point);
  let out = seg(c, lp, "rb");
  if (d.p1) out += seg(c, P(d.p1), "rb");
  if (d.p2) out += seg(c, P(d.p2), "rb");
  if (d.radius && d.p1)
    out += `<circle cx="${c[0]}" cy="${c[1]}" r="${dist(c, P(d.p1))}" ` +
           `class="rb"/>`;
  return out;
}
// The edit as it would land: the entity with the dragged grip's patch on it.
function gripGhostSVG(active) {
  const e = S.selected && S.selected.entity;
  if (!e) return "";
  const patched = { ...e, ...active.grip.patch(active.at) };
  const traced = outlineSVG(patched, 0, 0, "rb");
  if (traced !== null) return traced;
  if (patched.type === "dimension") return dimGhostSVG(patched);
  return highlightSVG(patched.position[0] - e.position[0],
                      patched.position[1] - e.position[1], "rb");
}
function gripsSVG() {
  const active = S.grip, k = pxScale();
  const square = (p, cls) => {
    const q = spacePx(p), h = GRIP_SIZE_PX * k / 2;
    return `<rect x="${(q[0] - h).toFixed(2)}" y="${(q[1] - h).toFixed(2)}" ` +
           `width="${(h * 2).toFixed(2)}" height="${(h * 2).toFixed(2)}" ` +
           `class="${cls}"/>`;
  };
  let out = "";
  currentGrips().forEach(gr => {
    if (active && active.grip === gr) return;   // that one is drawn hot below
    out += square(gr.pt, "grip" + (gr.kind === "insert" ? " sec" : "") +
                         (gr === S.gripHover ? " over" : ""));
  });
  if (active) out += square(active.at, "grip hot");
  return out;
}
function drawOverlay() {
  const svg = $("ovl");
  const img = $("view");
  if (!S.view || !img.naturalWidth) { svg.innerHTML = ""; return; }
  const nw = img.naturalWidth, nh = img.naturalHeight;
  let out = "";
  if (S.cursor && !["select", "pan"].includes(S.tool)) {
    const c = spacePx(S.cursor);
    out += seg([0, c[1]], [nw, c[1]], "ch") + seg([c[0], 0], [c[0], nh], "ch");
  }
  const px = S.pts.map(spacePx);
  const cur = S.cursor ? spacePx(S.cursor) : null;
  if (S.tool === "line" && px.length === 1 && cur) out += seg(px[0], cur, "rb");
  if (["pline", "refclip", "alignment"].includes(S.tool) && px.length) {
    for (let i = 1; i < px.length; i++) out += seg(px[i - 1], px[i], "rb");
    if (cur) out += seg(px[px.length - 1], cur, "rb");
    if (S.tool === "refclip" && px.length >= 2)  // closing edge of the polygon
      out += seg(cur || px[px.length - 1], px[0], "rb");
  }
  if (S.tool === "circle" && px.length === 1 && cur) {
    const rp = dist(px[0], cur);
    out += `<circle cx="${px[0][0]}" cy="${px[0][1]}" r="${rp}" class="rb"/>`;
  }
  if (S.tool === "arc") {
    if (px.length === 1 && cur) out += seg(px[0], cur, "rb");
    if (px.length === 2 && cur && S.cursor) {
      const arc = arcFrom3(S.pts[0], S.pts[1], S.cursor);
      if (arc) {
        const s0 = ((arc.start % 360) + 360) % 360;
        let s1 = ((arc.end % 360) + 360) % 360;
        if (s1 <= s0) s1 += 360;
        const pts = [];
        for (let i = 0; i <= 32; i++) {
          const a = (s0 + (s1 - s0) * i / 32) * Math.PI / 180;
          pts.push(spacePx([arc.center[0] + arc.radius * Math.cos(a),
                            arc.center[1] + arc.radius * Math.sin(a)]));
        }
        out += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" ` +
               `class="rb"/>`;
      } else out += seg(px[0], cur, "rb");
    }
  }
  if (["dim", "dimaligned"].includes(S.tool) && px.length && cur) {
    // the dimension line follows the cursor, the same band a grip drags
    if (px.length < 2) out += seg(px[0], cur, "rb");
    else out += dimBandSVG(px[0], px[1], cur, S.tool === "dimaligned");
  }
  if (S.tool === "move" && S.selected && px.length === 1 && cur) {
    out += seg(px[0], cur, "rb");
    if (S.cursor)
      out += highlightSVG(S.cursor[0] - S.pts[0][0],
                          S.cursor[1] - S.pts[0][1], "rb");
  }
  S.stationPicks.forEach(sp => {
    const p = spacePx(sp.pt);
    out += `<rect x="${p[0] - 4}" y="${p[1] - 4}" width="8" height="8" ` +
           `class="mark"/>`;
  });
  if (S.selected) out += highlightSVG(0, 0);
  if (S.grip) out += gripGhostSVG(S.grip);
  out += gripsSVG();
  svg.innerHTML = out;
}

// ----------------------------------------------------- stage interactions
const stage = $("stage");
let pan = null;
stage.addEventListener("pointerdown", ev => {
  if (ev.button === 1 || (ev.button === 0 && S.tool === "pan")) {
    pan = { x: ev.clientX, y: ev.clientY,
            bounds: S.view && S.view.bounds,
            sl: $("viewwrap").scrollLeft, st: $("viewwrap").scrollTop };
    stage.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  } else if (ev.button === 0 && !S.grip && S.view) {
    const pt = evtSpace(ev);       // a press on a grip grabs it, not the pick
    const grip = pt && gripAt(pt);
    if (grip) {
      startGrip(grip, ev);
      stage.setPointerCapture(ev.pointerId);
      ev.preventDefault();
      drawOverlay();
    }
  }
});
stage.addEventListener("pointermove", ev => {
  const pt = evtSpace(ev);
  if (pt) {
    if (S.grip) S.grip.at = orthoFrom(S.grip.grip.pt, pt, ev);
    S.gripHover = S.grip ? null : gripAt(pt);
    stage.style.cursor = S.gripHover ? "pointer" : "";
    S.cursor = ["line", "pline", "alignment"].includes(S.tool)
      ? orthoAdjust(pt, ev) : pt;
    $("st-coord").textContent = fmtPt(pt);
    drawOverlay();
  }
  if (pan) {
    if (S.view && S.view.kind === "model") {
      const t = `translate(${ev.clientX - pan.x}px, ${ev.clientY - pan.y}px)`;
      $("view").style.transform = t; $("ovl").style.transform = t;
    } else {
      $("viewwrap").scrollLeft = pan.sl - (ev.clientX - pan.x);
      $("viewwrap").scrollTop = pan.st - (ev.clientY - pan.y);
    }
  }
});
stage.addEventListener("pointerup", ev => {
  if (pan) {
    if (S.view && S.view.kind === "model" && pan.bounds) {
      const r = $("view").getBoundingClientRect();
      const b = pan.bounds;
      const dx = (ev.clientX - pan.x) / r.width * (b[2] - b[0]);
      const dy = (ev.clientY - pan.y) / r.height * (b[3] - b[1]);
      $("view").style.transform = ""; $("ovl").style.transform = "";
      if (dx || dy) {
        S.modelBounds = [b[0] - dx, b[1] + dy, b[2] - dx, b[3] + dy];
        updateCanvas();
      }
    }
    pan = null;
    return;
  }
  if (S.grip && !S.grip.hot) {
    // the two ways into a grip edit: drag it to its new place, or click it to
    // pick it up (it then follows the cursor until the next click sets it)
    const dragged = Math.hypot(ev.clientX - S.grip.down[0],
                               ev.clientY - S.grip.down[1]) > 3;
    const drop = evtSpace(ev);   // where it was let go, not where it last drew
    if (dragged)
      commitGrip(drop ? orthoFrom(S.grip.grip.pt, drop, ev) : S.grip.at);
    else {
      S.grip.hot = true;
      logHint(`${S.grip.grip.label} — click where it goes (Esc lets go)`);
      drawOverlay();
    }
    return;
  }
  if (ev.button === 0 && S.view) {
    const pt = evtSpace(ev);
    if (pt) toolClick(pt, ev);
  }
});
stage.addEventListener("dblclick", async ev => {
  ev.preventDefault();
  if (S.pts.length || S.stationPicks.length) {
    // the double-click's own two clicks each added a vertex; drop the dupe
    if ((S.tool === "pline" || S.tool === "alignment") && S.pts.length >= 3)
      S.pts.pop();
    finishTool();
    return;
  }
  if (S.tool !== "select") { finishTool(); return; }
  const pt = evtSpace(ev);
  if (!pt) return;
  const hits = await hitAt(pt, 8);
  if (hits.length) openEditorFor(hits[0].id);
});
stage.addEventListener("contextmenu", ev => { ev.preventDefault();
                                              finishTool(); });
stage.addEventListener("pointerleave", () => { S.cursor = null;
  S.gripHover = null; stage.style.cursor = "";
  $("st-coord").textContent = ""; drawOverlay(); });

// Wheel zoom: factor proportional to scroll delta (smooth on trackpads and
// scroll wheels alike), anchored at the cursor. Model space gets instant CSS
// feedback scaled about the cursor while the true re-render at the new
// coordinate window catches up; sheets zoom the raster with scroll anchoring.
let wheelTimer = null;
const pend = { k: 1, x: 0, y: 0 };
function applyPendingZoom() {
  const o = `${pend.x}px ${pend.y}px`;
  const t = pend.k === 1 ? "" : `scale(${pend.k})`;
  const img = $("view"), ovl = $("ovl");
  img.style.transformOrigin = o; ovl.style.transformOrigin = o;
  img.style.transform = t; ovl.style.transform = t;
}
function clearPendingZoom() {
  pend.k = 1;
  $("view").style.transform = ""; $("ovl").style.transform = "";
}
$("viewwrap").addEventListener("wheel", ev => {
  if (!S.view) return;
  ev.preventDefault();
  const delta = Math.max(-80, Math.min(80, ev.deltaY));
  const f = Math.exp(delta * 0.002);  // >1 zooms out, <1 zooms in
  if (f === 1) return;
  if (S.view.kind === "model") {
    const pt = evtSpace(ev);
    const b = S.modelBounds || S.view.bounds;
    S.modelBounds = [pt[0] - (pt[0] - b[0]) * f, pt[1] - (pt[1] - b[1]) * f,
                     pt[0] + (b[2] - pt[0]) * f, pt[1] + (b[3] - pt[1]) * f];
    const r = $("stage").getBoundingClientRect();
    pend.k /= f;
    pend.x = ev.clientX - r.left;
    pend.y = ev.clientY - r.top;
    applyPendingZoom();
    applyZoom();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(updateCanvas, 140);
  } else {
    const wrap = $("viewwrap");
    const oldZoom = S.zoom || 1;
    const newZoom = Math.max(0.3, Math.min(8, oldZoom / f));
    if (newZoom === oldZoom) return;
    const r = wrap.getBoundingClientRect();
    const cx = ev.clientX - r.left + wrap.scrollLeft;
    const cy = ev.clientY - r.top + wrap.scrollTop;
    const ratio = newZoom / oldZoom;
    S.zoom = newZoom;
    applyZoom();
    wrap.scrollLeft = cx * ratio - (ev.clientX - r.left);
    wrap.scrollTop = cy * ratio - (ev.clientY - r.top);
  }
}, { passive: false });

function applyZoom() {
  const st = $("stage");
  if (!S.zoom) { st.style.width = "calc(100% - 24px)";
    $("zoompct").textContent =
      S.space === "model" && S.modelBounds ? "zoom" : "fit"; }
  else { st.style.width = (S.zoom * 100) + "%";
         $("zoompct").textContent = Math.round(S.zoom * 100) + "%"; }
}
function zoomBtn(f) {
  if (S.space === "model") {
    const b = S.modelBounds || (S.view && S.view.bounds);
    if (!b) return;
    const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    S.modelBounds = [cx - (cx - b[0]) * f, cy - (cy - b[1]) * f,
                     cx + (b[2] - cx) * f, cy + (b[3] - cy) * f];
    updateCanvas(); applyZoom();
  } else { S.zoom = Math.max(0.3, (S.zoom || 1) / f); applyZoom(); }
}
$("zin").onclick = () => zoomBtn(0.8);
$("zout").onclick = () => zoomBtn(1.25);
$("zfit").onclick = () => { S.zoom = 0; S.modelBounds = null; applyZoom();
                            updateCanvas(); };
$("zpng").onclick = () => window.open(imgURL(), "_blank");

// ----------------------------------------------------------------- modal
function openForm(title, fields) {
  return new Promise(resolve => {
    const modal = $("modal");
    modal.innerHTML = `<h3>${esc(title)}</h3>` + fields.map((f, i) =>
      `<div class="row"><label>${esc(f.label)}</label>` +
      (f.multiline
        ? `<textarea id="mf${i}" rows="${Math.min(8, Math.max(3,
            String(f.value).split("\n").length + 1))}">\n${esc(f.value)}` +
          `</textarea>`
        : f.options
        ? `<select id="mf${i}">` + f.options.map(o =>
            `<option${o === f.value ? " selected" : ""}>${esc(o)}</option>`)
            .join("") + `</select>`
        : `<input type="text" id="mf${i}" value="${esc(f.value)}">`) +
      `</div>`).join("") +
      `<div class="actions"><div class="zbtn" id="mcancel">Cancel</div>` +
      `<div class="zbtn" id="mok">OK</div></div>`;
    $("modal-bg").style.display = "flex";
    const done = values => { $("modal-bg").style.display = "none";
                             resolve(values); };
    $("mok").onclick = () => done(Object.fromEntries(
      fields.map((f, i) => [f.key, $("mf" + i).value])));
    $("mcancel").onclick = () => done(null);
    modal.onkeydown = ev => {
      if (ev.key === "Enter" && ev.target.tagName !== "TEXTAREA")
        $("mok").click();
      if (ev.key === "Escape") $("mcancel").click();
      ev.stopPropagation();
    };
    $("mf0").focus();
    if ($("mf0").select) $("mf0").select();
  });
}

// ------------------------------------------------------------ command bar
async function sendLine(line) {
  logEcho(line);
  const resp = await postJSON("/api/line", { line, space: S.space });
  if (resp.kind === "noop") { if (resp.message) logHint(resp.message); }
  else if (resp.kind === "error")
    logHTML(`<span class="err">✗ ${esc(resp.message)}</span>`);
  else if (resp.kind === "space") { S.space = resp.space;
    logHint(resp.message); renderLTabs(); renderStatus(); updateCanvas(); }
  else if (resp.kind === "help") {
    if (resp.item)
      logHTML(`<span class="ok">${esc(resp.item.name)}</span> ` +
        `<span class="hint">(${esc(resp.item.kind)}): ` +
        `${esc(resp.item.description)}</span>` +
        jsonBlock(resp.item.example, "example") +
        jsonBlock(resp.item.params_schema, "schema"));
    else logHTML(`<span class="hint">` + resp.topics.map(t =>
      `<b>${esc(t.name)}</b> — ${esc(t.description)}`).join("<br>") +
      `</span>`);
  } else if (resp.kind === "result") logResult(resp.result);
}
$("cmd").addEventListener("keydown", ev => {
  ev.stopPropagation();
  const input = $("cmd");
  if (ev.key === "Enter") {
    const line = input.value.trim();
    if (!line) return;
    S.history.push(line); S.hIdx = S.history.length; input.value = "";
    sendLine(line);
  } else if (ev.key === "ArrowUp") {
    if (S.hIdx > 0) { S.hIdx--; input.value = S.history[S.hIdx]; }
    ev.preventDefault();
  } else if (ev.key === "ArrowDown") {
    if (S.hIdx < S.history.length - 1) { S.hIdx++;
      input.value = S.history[S.hIdx]; }
    else { S.hIdx = S.history.length; input.value = ""; }
    ev.preventDefault();
  } else if (ev.key === "Tab") {
    ev.preventDefault();
    const parts = input.value.split(" ");
    if (parts.length === 1 && parts[0]) {
      const matches = S.names.filter(n =>
        n.startsWith(parts[0].toLowerCase()));
      if (matches.length === 1) input.value = matches[0] + " ";
      else if (matches.length > 1) logHint(matches.join("  "));
    }
  } else if (ev.key === "Escape") { input.value = ""; input.blur(); }
});
$("run").onclick = () => {
  const line = $("cmd").value.trim();
  if (line) { S.history.push(line); S.hIdx = S.history.length;
              $("cmd").value = ""; sendLine(line); }
};

// -------------------------------------------------------------- QAT etc.
$("q-save").innerHTML = icon("save", 16);
$("q-undo").innerHTML = icon("undo", 16);
$("q-redo").innerHTML = icon("redo", 16);
$("q-save").onclick = () => ribbonAct("save");
$("q-undo").onclick = () => ribbonAct("undo");
$("q-redo").onclick = () => ribbonAct("redo");
$("tog-ortho").onclick = () => { S.ortho = !S.ortho;
  $("tog-ortho").classList.toggle("on", S.ortho); };
$("st-annoscale").onchange = async ev => {
  const v = ev.target.value;
  logEcho(`annoscale ${v}`);
  logResult(await postJSON("/api/execute", { command: "set_annotation_scale",
    params: { scale: v === "off" ? null : parseFloat(v) } }));
  ev.target.blur();
};

// ------------------------------------------------------- global keyboard
const TOOL_KEYS = { v: "select", h: "pan", l: "line", p: "pline",
                    c: "circle", a: "arc", t: "text", s: "station",
                    m: "move", e: "erase", i: "insblock", x: "edittext",
                    g: "alignment" };
document.addEventListener("keydown", ev => {
  if ($("modal-bg").style.display === "flex") return;  // dialog owns the keys
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" ||
      ev.target.tagName === "SELECT") return;
  const key = ev.key.toLowerCase();
  if (key === "p" && (ev.metaKey || ev.ctrlKey)) {
    ev.preventDefault(); ribbonAct("print");
  }
  else if (ev.key === "F8") { ev.preventDefault(); $("tog-ortho").click(); }
  else if (TOOL_KEYS[key] && !ev.metaKey && !ev.ctrlKey)
    setTool(TOOL_KEYS[key]);
  else if (ev.key === "Enter") finishTool();
  else if (ev.key === "Escape") cancelTool();
  else if ((ev.key === "Delete" || ev.key === "Backspace") && S.selected) {
    if (S.selected.reference) {
      logHint(`${S.selected.id} is a reference element — detach the ` +
              `reference or edit the basefile instead`);
      return;
    }
    postJSON("/api/execute", { command: "delete_entities",
      params: { ids: [S.selected.id] } }).then(logResult);
    S.selected = null; drawOverlay(); renderProps();
  }
});

// ------------------------------------------------------------------- SSE
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("conn").textContent = "● live";
                      $("conn").classList.remove("bad"); };
  es.onmessage = ev => {
    try { const { rev } = JSON.parse(ev.data);
          if (rev !== S.rev) refresh(); } catch (e) {}
  };
  es.onerror = () => { $("conn").textContent = "○ reconnecting…";
                       $("conn").classList.add("bad"); };
}

// ------------------------------------------------------------------ boot
(async function boot() {
  renderRibbon();
  setTool("select");
  const manifest = await getJSON("/api/manifest");
  const names = new Set();
  manifest.commands.concat(manifest.queries).forEach(i => names.add(i.name));
  ["line","pline","arc","circle","text","insert","table","sheet","viewport",
   "titleblock","erase","move","mklayer","layer","space","state","layers",
   "sheets","blocks","styles","entities","extents","journal","help","dxf",
   "pdf","print","plot","save","undo","redo","station","xref","refs","alignment",
   "drawalign","profile","label","curvetable","landxmlin","landxml","sta2xy",
   "xy2sta","design","anchor","alignments","annoscale","annoscales","annoadd",
   "annodel","annopaper"].forEach(n =>
    names.add(n));
  S.names = [...names].sort();
  await refresh();
  connect();
  logHint("RoadDraft ready. Ribbon tools are selectable (or keys " +
    "V/H/L/P/C/A/T/S/M/E/I/G); click the canvas to draw. Select an entity " +
    "and drag its grips to edit it. ORTHO and F8 constrain to horizontal/" +
    "vertical. The command line speaks the full language — 'help' lists it.");
})();
</script>
