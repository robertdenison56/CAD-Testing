[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roaddraft"
version = "0.1.0"
description = "Headless 2D CAD engine for the RoadDraft RL environment - AutoCAD/MicroStation-style model+sheet drafting with a fully machine-exposed command surface"
requires-python = ">=3.9"
dependencies = [
    "ezdxf>=1.1",
    "matplotlib>=3.7",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
roaddraft = "roaddraft.cli.repl:main"
roaddraft-web = "roaddraft.web.server:main"
roaddraft-mcp = "roaddraft.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roaddraft = ["web/static/*"]
